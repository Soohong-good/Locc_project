spring:
  application:
    name: locc
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
  
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # ⚠️ [SECURITY] REDIS_PASSWORD 환경변수를 반드시 설정하세요.
      # Redis에는 Rate Limit 카운터·이메일 인증코드·비밀번호 재설정 토큰이 저장됩니다.
      # 비밀번호 없이 Redis가 외부에 노출되면 토큰 탈취·조작·Rate Limit 우회가 가능합니다.
      # 운영 배포 시 REDIS_PASSWORD 환경변수 미설정은 보안 사고로 이어질 수 있습니다.
      password: ${REDIS_PASSWORD:}
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy}
            redirect-uri: "${KAKAO_REDIRECT_URI:http://localhost:3000/login/oauth2/code/kakao}"
            authorization-grant-type: authorization_code
            client-name: Kakao
            scope:
              - account_email
          naver:
            client-id: ${NAVER_CLIENT_ID:dummy}
            client-secret: ${NAVER_CLIENT_SECRET:dummy}
            redirect-uri: "${NAVER_REDIRECT_URI:http://localhost:3000/login/oauth2/code/naver}"
            authorization-grant-type: authorization_code
            client-name: Naver
            scope:
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:20MB}       # 단일 파일 최대 크기
      max-request-size: ${MAX_REQUEST_SIZE:100MB} # 요청 전체(파일+파라미터) 최대 크기

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:18000000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  url: ${APP_URL:}
  frontend-url: ${APP_FRONTEND_URL:}
  cors-origins:
    - ${APP_CORS_ORIGIN_1:http://localhost:3000}
    - ${APP_CORS_ORIGIN_2:http://localhost:8080}
  oauth2-redirect-url: ${APP_OAUTH2_REDIRECT_URL:/oauth2/callback}
  # JWT 쿠키 Secure 플래그: 운영(HTTPS)=true, 개발(HTTP)=false
  cookie-secure: ${APP_COOKIE_SECURE:false}
  # 에러 알림 수신 이메일 (비워두면 비활성화)
  admin-email: ${ADMIN_ALERT_EMAIL:}

kakao:
  map:
    api-key: ${KAKAO_MAP_API_KEY}

# YouTube Data API 설정
youtube:
  api-key: ${YOUTUBE_API_KEY}
  playlists:
    # 주일오전 2부 예배 재생목록 (메인)
    sunday-morning-2: ${YOUTUBE_PLAYLIST_SUNDAY_MORNING_2:PLj3rgPIpeTF10nn1D8bSg_kwD3P1o5wA0}
    # 주일오전 1부 예배 재생목록
    sunday-morning-1: ${YOUTUBE_PLAYLIST_SUNDAY_MORNING_1:PLj3rgPIpeTF2mjKcq_zGjeJAPP-Ewu4Dq}
    # 주일오후 예배 재생목록
    sunday-afternoon: ${YOUTUBE_PLAYLIST_SUNDAY_AFTERNOON:PLj3rgPIpeTF3wwDXBqNRvvbo6u48D3VNf}
    # 수요예배 재생목록
    wednesday: ${YOUTUBE_PLAYLIST_WEDNESDAY:PLj3rgPIpeTF1UT1T-9yPnzcnZBQBSGkaT}
    # 금요기도회 재생목록
    friday: ${YOUTUBE_PLAYLIST_FRIDAY:PLj3rgPIpeTF0xu1vRW8R5Det5MD_IrMYu}
    # 송구영신예배 재생목록 (없으면 빈값 → 관리자가 UI에서 직접 설정)
    newyear: ${YOUTUBE_PLAYLIST_NEWYEAR:}

# 파일 업로드 설정
file:
  # 기본값: 프로젝트 루트 하위 uploads/ (git에서 제외됨 — .gitignore 참고)
  # Docker: docker-compose에서 FILE_UPLOAD_DIR=/app/uploads 로 덮어씀
  upload-dir: ${FILE_UPLOAD_DIR:uploads}


server:
  port: ${SERVER_PORT:8080}
  # 신뢰된 리버스 프록시(Nginx 등)의 X-Forwarded-* 헤더를 Spring이 처리하도록 설정
  # ForwardedHeaderFilter Bean과 함께 동작 — 클라이언트가 직접 조작한 헤더는 무시됨
  forward-headers-strategy: FRAMEWORK
  tomcat:
    # Tomcat 커넥터의 POST 데이터 최대 크기 (-1 = 무제한, Spring multipart 설정이 제어)
    # 기본값 2MB → 에디터 본문에 base64 이미지가 포함되면 초과될 수 있어 max-request-size에 맞춤
    max-http-form-post-size: ${MAX_REQUEST_SIZE:100MB}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: ${ERROR_INCLUDE_MESSAGE:never}
    include-stacktrace: ${ERROR_INCLUDE_STACKTRACE:never}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.example.locc: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level - %msg%n"
  file:
    name: ${LOG_FILE_NAME:logs/application.log}
    max-size: ${LOG_FILE_MAX_SIZE:10MB}
    max-history: ${LOG_FILE_MAX_HISTORY:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
