<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">
<head>
    <title>주보</title>
</head>

<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-16 bg-slate-50 px-6">
        <div class="max-w-7xl mx-auto">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <p class="text-xs tracking-[0.3em] text-slate-400 uppercase mb-3">Weekly Bulletin</p>
                    <h1 class="text-4xl md:text-5xl font-light text-slate-900 tracking-tight mb-4">주보</h1>
                    <p class="text-lg text-slate-600 font-light">주간 예배 및 교회 소식을 확인하세요</p>
                </div>
                <!-- 관리자 글쓰기 버튼 -->
                <div sec:authorize="hasRole('ADMIN')">
                    <button onclick="BulletinList.openWriteModal()"
                            class="px-6 py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium">
                        + 새 주보 등록
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 검색 Section -->
    <section class="py-8 bg-white px-6 border-b border-slate-200">
        <div class="max-w-7xl mx-auto">
            <form th:action="@{/church/bulletin}" method="get" class="flex gap-3">
                <input type="text"
                       name="keyword"
                       th:value="${keyword}"
                       placeholder="검색어를 입력하세요"
                       class="flex-1 px-4 py-3 border border-slate-300 focus:border-slate-900 focus:outline-none transition text-base">
                <button type="submit"
                        class="px-8 py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium">
                    검색
                </button>
            </form>
        </div>
    </section>

    <!-- 주보 목록 -->
    <section class="py-16 bg-white px-6">
        <div class="max-w-6xl mx-auto">
            <!-- 목록이 없을 때 -->
            <div th:if="${bulletins.empty}" class="text-center py-20">
                <svg class="w-16 h-16 mx-auto text-slate-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <p class="text-slate-500 font-light">등록된 주보가 없습니다.</p>
            </div>

            <!-- 게시판 형식 목록 -->
            <div th:unless="${bulletins.empty}">
                <!-- 테이블 헤더 -->
                <div class="hidden md:grid grid-cols-12 gap-4 py-4 px-4 border-b-2 border-slate-900 text-base font-medium text-slate-700">
                    <div class="col-span-1 text-center">썸네일</div>
                    <div class="col-span-5">제목</div>
                    <div class="col-span-2 text-center">작성자</div>
                    <div class="col-span-2 text-center">작성일</div>
                    <div class="col-span-2 text-center">조회수</div>
                </div>

                <!-- 테이블 바디 -->
                <div th:each="bulletin : ${bulletins.content}"
                     class="grid grid-cols-1 md:grid-cols-12 gap-2 md:gap-4 py-5 px-4 border-b border-slate-200 hover:bg-slate-50 transition-all duration-200 items-center group">

                    <!-- 썸네일 -->
                    <div class="col-span-1 flex items-center justify-center">
                        <a th:href="@{/church/bulletin/{id}(id=${bulletin.id})}" class="block">
                            <div th:if="${bulletin.thumbnailUrl != null && !bulletin.thumbnailUrl.isEmpty()}"
                                 class="w-16 h-20 bg-cover bg-center border border-slate-200"
                                 th:style="'background-image: url(' + ${bulletin.thumbnailUrl} + ');'">
                            </div>
                            <div th:unless="${bulletin.thumbnailUrl != null && !bulletin.thumbnailUrl.isEmpty()}"
                                 class="w-16 h-20 bg-gradient-to-br from-slate-100 to-slate-200 flex items-center justify-center border border-slate-200">
                                <svg class="w-8 h-8 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                </svg>
                            </div>
                        </a>
                    </div>

                    <!-- 제목 -->
                    <div class="col-span-1 md:col-span-5">
                        <a th:href="@{/church/bulletin/{id}(id=${bulletin.id})}"
                           class="text-base md:text-lg hover:underline hover:text-blue-600 transition-colors text-slate-700 font-light"
                           th:text="${bulletin.title}">
                            제목
                        </a>
                    </div>

                    <!-- 작성자 -->
                    <div class="col-span-1 md:col-span-2 flex items-center md:justify-center">
                        <span class="text-sm md:text-base text-slate-500 md:text-slate-600"
                              th:text="${bulletin.authorName}">작성자</span>
                    </div>

                    <!-- 작성일 -->
                    <div class="col-span-1 md:col-span-2 flex items-center md:justify-center">
                        <span class="text-sm md:text-base text-slate-400 md:text-slate-500"
                              th:text="${#temporals.format(bulletin.createdAt, 'yyyy-MM-dd')}">2025-12-19</span>
                    </div>

                    <!-- 조회수 + 관리자 버튼 -->
                    <div class="col-span-1 md:col-span-2 flex items-center justify-between md:justify-center gap-4">
                        <span class="text-sm md:text-base text-slate-400 md:text-slate-500 font-light"
                              th:text="${bulletin.viewCount}">134</span>

                        <!-- 관리자 버튼 -->
                        <div sec:authorize="hasRole('ADMIN')" class="flex gap-2">
                            <button class="bulletin-delete-btn p-2 bg-slate-100 text-red-600 hover:bg-red-50 hover:text-red-700 rounded-lg transition-all duration-200"
                                    th:data-id="${bulletin.id}"
                                    th:data-title="${bulletin.title}"
                                    title="삭제">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 페이지네이션 (10개 초과 시에만 표시) -->
            <div th:if="${bulletins.totalElements > 10}" class="flex justify-center mt-12">
                <nav class="flex items-center gap-2">
                    <!-- 이전 페이지 -->
                    <a th:if="${!bulletins.first}"
                       th:href="@{/church/bulletin(page=${bulletins.number - 1}, keyword=${keyword})}"
                       class="px-3 py-2 text-slate-600 hover:bg-slate-100 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                        </svg>
                    </a>

                    <!-- 페이지 번호 -->
                    <th:block th:each="i : ${#numbers.sequence(0, bulletins.totalPages - 1)}">
                        <a th:href="@{/church/bulletin(page=${i}, keyword=${keyword})}"
                           th:classappend="${i == bulletins.number} ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'"
                           class="px-4 py-2 transition font-light"
                           th:text="${i + 1}">1</a>
                    </th:block>

                    <!-- 다음 페이지 -->
                    <a th:if="${!bulletins.last}"
                       th:href="@{/church/bulletin(page=${bulletins.number + 1}, keyword=${keyword})}"
                       class="px-3 py-2 text-slate-600 hover:bg-slate-100 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </a>
                </nav>
            </div>
        </div>
    </section>
</main>

<!-- 글쓰기 모달 -->
<th:block layout:fragment="modals">
<div id="bulletinModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
    <!-- 배경 오버레이 -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>

    <!-- 모달 컨텐츠 -->
    <div class="relative bg-white w-full max-w-3xl max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
        <!-- 헤더 -->
        <div class="flex items-center justify-between px-8 py-6 border-b border-slate-100">
            <div>
                <h2 class="text-2xl font-light text-slate-900 tracking-tight">새 주보 등록</h2>
                <p class="text-sm text-slate-500 mt-1 font-light">주보 정보를 입력해주세요</p>
            </div>
            <button onclick="BulletinList.closeModal()"
                    class="text-slate-400 hover:text-slate-900 transition-colors p-2 hover:bg-slate-50 rounded-full">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- 폼 컨텐츠 -->
        <div class="flex-1 overflow-y-auto px-8 py-6">
            <form id="bulletinForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-700 tracking-wide">제목 <span class="text-red-500">*</span></label>
                    <input type="text" id="bulletinTitle" required
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 focus:bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-all font-light"
                           placeholder="주보 제목을 입력하세요">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-700 tracking-wide">주보 파일 <span class="text-xs text-slate-500">(PDF만 가능 / 최대 10MB)</span></label>
                    <input type="file" id="bulletinThumbnail"
                           accept=".pdf,application/pdf"
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 file:mr-4 file:py-2 file:px-4 file:border-0 file:bg-slate-900 file:text-white file:cursor-pointer hover:file:bg-slate-800 transition font-light">
                    <p class="text-xs text-slate-500 mt-1">※ PDF 파일 업로드 시 자동으로 첫 페이지가 썸네일로 표시됩니다</p>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-700 tracking-wide">내용</label>
                    <textarea id="bulletinContent" rows="8"
                              class="w-full px-4 py-3 bg-slate-50 border border-slate-200 focus:bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-all font-light resize-none"
                              placeholder="주보 내용을 입력하세요"></textarea>
                </div>

                <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 text-sm"></div>
            </form>
        </div>

        <!-- 푸터 -->
        <div class="flex items-center justify-end gap-3 px-8 py-6 border-t border-slate-100 bg-slate-50">
            <button type="button" onclick="BulletinList.closeModal()"
                    class="px-6 py-3 text-slate-600 hover:bg-slate-100 transition font-medium">
                취소
            </button>
            <button type="button" onclick="BulletinList.saveBulletin()"
                    class="px-6 py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium">
                등록
            </button>
        </div>
    </div>
</div>

<!-- 삭제 확인 모달 -->
<div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
    
    <div class="relative bg-white max-w-md w-full shadow-2xl">
        <div class="p-8">
            <h3 class="text-xl font-light text-slate-900 mb-2">주보 삭제</h3>
            <p class="text-slate-600 font-light mb-1">다음 주보를 삭제하시겠습니까?</p>
            <p class="text-slate-900 font-medium" id="deleteBulletinTitle"></p>
        </div>
        
        <div class="flex items-center justify-end gap-3 px-8 py-6 bg-slate-50 border-t border-slate-200">
            <button onclick="BulletinList.closeDeleteModal()"
                    class="px-6 py-3 text-slate-600 hover:bg-slate-100 transition font-medium">
                취소
            </button>
            <button onclick="BulletinList.deleteBulletin()"
                    class="px-6 py-3 bg-red-600 text-white hover:bg-red-700 transition font-medium">
                삭제
            </button>
        </div>
    </div>
</div>
</th:block>

<th:block layout:fragment="extra-scripts">
    <!-- 공통 모듈 JS 로드 -->
    <script th:src="@{/js/common/utils.js}"></script>
    <script th:src="@{/js/common/api.js}"></script>

    <!-- 페이지 전용 스크립트 -->
    <script th:src="@{/js/church/bulletin-list.js}"></script>
</th:block>

</body>
</html>
