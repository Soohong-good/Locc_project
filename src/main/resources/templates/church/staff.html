<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">
<head>
    <title>섬기는 분들 - 그리스도 사랑교회</title>
    <link rel="stylesheet" th:href="@{/css/church/staff.css}">
</head>
<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-16 bg-slate-50 px-6">
        <div class="max-w-5xl mx-auto">
            <div class="mb-8">
                <p class="text-xs tracking-[0.3em] text-slate-400 uppercase mb-3">Our Staff</p>
                <h1 class="text-5xl md:text-6xl font-light text-slate-900 tracking-tight mb-6">섬기는 분들</h1>
                <div class="h-px w-16 bg-slate-300"></div>
            </div>
            <p class="text-lg md:text-xl text-slate-600 font-light leading-relaxed">
                그리스도 사랑교회를 섬기는 주의 종들을 소개합니다
            </p>
        </div>
    </section>

    <!-- 카테고리 탭 Section -->
    <section class="py-8 bg-white px-6 border-b border-slate-200">
        <div class="max-w-5xl mx-auto">
            <div class="flex gap-4 justify-center">
                <button onclick="StaffPage.changeCategory('minister')" 
                        id="tab-minister"
                        class="category-tab active px-8 py-3 text-lg font-medium transition-all">
                    교역자
                </button>
                <button onclick="StaffPage.changeCategory('employee')" 
                        id="tab-employee"
                        class="category-tab px-8 py-3 text-lg font-medium transition-all">
                    교회 직원
                </button>
            </div>
        </div>
    </section>

    <!-- 콘텐츠 영역 (Fragment 삽입) -->
    <div id="staff-content-area">
        <!-- JavaScript로 동적으로 Fragment 로드 -->
        <div class="flex items-center justify-center py-20">
            <div class="text-center">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-slate-900 mb-4"></div>
                <p class="text-slate-600">로딩 중...</p>
            </div>
        </div>
    </div>

    <!-- CTA Section -->
    <section class="py-24 bg-slate-900 px-6">
        <div class="max-w-4xl mx-auto text-center">
            <h2 class="text-3xl md:text-4xl font-light text-white mb-6">
                함께 예배하기 원하십니까?
            </h2>
            <p class="text-lg md:text-xl text-slate-300 mb-12 font-light leading-[1.8]">
                그리스도 사랑교회는 여러분을 환영합니다.<br>
                언제든지 편하게 방문하시거나 연락주시기 바랍니다.
            </p>
            <div class="flex flex-wrap justify-center gap-4">
                <a href="/church/contact"
                   class="inline-flex items-center px-8 py-4 bg-white text-slate-900 hover:bg-slate-100 transition-all duration-300 font-light tracking-wide">
                    오시는 길
                </a>
                <a href="/"
                   class="inline-flex items-center px-8 py-4 border-2 border-white text-white hover:bg-white hover:text-slate-900 transition-all duration-300 font-light tracking-wide">
                    홈으로
                </a>
            </div>
        </div>
    </section>

    <!-- 추가 모달 (관리자 전용) -->
    <div sec:authorize="hasRole('ADMIN')" id="createModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">섬기는 분 추가</h3>
                <button type="button" class="modal-close" onclick="StaffPage.closeCreateModal()">&times;</button>
            </div>

            <form id="createForm" onsubmit="StaffPage.createStaff(event)">
                <div class="modal-body">
                    <input type="hidden" name="position" id="createPosition" value="">
                    <input type="hidden" name="category" id="createCategory" value="">
                    <input type="hidden" name="isSeniorPastor" id="createIsSeniorPastor" value="false">
                    <input type="hidden" name="customPosition" id="createCustomPosition" value="">

                    <!-- 이미지 업로드 영역 -->
                    <div class="form-group">
                        <label class="form-label">프로필 이미지</label>
                        <div class="flex flex-col items-center gap-4">
                            <!-- 이미지 미리보기 -->
                            <div id="createImagePreview" class="relative w-32 h-40 bg-slate-100 rounded-lg overflow-hidden hidden">
                                <img id="createPreviewImg" class="w-full h-full object-cover" alt="미리보기">
                                <button type="button"
                                        onclick="StaffPage.clearCreateImage()"
                                        class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center hover:bg-red-600">
                                    ×
                                </button>
                            </div>
                            <!-- 파일 선택 버튼 -->
                            <label for="createImageInput"
                                   class="cursor-pointer px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded transition-colors">
                                이미지 선택
                            </label>
                            <input type="file"
                                   id="createImageInput"
                                   name="image"
                                   accept="image/*"
                                   class="hidden"
                                   onchange="StaffPage.previewCreateImage(this)">
                            <p class="text-xs text-slate-500">JPG, PNG, GIF (최대 5MB)</p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label form-label-required">이름</label>
                        <input type="text"
                               name="name"
                               required
                               placeholder="홍길동"
                               class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label form-label-required">영문 이름</label>
                        <input type="text"
                               name="englishName"
                               required
                               placeholder="Hong Gil-dong"
                               class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label">담당 업무</label>
                        <textarea name="responsibility"
                                  rows="3"
                                  placeholder="담당하시는 업무를 입력해주세요"
                                  class="form-textarea"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">표시 순서</label>
                        <input type="number"
                               name="displayOrder"
                               value="0"
                               placeholder="0"
                               class="form-input">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button"
                            onclick="StaffPage.closeCreateModal()"
                            class="btn-modal-secondary">
                        취소
                    </button>
                    <button type="submit"
                            class="btn-modal-primary">
                        추가
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 수정 모달 (관리자 전용) -->
    <div sec:authorize="hasRole('ADMIN')" id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">섬기는 분 수정</h3>
                <button type="button" class="modal-close" onclick="StaffPage.closeEditModal()">&times;</button>
            </div>

            <form id="editForm" onsubmit="StaffPage.updateStaff(event)">
                <div class="modal-body">
                    <input type="hidden" name="id" id="editId">
                    <input type="hidden" name="position" id="editPosition">
                    <input type="hidden" name="category" id="editCategory">
                    <input type="hidden" name="isSeniorPastor" id="editIsSeniorPastor">
                    <input type="hidden" name="customPosition" id="editCustomPosition">

                    <div class="form-group">
                        <label class="form-label form-label-required">이름</label>
                        <input type="text"
                               name="name"
                               id="editName"
                               required
                               placeholder="홍길동"
                               class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label form-label-required">영문 이름</label>
                        <input type="text"
                               name="englishName"
                               id="editEnglishName"
                               required
                               placeholder="Hong Gil-dong"
                               class="form-input">
                    </div>

                    <div class="form-group">
                        <label class="form-label">담당 업무</label>
                        <textarea name="responsibility"
                                  id="editResponsibility"
                                  rows="3"
                                  placeholder="담당하시는 업무를 입력해주세요"
                                  class="form-textarea"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">표시 순서</label>
                        <input type="number"
                               name="displayOrder"
                               id="editDisplayOrder"
                               placeholder="0"
                               class="form-input">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button"
                            onclick="StaffPage.closeEditModal()"
                            class="btn-modal-secondary">
                        취소
                    </button>
                    <button type="submit"
                            class="btn-modal-primary">
                        수정
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<th:block layout:fragment="extra-scripts">
    <!-- 페이지 전용 스크립트 -->
    <script th:src="@{/js/church/staff.js}"></script>

    <!-- 페이지 초기화 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof StaffPage !== 'undefined') {
                StaffPage.init();
            }
        });
    </script>
</th:block>

</body>
</html>
