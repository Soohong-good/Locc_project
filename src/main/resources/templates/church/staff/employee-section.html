<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<th:block th:fragment="content">

    <section class="py-24 bg-slate-50 px-6">
        <div class="max-w-5xl mx-auto">
            <div class="section-header">
                <div class="section-title-group">
                    <h2>교회 직원</h2>
                    <p>Church Staff</p>
                </div>
                <div sec:authorize="hasRole('ADMIN')" th:if="${!employees.isEmpty()}">
                    <button onclick="StaffPage.openCreateModalFor('OTHER', false, 'EMPLOYEE', '')"
                            class="btn-add-category">
                        + 직원 추가
                    </button>
                </div>
            </div>

            <!-- 등록된 직원이 있을 때 -->
            <div th:if="${!employees.isEmpty()}" class="minister-grid">
                <div th:each="staff : ${employees}" class="minister-card">
                    <div sec:authorize="hasRole('ADMIN')" class="absolute top-4 right-4 flex gap-2">
                        <button th:onclick="'StaffPage.openEditModal(' + ${staff.id} + ')'"
                                class="btn-edit">
                            수정
                        </button>
                        <button th:onclick="'StaffPage.deleteStaff(' + ${staff.id} + ')'"
                                class="btn-delete">
                            삭제
                        </button>
                    </div>

                    <!-- 이미지 영역 -->
                    <div class="relative w-32 md:w-40 mx-auto mb-4" style="aspect-ratio: 3/4;">
                        <div class="w-full h-full rounded-lg overflow-hidden bg-slate-100 flex items-center justify-center">
                            <img th:if="${staff.imagePath}"
                                 th:src="${staff.imagePath}"
                                 th:alt="${staff.name}"
                                 class="staff-image">
                            <div th:unless="${staff.imagePath}" class="image-placeholder w-full h-full">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                     fill="none"
                                     viewBox="0 0 24 24"
                                     stroke="currentColor"
                                     class="w-12 h-12 text-slate-300">
                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          stroke-width="2"
                                          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </div>
                        </div>

                        <!-- 이미지 변경 버튼 -->
                        <div sec:authorize="hasRole('ADMIN')"
                             class="absolute -bottom-2 right-0 flex gap-1">
                            <label th:for="'upload-' + ${staff.id}"
                                   class="btn-image-upload">
                                변경
                            </label>
                            <input th:id="'upload-' + ${staff.id}"
                                   type="file"
                                   accept="image/*"
                                   class="hidden"
                                   th:onchange="'StaffPage.uploadImage(' + ${staff.id} + ', this)'">
                            <button th:if="${staff.imagePath}"
                                    th:onclick="'StaffPage.deleteImage(' + ${staff.id} + ')'"
                                    class="btn-image-delete">
                                삭제
                            </button>
                        </div>
                    </div>

                    <!-- 텍스트 영역 -->
                    <div class="text-center">
                        <h3 class="text-xl font-medium text-slate-900 mb-2"
                            th:text="${staff.name}"></h3>
                        <p class="text-base text-slate-600 mb-4 font-light"
                           th:text="${staff.englishName}"></p>
                        <div th:if="${staff.responsibility}"
                             class="border-t border-slate-200 pt-4">
                            <p class="text-sm text-slate-600 leading-relaxed"
                               th:text="${staff.responsibility}"></p>
                        </div>
                    </div>

                </div>
            </div>

            <!-- 등록된 직원이 없을 때 -->
            <div th:if="${employees.isEmpty()}" class="empty-state">
                <div class="empty-state-icon">
                    <svg class="w-16 h-16 mx-auto mb-4 text-slate-300"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                </div>
                <p class="empty-state-text">등록된 교회 직원이 없습니다</p>
                <div sec:authorize="hasRole('ADMIN')">
                    <button onclick="StaffPage.openCreateModalFor('OTHER', false, 'EMPLOYEE', '')"
                            class="btn-add-empty">
                        + 직원 추가
                    </button>
                </div>
            </div>
        </div>
    </section>

</th:block>

</body>
</html>
