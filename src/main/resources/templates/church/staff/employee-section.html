<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<th:block th:fragment="content">

    <section class="py-24 bg-slate-50 px-6">
        <div class="max-w-5xl mx-auto">
            <div class="section-header">
                <div class="section-title-group">
                    <h2>교회 직원</h2>
                    <p>Church Staff</p>
                </div>
                <div sec:authorize="hasRole('ADMIN')" th:if="${!employees.isEmpty()}">
                    <button onclick="StaffPage.openCreateModalFor('OTHER', false, 'EMPLOYEE', '')"
                            class="btn-add-category">
                        + 직원 추가
                    </button>
                </div>
            </div>

            <!-- 등록된 직원이 있을 때 -->
            <div th:if="${!employees.isEmpty()}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div th:each="staff : ${employees}" class="relative bg-white border border-slate-200 rounded-lg p-6 hover:shadow-md transition-shadow">
                    <!-- 관리자 버튼 -->
                    <div sec:authorize="hasRole('ADMIN')" class="absolute top-3 right-3 flex gap-2">
                        <button th:onclick="'StaffPage.openEditModal(' + ${staff.id} + ')'"
                                class="text-xs px-2 py-1 text-slate-600 hover:text-slate-900 border border-slate-300 hover:border-slate-900 rounded transition">
                            수정
                        </button>
                        <button th:onclick="'StaffPage.deleteStaff(' + ${staff.id} + ')'"
                                class="text-xs px-2 py-1 text-red-600 hover:text-red-700 border border-red-300 hover:border-red-600 rounded transition">
                            삭제
                        </button>
                    </div>

                    <!-- 직원 정보 -->
                    <div class="space-y-2">
                        <h3 class="text-lg font-semibold text-slate-900" th:text="${staff.name}">홍길동</h3>
                        <p class="text-sm text-slate-500" th:text="${staff.englishName}">Gil-dong Hong</p>

                        <!-- 담당업무 -->
                        <div th:if="${staff.responsibility != null && !staff.responsibility.isEmpty()}"
                             class="pt-3 border-t border-slate-100">
                            <p class="text-sm text-slate-600 leading-relaxed" th:text="${staff.responsibility}">담당업무</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 등록된 직원이 없을 때 -->
            <div th:if="${employees.isEmpty()}" class="empty-state">
                <div class="empty-state-icon">
                    <svg class="w-16 h-16 mx-auto mb-4 text-slate-300"
                         fill="none"
                         stroke="currentColor"
                         viewBox="0 0 24 24">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                </div>
                <p class="empty-state-text">등록된 교회 직원이 없습니다</p>
                <div sec:authorize="hasRole('ADMIN')">
                    <button onclick="StaffPage.openCreateModalFor('OTHER', false, 'EMPLOYEE', '')"
                            class="btn-add-empty">
                        + 직원 추가
                    </button>
                </div>
            </div>
        </div>
    </section>

</th:block>

</body>
</html>
