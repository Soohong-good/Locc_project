<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Fragment: 교역자 섹션 전체 -->
<th:block th:fragment="content">

    <!-- 담임목사 Section -->
    <section class="py-24 bg-white px-6">
        <div class="max-w-5xl mx-auto">
            <div class="section-header">
                <div class="section-title-group">
                    <h2>담임목사</h2>
                    <p>Senior Pastor</p>
                </div>
            </div>

            <!-- 등록된 담임목사가 있을 때 -->
            <div th:if="${!seniorPastors.isEmpty()}" th:each="staff : ${seniorPastors}" class="bg-slate-50 p-8 md:p-12 mb-8 relative">
                <!-- 관리자 전용: 편집/삭제 버튼 -->
                <div sec:authorize="hasRole('ADMIN')" class="absolute top-4 right-4 flex gap-2">
                    <button th:onclick="'StaffPage.openEditModal(' + ${staff.id} + ')'"
                            class="btn-edit">
                        수정
                    </button>
                    <button th:onclick="'StaffPage.deleteStaff(' + ${staff.id} + ')'"
                            class="btn-delete">
                        삭제
                    </button>
                </div>

                <div class="flex flex-col items-center">
                    <div class="relative w-48 md:w-64 mb-6" style="aspect-ratio: 3/4;">
                        <div class="w-full h-full rounded-lg overflow-hidden bg-slate-200 flex items-center justify-center">
                            <img th:if="${staff.imagePath}"
                                 th:src="${staff.imagePath}"
                                 th:alt="${staff.name}"
                                 class="staff-image">
                            <div th:unless="${staff.imagePath}" class="image-placeholder w-full h-full">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </div>
                        </div>

                        <div sec:authorize="hasRole('ADMIN')" class="absolute bottom-0 right-0 flex gap-1">
                            <label th:for="'upload-' + ${staff.id}"
                                   class="btn-image-upload">
                                사진 변경
                            </label>
                            <input th:id="'upload-' + ${staff.id}"
                                   type="file"
                                   accept="image/*"
                                   class="hidden"
                                   th:onchange="'StaffPage.uploadImage(' + ${staff.id} + ', this)'">
                            <button th:if="${staff.imagePath}"
                                    th:onclick="'StaffPage.deleteImage(' + ${staff.id} + ')'"
                                    class="btn-image-delete">
                                삭제
                            </button>
                        </div>
                    </div>

                    <h3 class="text-2xl md:text-3xl font-medium text-slate-900 mb-2" th:text="${staff.name}"></h3>
                    <p class="text-lg text-slate-600 font-light" th:text="${staff.englishName}"></p>
                </div>
            </div>

            <!-- 등록된 담임목사가 없을 때 -->
            <div th:if="${seniorPastors.isEmpty()}" class="empty-state">
                <div class="empty-state-icon">
                    <svg class="w-16 h-16 mx-auto mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                </div>
                <p class="empty-state-text">등록된 담임목사가 없습니다</p>
                <div sec:authorize="hasRole('ADMIN')">
                    <button onclick="StaffPage.openCreateModalFor('PASTOR', true, 'MINISTER')"
                            class="btn-add-empty">
                        + 담임목사 추가
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 부목사 Section -->
    <section class="py-24 bg-slate-50 px-6">
        <div class="max-w-5xl mx-auto">
            <div class="section-header">
                <div class="section-title-group">
                    <h2>부목사</h2>
                    <p>Pastor</p>
                </div>
                <div sec:authorize="hasRole('ADMIN')" th:if="${!pastors.isEmpty()}">
                    <button onclick="StaffPage.openCreateModalFor('PASTOR', false, 'MINISTER')"
                            class="btn-add-category">
                        + 부목사 추가
                    </button>
                </div>
            </div>

            <!-- 등록된 부목사가 있을 때 -->
            <div th:if="${!pastors.isEmpty()}" class="minister-grid">
                <div th:each="staff : ${pastors}" class="minister-card">
                    <div sec:authorize="hasRole('ADMIN')" class="absolute top-4 right-4 flex gap-2">
                        <button th:onclick="'StaffPage.openEditModal(' + ${staff.id} + ')'"
                                class="btn-edit">
                            수정
                        </button>
                        <button th:onclick="'StaffPage.deleteStaff(' + ${staff.id} + ')'"
                                class="btn-delete">
                            삭제
                        </button>
                    </div>

                    <div class="relative w-32 md:w-40 mx-auto mb-4" style="aspect-ratio: 3/4;">
                        <div class="w-full h-full rounded-lg overflow-hidden bg-slate-100 flex items-center justify-center">
                            <img th:if="${staff.imagePath}"
                                 th:src="${staff.imagePath}"
                                 th:alt="${staff.name}"
                                 class="staff-image">
                            <div th:unless="${staff.imagePath}" class="image-placeholder w-full h-full">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </div>
                        </div>

                        <div sec:authorize="hasRole('ADMIN')" class="absolute -bottom-2 right-0 flex gap-1">
                            <label th:for="'upload-' + ${staff.id}"
                                   class="btn-image-upload">
                                변경
                            </label>
                            <input th:id="'upload-' + ${staff.id}"
                                   type="file"
                                   accept="image/*"
                                   class="hidden"
                                   th:onchange="'StaffPage.uploadImage(' + ${staff.id} + ', this)'">
                            <button th:if="${staff.imagePath}"
                                    th:onclick="'StaffPage.deleteImage(' + ${staff.id} + ')'"
                                    class="btn-image-delete">
                                삭제
                            </button>
                        </div>
                    </div>

                    <div class="text-center">
                        <h3 class="text-xl font-medium text-slate-900 mb-2" th:text="${staff.name}"></h3>
                        <p class="text-base text-slate-600 mb-4 font-light" th:text="${staff.englishName}"></p>
                        <div th:if="${staff.responsibility}" class="border-t border-slate-200 pt-4">
                            <p class="text-sm text-slate-600 leading-relaxed" th:text="${staff.responsibility}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 등록된 부목사가 없을 때 -->
            <div th:if="${pastors.isEmpty()}" class="empty-state">
                <div class="empty-state-icon">
                    <svg class="w-16 h-16 mx-auto mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                </div>
                <p class="empty-state-text">등록된 부목사가 없습니다</p>
                <div sec:authorize="hasRole('ADMIN')">
                    <button onclick="StaffPage.openCreateModalFor('PASTOR', false, 'MINISTER')"
                            class="btn-add-empty">
                        + 부목사 추가
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 전도사 Section -->
    <section class="py-24 bg-white px-6">
        <div class="max-w-5xl mx-auto">
            <div class="section-header">
                <div class="section-title-group">
                    <h2>전도사</h2>
                    <p>Evangelist</p>
                </div>
                <div sec:authorize="hasRole('ADMIN')" th:if="${!evangelists.isEmpty()}">
                    <button onclick="StaffPage.openCreateModalFor('EVANGELIST', false, 'MINISTER')"
                            class="btn-add-category">
                        + 전도사 추가
                    </button>
                </div>
            </div>

            <!-- 등록된 전도사가 있을 때 -->
            <div th:if="${!evangelists.isEmpty()}" class="minister-grid">
                <div th:each="staff : ${evangelists}" class="minister-card">
                    <div sec:authorize="hasRole('ADMIN')" class="absolute top-4 right-4 flex gap-2">
                        <button th:onclick="'StaffPage.openEditModal(' + ${staff.id} + ')'"
                                class="btn-edit">
                            수정
                        </button>
                        <button th:onclick="'StaffPage.deleteStaff(' + ${staff.id} + ')'"
                                class="btn-delete">
                            삭제
                        </button>
                    </div>

                    <div class="relative w-32 md:w-40 mx-auto mb-4" style="aspect-ratio: 3/4;">
                        <div class="w-full h-full rounded-lg overflow-hidden bg-slate-100 flex items-center justify-center">
                            <img th:if="${staff.imagePath}"
                                 th:src="${staff.imagePath}"
                                 th:alt="${staff.name}"
                                 class="staff-image">
                            <div th:unless="${staff.imagePath}" class="image-placeholder w-full h-full">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </div>
                        </div>

                        <div sec:authorize="hasRole('ADMIN')" class="absolute -bottom-2 right-0 flex gap-1">
                            <label th:for="'upload-' + ${staff.id}"
                                   class="btn-image-upload">
                                변경
                            </label>
                            <input th:id="'upload-' + ${staff.id}"
                                   type="file"
                                   accept="image/*"
                                   class="hidden"
                                   th:onchange="'StaffPage.uploadImage(' + ${staff.id} + ', this)'">
                            <button th:if="${staff.imagePath}"
                                    th:onclick="'StaffPage.deleteImage(' + ${staff.id} + ')'"
                                    class="btn-image-delete">
                                삭제
                            </button>
                        </div>
                    </div>

                    <div class="text-center">
                        <h3 class="text-xl font-medium text-slate-900 mb-2" th:text="${staff.name}"></h3>
                        <p class="text-base text-slate-600 mb-4 font-light" th:text="${staff.englishName}"></p>
                        <div th:if="${staff.responsibility}" class="border-t border-slate-200 pt-4">
                            <p class="text-sm text-slate-600 leading-relaxed" th:text="${staff.responsibility}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 등록된 전도사가 없을 때 -->
            <div th:if="${evangelists.isEmpty()}" class="empty-state">
                <div class="empty-state-icon">
                    <svg class="w-16 h-16 mx-auto mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                </div>
                <p class="empty-state-text">등록된 전도사가 없습니다</p>
                <div sec:authorize="hasRole('ADMIN')">
                    <button onclick="StaffPage.openCreateModalFor('EVANGELIST', false, 'MINISTER')"
                            class="btn-add-empty">
                        + 전도사 추가
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 협력목사 Section -->
    <section th:if="${!associatePastors.isEmpty() || #authorization.expression('hasRole(''ADMIN'')')}" class="py-24 bg-slate-50 px-6">
        <div class="max-w-5xl mx-auto">
            <div class="section-header">
                <div class="section-title-group">
                    <h2>협력목사</h2>
                    <p>Associate Pastor</p>
                </div>
                <div sec:authorize="hasRole('ADMIN')" th:if="${!associatePastors.isEmpty()}">
                    <button onclick="StaffPage.openCreateModalFor('OTHER', false, 'MINISTER', '협력목사')"
                            class="btn-add-category">
                        + 협력목사 추가
                    </button>
                </div>
            </div>

            <!-- 등록된 협력목사가 있을 때 -->
            <div th:if="${!associatePastors.isEmpty()}" class="minister-grid">
                <div th:each="staff : ${associatePastors}" class="minister-card">
                    <div sec:authorize="hasRole('ADMIN')" class="absolute top-4 right-4 flex gap-2">
                        <button th:onclick="'StaffPage.openEditModal(' + ${staff.id} + ')'"
                                class="btn-edit">
                            수정
                        </button>
                        <button th:onclick="'StaffPage.deleteStaff(' + ${staff.id} + ')'"
                                class="btn-delete">
                            삭제
                        </button>
                    </div>

                    <div class="relative w-32 md:w-40 mx-auto mb-4" style="aspect-ratio: 3/4;">
                        <div class="w-full h-full rounded-lg overflow-hidden bg-slate-100 flex items-center justify-center">
                            <img th:if="${staff.imagePath}"
                                 th:src="${staff.imagePath}"
                                 th:alt="${staff.name}"
                                 class="staff-image">
                            <div th:unless="${staff.imagePath}" class="image-placeholder w-full h-full">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </div>
                        </div>

                        <div sec:authorize="hasRole('ADMIN')" class="absolute -bottom-2 right-0 flex gap-1">
                            <label th:for="'upload-' + ${staff.id}"
                                   class="btn-image-upload">
                                변경
                            </label>
                            <input th:id="'upload-' + ${staff.id}"
                                   type="file"
                                   accept="image/*"
                                   class="hidden"
                                   th:onchange="'StaffPage.uploadImage(' + ${staff.id} + ', this)'">
                            <button th:if="${staff.imagePath}"
                                    th:onclick="'StaffPage.deleteImage(' + ${staff.id} + ')'"
                                    class="btn-image-delete">
                                삭제
                            </button>
                        </div>
                    </div>

                    <div class="text-center">
                        <h3 class="text-xl font-medium text-slate-900 mb-2" th:text="${staff.name}"></h3>
                        <p class="text-base text-slate-600 mb-4 font-light" th:text="${staff.englishName}"></p>
                        <div th:if="${staff.responsibility}" class="border-t border-slate-200 pt-4">
                            <p class="text-sm text-slate-600 leading-relaxed" th:text="${staff.responsibility}"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 등록된 협력목사가 없을 때 -->
            <div th:if="${associatePastors.isEmpty()}" class="empty-state">
                <div class="empty-state-icon">
                    <svg class="w-16 h-16 mx-auto mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                </div>
                <p class="empty-state-text">등록된 협력목사가 없습니다</p>
                <div sec:authorize="hasRole('ADMIN')">
                    <button onclick="StaffPage.openCreateModalFor('OTHER', false, 'MINISTER', '협력목사')"
                            class="btn-add-empty">
                        + 협력목사 추가
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 선교사 Section -->
    <section class="py-24 bg-white px-6">
        <div class="max-w-5xl mx-auto">
            <div class="section-header">
                <div class="section-title-group">
                    <h2>선교사</h2>
                    <p>Missionary</p>
                </div>
                <div sec:authorize="hasRole('ADMIN')" th:if="${!missionaries.isEmpty()}">
                    <button onclick="StaffPage.openCreateModalFor('MISSIONARY', false, 'MINISTER')"
                            class="btn-add-category">
                        + 선교사 추가
                    </button>
                </div>
            </div>

            <!-- 등록된 선교사가 있을 때 -->
            <div th:if="${!missionaries.isEmpty()}" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div th:each="staff : ${missionaries}" class="bg-white p-6 relative">
                    <div sec:authorize="hasRole('ADMIN')" class="absolute top-2 right-2 flex gap-1">
                        <button th:onclick="'StaffPage.openEditModal(' + ${staff.id} + ')'"
                                class="btn-edit">
                            수정
                        </button>
                        <button th:onclick="'StaffPage.deleteStaff(' + ${staff.id} + ')'"
                                class="btn-delete">
                            삭제
                        </button>
                    </div>

                    <p class="text-lg font-medium text-slate-900 mb-1" th:text="${staff.name}"></p>
                    <p th:if="${staff.responsibility}" class="text-base text-slate-600" th:text="${staff.responsibility}"></p>
                </div>
            </div>

            <!-- 등록된 선교사가 없을 때 -->
            <div th:if="${missionaries.isEmpty()}" class="empty-state">
                <div class="empty-state-icon">
                    <svg class="w-16 h-16 mx-auto mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                </div>
                <p class="empty-state-text">등록된 선교사가 없습니다</p>
                <div sec:authorize="hasRole('ADMIN')">
                    <button onclick="StaffPage.openCreateModalFor('MISSIONARY', false, 'MINISTER')"
                            class="btn-add-empty">
                        + 선교사 추가
                    </button>
                </div>
            </div>
        </div>
    </section>



    <!-- 협력단체 Section -->
    <section th:if="${!others.isEmpty() || #authorization.expression('hasRole(''ADMIN'')')}" class="py-24 bg-slate-50 px-6">
        <div class="max-w-5xl mx-auto">
            <div class="section-header">
                <div class="section-title-group">
                    <h2>협력단체</h2>
                    <p>Partners</p>
                </div>
                <div sec:authorize="hasRole('ADMIN')" th:if="${!others.isEmpty()}">
                    <button onclick="StaffPage.openCreateModalFor('OTHER', false, 'MINISTER', '')"
                            class="btn-add-category">
                        + 협력단체 추가
                    </button>
                </div>
            </div>

            <!-- 등록된 협력단체가 있을 때 -->
            <div th:if="${!others.isEmpty()}" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div th:each="staff : ${others}" class="bg-white p-6 relative">
                    <div sec:authorize="hasRole('ADMIN')" class="absolute top-2 right-2 flex gap-1">
                        <button th:onclick="'StaffPage.openEditModal(' + ${staff.id} + ')'"
                                class="btn-edit">
                            수정
                        </button>
                        <button th:onclick="'StaffPage.deleteStaff(' + ${staff.id} + ')'"
                                class="btn-delete">
                            삭제
                        </button>
                    </div>

                    <p class="text-lg font-medium text-slate-900 mb-1" th:text="${staff.name}"></p>
                    <p th:if="${staff.displayPosition}" class="text-sm text-slate-500 mb-2" th:text="${staff.displayPosition}"></p>
                    <p th:if="${staff.responsibility}" class="text-base text-slate-600" th:text="${staff.responsibility}"></p>
                </div>
            </div>

            <!-- 등록된 협력단체가 없을 때 -->
            <div th:if="${others.isEmpty()}" class="empty-state">
                <div class="empty-state-icon">
                    <svg class="w-16 h-16 mx-auto mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                </div>
                <p class="empty-state-text">등록된 협력단체가 없습니다</p>
                <div sec:authorize="hasRole('ADMIN')">
                    <button onclick="StaffPage.openCreateModalFor('OTHER', false, 'MINISTER', '')"
                            class="btn-add-empty">
                        + 협력단체 추가
                    </button>
                </div>
            </div>
        </div>
    </section>

</th:block>

</body>
</html>
