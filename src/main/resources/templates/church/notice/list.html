<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>공지사항</title>
</head>
<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-16 bg-slate-50 px-6">
        <div class="max-w-5xl mx-auto">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <p class="text-xs tracking-[0.3em] text-slate-400 uppercase mb-3">Notice</p>
                    <h1 class="text-4xl md:text-5xl font-light text-slate-900 tracking-tight mb-4">공지사항</h1>
                    <p class="text-lg text-slate-600 font-light">교회 소식과 주요 공지사항을 확인하세요</p>
                </div>
                <!-- 관리자 글쓰기 버튼 -->
                <div th:if="${isAdmin}">
                    <button onclick="openWriteModal()"
                            class="px-6 py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium">
                        + 새 공지사항
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 검색 Section -->
    <section class="py-8 bg-white px-6 border-b border-slate-200">
        <div class="max-w-5xl mx-auto">
            <form th:action="@{/church/notice}" method="get" class="flex gap-3">
                <input type="text"
                       name="keyword"
                       th:value="${keyword}"
                       placeholder="검색어를 입력하세요"
                       class="flex-1 px-4 py-3 border border-slate-300 focus:border-slate-900 focus:outline-none transition text-base">
                <button type="submit"
                        class="px-8 py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium">
                    검색
                </button>
            </form>
        </div>
    </section>

    <!-- 공지사항 목록 -->
    <section class="py-16 bg-white px-6">
        <div class="max-w-5xl mx-auto">
            <div class="space-y-0 border-t border-slate-200">
                <div th:each="notice, iterStat : ${notices.content}"
                     class="group py-6 border-b border-slate-200">

                    <div class="flex items-start justify-between gap-4">
                        <div class="flex-1 cursor-pointer"
                             th:onclick="|location.href='/church/notice/${notice.id}'|">
                            <div class="flex items-center gap-3 mb-2">
                                <span th:if="${notice.isNew}"
                                      class="text-xs px-2 py-1 bg-slate-900 text-white font-medium">NEW</span>
                                <span class="text-lg md:text-xl text-slate-900 font-light group-hover:text-slate-600 transition-colors"
                                      th:text="${notice.title}">공지사항 제목</span>
                            </div>
                            <div class="flex items-center gap-4 text-sm text-slate-500 font-light">
                                <span th:text="${notice.authorName}">작성자</span>
                                <span>·</span>
                                <span th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}">2024.11.15</span>
                                <span>·</span>
                                <span>조회 <span th:text="${notice.viewCount}">0</span></span>
                            </div>
                        </div>

                        <!-- 관리자 버튼 -->
                        <div th:if="${isAdmin}" class="flex gap-2">
                            <button th:onclick="|openEditModal(event, ${notice.id})|"
                                    th:data-id="${notice.id}"
                                    class="px-3 py-1 text-sm border border-slate-300 hover:border-slate-900 transition">
                                수정
                            </button>
                            <button th:onclick="|confirmDelete(event, ${notice.id})|"
                                    th:data-id="${notice.id}"
                                    th:data-title="${notice.title}"
                                    class="px-3 py-1 text-sm border border-red-300 text-red-600 hover:border-red-600 transition">
                                삭제
                            </button>
                        </div>

                        <div class="hidden md:block text-3xl font-light text-slate-300 tabular-nums"
                             th:text="${notices.totalElements - (notices.number * notices.size) - iterStat.index}">
                            001
                        </div>
                    </div>
                </div>

                <div th:if="${notices.empty}" class="py-20 text-center">
                    <p class="text-slate-400 font-light text-lg">등록된 공지사항이 없습니다.</p>
                </div>
            </div>

            <!-- 페이징 -->
            <div th:if="${notices.totalPages > 0}" class="mt-16 flex justify-center items-center gap-2">
                <a th:if="${currentPage > 0}"
                   th:href="@{/church/notice(page=${currentPage - 1}, size=${notices.size}, keyword=${keyword})}"
                   class="px-4 py-2 border border-slate-300 hover:border-slate-900 transition text-slate-700 hover:text-slate-900 font-medium">
                    이전
                </a>

                <div class="flex gap-1">
                    <a th:each="pageNum : ${#numbers.sequence(0, notices.totalPages - 1)}"
                       th:href="@{/church/notice(page=${pageNum}, size=${notices.size}, keyword=${keyword})}"
                       th:text="${pageNum + 1}"
                       th:classappend="${pageNum == currentPage} ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 hover:border-slate-900'"
                       class="px-4 py-2 border border-slate-300 transition font-medium">
                    </a>
                </div>

                <a th:if="${currentPage < notices.totalPages - 1}"
                   th:href="@{/church/notice(page=${currentPage + 1}, size=${notices.size}, keyword=${keyword})}"
                   class="px-4 py-2 border border-slate-300 hover:border-slate-900 transition text-slate-700 hover:text-slate-900 font-medium">
                    다음
                </a>
            </div>
        </div>
    </section>

    <!-- 작성/수정 모달 -->
    <div id="noticeModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-6">
        <div class="bg-white rounded-lg max-w-3xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b">
                <h2 id="modalTitle" class="text-2xl font-light">새 공지사항 작성</h2>
            </div>

            <form id="noticeForm" class="p-6 space-y-6">
                <input type="hidden" id="noticeId">

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">제목</label>
                    <input type="text" id="noticeTitle" required
                           class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">내용</label>
                    <textarea id="noticeContent" required rows="15"
                              class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none resize-none"></textarea>
                </div>

                <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded"></div>
            </form>

            <div class="p-6 border-t flex gap-3">
                <button type="button" onclick="saveNotice()"
                        class="flex-1 py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium rounded">
                    저장
                </button>
                <button type="button" onclick="closeModal()"
                        class="px-6 py-3 border-2 border-slate-300 hover:border-slate-900 transition font-medium rounded">
                    취소
                </button>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-6">
        <div class="bg-white rounded-lg max-w-md w-full">
            <div class="p-6 border-b">
                <h2 class="text-2xl font-light text-red-600">공지사항 삭제</h2>
            </div>

            <div class="p-6">
                <p class="text-slate-700 mb-2">다음 공지사항을 삭제하시겠습니까?</p>
                <p class="font-medium text-slate-900" id="deleteNoticeTitle"></p>
            </div>

            <div class="p-6 border-t flex gap-3">
                <button type="button" onclick="deleteNotice()"
                        class="flex-1 py-3 bg-red-600 text-white hover:bg-red-700 transition font-medium rounded">
                    삭제
                </button>
                <button type="button" onclick="closeDeleteModal()"
                        class="px-6 py-3 border-2 border-slate-300 hover:border-slate-900 transition font-medium rounded">
                    취소
                </button>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="extra-scripts">
    <script>
        let currentNoticeId = null;

        function openWriteModal() {
            document.getElementById('modalTitle').textContent = '새 공지사항 작성';
            document.getElementById('noticeId').value = '';
            document.getElementById('noticeTitle').value = '';
            document.getElementById('noticeContent').value = '';
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('noticeModal').classList.remove('hidden');
        }

        async function openEditModal(event, noticeId) {
            event.stopPropagation();

            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/api/notices/${noticeId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const notice = await response.json();
                    document.getElementById('modalTitle').textContent = '공지사항 수정';
                    document.getElementById('noticeId').value = noticeId;
                    document.getElementById('noticeTitle').value = notice.title || '';
                    document.getElementById('noticeContent').value = notice.content || '';
                    document.getElementById('errorMessage').classList.add('hidden');
                    document.getElementById('noticeModal').classList.remove('hidden');
                } else {
                    alert('공지사항을 불러오는데 실패했습니다.');
                }
            } catch (error) {
                console.error('Load error:', error);
                alert('공지사항을 불러오는데 실패했습니다.');
            }
        }

        function closeModal() {
            document.getElementById('noticeModal').classList.add('hidden');
        }

        async function saveNotice() {
            const noticeId = document.getElementById('noticeId').value;
            const title = document.getElementById('noticeTitle').value;
            const content = document.getElementById('noticeContent').value;
            const errorDiv = document.getElementById('errorMessage');

            if (!title.trim() || !content.trim()) {
                errorDiv.textContent = '제목과 내용을 모두 입력해주세요.';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const token = localStorage.getItem('accessToken');
                const url = noticeId ? `/api/notices/${noticeId}` : '/api/notices';
                const method = noticeId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ title, content })
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    const error = await response.json();
                    errorDiv.textContent = error.message || '저장 중 오류가 발생했습니다.';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Save error:', error);
                errorDiv.textContent = '저장 중 오류가 발생했습니다.';
                errorDiv.classList.remove('hidden');
            }
        }

        function confirmDelete(event, noticeId) {
            event.stopPropagation();

            const button = event.currentTarget;
            const title = button.dataset.title;

            currentNoticeId = noticeId;
            document.getElementById('deleteNoticeTitle').textContent = title || '';
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        async function deleteNotice() {
            if (!currentNoticeId) return;

            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/api/notices/${currentNoticeId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('삭제 중 오류가 발생했습니다.');
                }
            } catch (error) {
                console.error('Delete error:', error);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            currentNoticeId = null;
        }

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeDeleteModal();
            }
        });
    </script>
</th:block>

</body>
</html>
