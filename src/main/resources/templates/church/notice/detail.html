<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${notice.title} + ' - 그리스도 사랑교회'">공지사항</title>
    <link rel="stylesheet" th:href="@{/css/church/notice-detail.css}">
    <!-- Quill 에디터 CSS -->
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common/quill-custom.css}">
</head>
<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-20 bg-slate-50 px-6">
        <div class="max-w-4xl mx-auto">
            <a href="/church/notice" 
               class="inline-flex items-center text-sm text-slate-600 hover:text-slate-900 mb-12 group transition-all duration-300">
                <svg class="w-4 h-4 mr-2 transition-transform duration-300 group-hover:-translate-x-1" 
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span class="font-light tracking-wide">목록으로</span>
            </a>
            
            <div class="mb-8">
                <p class="text-xs tracking-[0.3em] text-slate-400 uppercase mb-4">Notice</p>
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-light text-slate-900 leading-[1.3] tracking-tight mb-8"
                    th:text="${notice.title}">
                    공지사항 제목
                </h1>
                <div class="h-px w-16 bg-slate-300 mb-8"></div>
            </div>

            <!-- 메타 정보 -->
            <div class="flex flex-wrap items-center justify-between gap-6">
                <div class="flex flex-wrap items-center gap-6 text-slate-500 font-light">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        <span th:text="${notice.authorName}">작성자</span>
                    </div>
                    <span class="text-slate-300">•</span>
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <span th:text="${#temporals.format(notice.createdAt, 'yyyy. MM. dd')}">2024. 11. 15</span>
                    </div>
                    <span class="text-slate-300">•</span>
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                        <span th:text="${notice.viewCount}">0</span>
                    </div>
                </div>

                <!-- 관리자 버튼 -->
                <div sec:authorize="hasRole('ADMIN')" class="flex gap-3">
                    <!-- 고정 토글 버튼 -->
                    <button onclick="toggleDetailPin()"
                            th:data-pinned="${notice.isPinned}"
                            th:classappend="${notice.isPinned} ? 'bg-amber-500 text-white border-amber-500 hover:bg-amber-600' : 'border-slate-300 hover:border-slate-900'"
                            class="px-4 py-2 border-2 transition font-medium flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                        </svg>
                        <span th:text="${notice.isPinned} ? '고정 해제' : '최상단 고정'"></span>
                    </button>

                    <button onclick="openEditModal()"
                            class="px-4 py-2 border-2 border-slate-300 hover:border-slate-900 transition font-medium">
                        수정
                    </button>
                    <button onclick="confirmDelete()"
                            class="px-4 py-2 border-2 border-red-300 text-red-600 hover:border-red-600 transition font-medium">
                        삭제
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 공지사항 내용 -->
    <section class="py-24 bg-white px-6">
        <article class="max-w-4xl mx-auto">
            <!-- 내용 -->
            <div class="prose prose-lg prose-slate max-w-none">
                <div th:utext="${notice.content}"
                     class="text-slate-700 leading-[1.9] font-light text-lg">
                    공지사항 내용
                </div>
            </div>

            <!-- 첨부파일 -->
            <div th:if="${notice.attachments != null && !#lists.isEmpty(notice.attachments)}"
                 class="mt-20 pt-12 border-t border-slate-200">
                <h3 class="text-sm tracking-[0.2em] text-slate-400 uppercase mb-6">Attachments</h3>
                <div class="space-y-3">
                    <div th:each="attachment : ${notice.attachments}"
                         th:id="'attachment-' + ${attachment.id}"
                         class="flex items-center gap-4 p-5 bg-slate-50 hover:bg-slate-100 transition-all duration-300 group">
                        <div class="w-12 h-12 flex items-center justify-center bg-white group-hover:bg-slate-900 transition-all duration-300">
                            <svg class="w-6 h-6 text-slate-400 group-hover:text-white transition-colors duration-300"
                                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="font-light text-slate-900 truncate"
                               th:text="${attachment.originalFileName}">
                                파일명.pdf
                            </p>
                            <p class="text-sm text-slate-500 font-light"
                               th:text="${#numbers.formatDecimal(attachment.fileSize / 1024.0, 1, 2)} + ' KB'">
                                1.5 KB
                            </p>
                        </div>
                        <a th:href="@{/api/files/download/{id}(id=${attachment.id})}"
                           class="px-4 py-2 bg-slate-900 text-white hover:bg-slate-800 transition-all duration-300 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            다운로드
                        </a>
                        <!-- 관리자 삭제 버튼 -->
                        <button sec:authorize="hasRole('ADMIN')"
                                th:onclick="'deleteAttachmentFromDetail(' + ${attachment.id} + ')'"
                                class="px-4 py-2 bg-red-600 text-white hover:bg-red-700 transition-all duration-300">
                            삭제
                        </button>
                    </div>
                </div>
            </div>
        </article>
    </section>

    <!-- Navigation -->
    <section class="py-12 bg-slate-50 px-6">
        <div class="max-w-4xl mx-auto">
            <a href="/church/notice"
               class="group inline-flex items-center px-8 py-4 border-2 border-slate-900 text-slate-900 hover:bg-slate-900 hover:text-white transition-all duration-300 font-light tracking-wide">
                <svg class="w-5 h-5 mr-2 transition-transform duration-300 group-hover:-translate-x-1" 
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                목록으로 돌아가기
            </a>
        </div>
    </section>
</main>

<!-- 수정/삭제 모달 -->
<th:block layout:fragment="modals">
<div id="editModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
    <!-- 배경 오버레이 -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>

    <!-- 모달 컨텐츠 -->
    <div class="relative bg-white w-full max-w-3xl max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
        <!-- 헤더 -->
        <div class="flex items-center justify-between px-8 py-6 border-b border-slate-100">
            <div>
                <h2 class="text-2xl font-light text-slate-900 tracking-tight">공지사항 수정</h2>
                <p class="text-sm text-slate-500 mt-1 font-light">공지사항 정보를 수정해주세요</p>
            </div>
            <button onclick="closeEditModal()"
                    class="text-slate-400 hover:text-slate-900 transition-colors p-2 hover:bg-slate-50 rounded-full">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- 폼 컨텐츠 -->
        <div class="flex-1 overflow-y-auto px-8 py-6">
            <form id="editForm" class="space-y-6">
                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-700 tracking-wide">제목 <span class="text-red-500">*</span></label>
                    <input type="text" id="editTitle" required th:value="${notice.title}"
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 focus:bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-all font-light">
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-700 tracking-wide">
                        내용 <span class="text-red-500">*</span>
                    </label>
                    <div id="editContent"></div>
                </div>

                <div class="space-y-2">
                    <label class="text-sm font-medium text-slate-700 tracking-wide">새 파일 첨부 <span class="text-xs text-slate-500">(PDF, JPG, PNG / 최대 10MB)</span></label>
                    <input type="file" id="editFiles" multiple accept=".pdf,.jpg,.jpeg,.png"
                           class="w-full px-4 py-3 bg-slate-50 border border-slate-200 focus:bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-all font-light">
                    <div id="editFileList" class="mt-2 text-sm text-slate-600 space-y-1"></div>
                    <p class="text-xs text-slate-500 mt-1">※ 기존 파일 삭제는 상세 페이지에서 가능합니다</p>
                </div>

                <div id="editErrorMessage" class="hidden bg-red-50 border-l-4 border-red-500 text-red-700 px-4 py-3 font-light"></div>
            </form>
        </div>

        <!-- 푸터 -->
        <div class="flex items-center justify-end gap-3 px-8 py-6 bg-slate-50 border-t border-slate-100">
            <button type="button" onclick="closeEditModal()"
                    class="px-6 py-2.5 text-slate-700 hover:text-slate-900 font-medium transition-colors">
                취소
            </button>
            <button type="button" onclick="saveEdit()"
                    class="px-8 py-2.5 bg-slate-900 text-white hover:bg-slate-800 font-medium transition-all shadow-sm hover:shadow">
                저장
            </button>
        </div>
    </div>
</div>

<!-- 삭제 확인 모달 -->
<div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
    <!-- 배경 오버레이 -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>

    <!-- 모달 컨텐츠 -->
    <div class="relative bg-white w-full max-w-md overflow-hidden shadow-2xl">
        <!-- 헤더 -->
        <div class="px-8 py-6 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-red-50 flex items-center justify-center flex-shrink-0">
                    <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="text-xl font-medium text-slate-900">공지사항 삭제</h2>
                    <p class="text-sm text-slate-500 mt-0.5 font-light">이 작업은 되돌릴 수 없습니다</p>
                </div>
            </div>
        </div>

        <!-- 내용 -->
        <div class="px-8 py-6">
            <p class="text-slate-600 mb-3 font-light">이 공지사항을 삭제하시겠습니까?</p>
            <p class="font-medium text-slate-900 bg-slate-50 px-4 py-3 rounded" th:text="${notice.title}"></p>
        </div>

        <!-- 푸터 -->
        <div class="flex items-center justify-end gap-3 px-8 py-6 bg-slate-50 border-t border-slate-100">
            <button type="button" onclick="closeDeleteModal()"
                    class="px-6 py-2.5 text-slate-700 hover:text-slate-900 font-medium transition-colors">
                취소
            </button>
            <button type="button" onclick="deleteNotice()"
                    class="px-8 py-2.5 bg-red-600 text-white hover:bg-red-700 font-medium transition-all shadow-sm hover:shadow">
                삭제하기
            </button>
        </div>
    </div>
</div>

<!-- 커스텀 링크 툴팁 -->
<div id="linkTooltip" style="display: none;">
    <label>URL</label>
    <input type="text" id="linkUrlInput" placeholder="https://example.com">

    <label>텍스트 (선택사항)</label>
    <input type="text" id="linkTextInput" placeholder="링크 텍스트">

    <div class="checkbox-wrapper">
        <input type="checkbox" id="linkNewTabInput">
        <label for="linkNewTabInput">새 탭으로 열기</label>
    </div>

    <div class="buttons">
        <button type="button" class="btn-cancel" onclick="QuillEditor.hideLinkTooltip()">취소</button>
        <button type="button" class="btn-insert" onclick="QuillEditor.insertLinkFromTooltip()">삽입</button>
    </div>
</div>
</th:block>

<th:block layout:fragment="extra-scripts">
    <!-- Quill Editor -->
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <!-- Quill Image Resize 모듈 -->
    <script src="https://cdn.jsdelivr.net/npm/quill-image-resize-module@3.0.0/image-resize.min.js"></script>

    <!-- 공통 모듈 JS 로드 -->
    <script th:src="@{/js/common/utils.js}"></script>
    <script th:src="@{/js/common/api.js}"></script>
    <script th:src="@{/js/common/quill-editor.js}"></script>

    <!-- 페이지 전용 스크립트 -->
    <script th:src="@{/js/church/notice-detail.js}"></script>

    <!-- 공지사항 ID 설정 -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const noticeIdValue = /*[[${notice.id}]]*/ null;
        setNoticeId(noticeIdValue);
        /*]]>*/
    </script>
</th:block>

</body>
</html>
