<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>소셜 회원가입 - 그리스도 사랑교회</title>
</head>

<!-- Daum 주소 API -->
<th:block layout:fragment="extra-head">
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
</th:block>

<body>

<main layout:fragment="content">
    <section class="min-h-screen flex items-center justify-center bg-slate-50 px-6 py-32">
        <div class="max-w-2xl w-full">
            <!-- 1단계: 교인 구분 선택 -->
            <div id="step1" class="step-container">
                <div class="text-center mb-10">
                    <h1 class="text-4xl md:text-5xl font-light text-slate-900 mb-4">소셜 회원가입</h1>
                    <p class="text-slate-600 font-light">교인 구분을 선택해주세요</p>
                </div>

                <div class="bg-white p-8 md:p-10 shadow-sm">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <button type="button" onclick="selectUserType('REGISTERED')"
                                class="group relative p-8 border-2 border-slate-300 rounded-lg hover:border-slate-900 transition text-center">
                            <div class="text-2xl mb-3 font-light">등록교인</div>
                            <div class="text-sm text-slate-500 mb-4">그리스도 사랑교회에<br>등록된 교인</div>
                            <div class="text-xs text-slate-400">
                                • 교인 정보 확인<br>
                                • 모든 교회 서비스 이용
                            </div>
                        </button>

                        <button type="button" onclick="selectUserType('UNREGISTERED')"
                                class="group relative p-8 border-2 border-slate-300 rounded-lg hover:border-slate-900 transition text-center">
                            <div class="text-2xl mb-3 font-light">미등록교인</div>
                            <div class="text-sm text-slate-500 mb-4">방문자 및<br>새가족</div>
                            <div class="text-xs text-slate-400">
                                • 간편 가입<br>
                                • 기본 정보만 입력
                            </div>
                        </button>
                    </div>

                    <div class="text-center mt-8">
                        <a href="/auth/login" class="text-sm text-slate-600 hover:text-slate-900">
                            이미 계정이 있으신가요? 로그인
                        </a>
                    </div>
                </div>

                <div class="text-center mt-8">
                    <a href="/" class="text-sm text-slate-600 hover:text-slate-900">
                        ← 홈으로 돌아가기
                    </a>
                </div>
            </div>

            <!-- 2단계: 개인정보 동의 -->
            <div id="step2" class="step-container hidden">
                <div class="text-center mb-10">
                    <h1 class="text-4xl md:text-5xl font-light text-slate-900 mb-4">개인정보 수집·이용 동의</h1>
                    <p class="text-slate-600 font-light" id="step2Subtitle">소셜 회원가입</p>
                </div>

                <div class="bg-white p-8 md:p-10 shadow-sm">
                    <div class="space-y-6">
                        <!-- 전체 동의 -->
                        <div class="pb-4 border-b">
                            <label class="flex items-center gap-3 cursor-pointer">
                                <input type="checkbox" id="agreeAll" onchange="toggleAllConsents()"
                                       class="w-5 h-5 border-2 border-slate-300 focus:ring-slate-900">
                                <span class="text-lg font-medium">전체 동의</span>
                            </label>
                        </div>

                        <!-- 필수 동의 항목 -->
                        <div class="space-y-4">
                            <label class="flex items-start gap-3 cursor-pointer group">
                                <input type="checkbox" class="consent-checkbox mt-1 w-5 h-5 border-2 border-slate-300 focus:ring-slate-900" required>
                                <div class="flex-1">
                                    <div class="flex items-center gap-2 justify-between">
                                        <span class="font-medium">[필수] 서비스 이용약관 동의</span>
                                        <button type="button" onclick="openTermsModal()" class="text-xs text-blue-600 hover:text-blue-800 underline">
                                            전체보기
                                        </button>
                                    </div>
                                    <div class="mt-2 text-sm text-slate-600 bg-slate-50 p-4 rounded max-h-48 overflow-y-auto leading-relaxed">
                                        <p class="font-medium mb-2">제1조 목적</p>
                                        <p class="mb-3">본 이용약관은 "그리스도 사랑교회"(이하 "교회")의 서비스의 이용조건과 운영에 관한 제반 사항 규정을 목적으로 합니다.</p>
                                        <p class="text-xs text-slate-500 mt-4">※ 전체 약관은 '전체보기' 버튼을 클릭하여 확인하실 수 있습니다.</p>
                                    </div>
                                </div>
                            </label>

                            <label class="flex items-start gap-3 cursor-pointer group">
                                <input type="checkbox" class="consent-checkbox mt-1 w-5 h-5 border-2 border-slate-300 focus:ring-slate-900" required>
                                <div class="flex-1">
                                    <div class="flex items-center gap-2">
                                        <span class="font-medium">[필수] 개인정보 수집 및 이용 동의</span>
                                    </div>
                                    <div class="mt-2 text-sm text-slate-600 bg-slate-50 p-4 rounded max-h-48 overflow-y-auto">
                                        <p class="font-medium mb-2">1. 개인정보 수집목적 및 이용목적</p>
                                        <p class="mb-3 text-xs">회원 가입 의사 확인, 회원제 서비스 제공, 본인 식별·인증 등</p>
                                        <p class="font-medium mb-2">2. 수집하는 개인정보 항목</p>
                                        <p class="mb-3">이름, 성별, 전화번호 등</p>
                                        <p class="font-medium mb-2">3. 개인정보 보유 및 이용기간</p>
                                        <p>회원탈퇴 시까지</p>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="flex gap-4 mt-8">
                        <button type="button" onclick="goToStep(1)"
                                class="flex-1 py-3 border-2 border-slate-300 text-slate-700 hover:border-slate-900 transition font-medium">
                            이전
                        </button>
                        <button type="button" onclick="goToStep(3)"
                                class="flex-1 py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium">
                            다음
                        </button>
                    </div>
                </div>
            </div>

            <!-- 3단계: 정보 입력 -->
            <div id="step3" class="step-container hidden">
                <div class="text-center mb-10">
                    <h1 class="text-4xl md:text-5xl font-light text-slate-900 mb-4">추가 정보 입력</h1>
                    <p class="text-slate-600 font-light" id="step3Subtitle">회원가입을 위한 정보를 입력해주세요</p>
                </div>

                <div class="bg-white p-8 md:p-10 shadow-sm">
                    <form id="registerForm" class="space-y-6">
                        <!-- 에러 메시지 -->
                        <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded text-sm"></div>

                        <!-- 필수 정보 섹션 -->
                        <div class="pb-2 border-b">
                            <h3 class="text-lg font-medium text-slate-900">필수 정보</h3>
                        </div>

                        <!-- 이름 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                이름 <span class="text-red-500">*</span>
                            </label>
                            <input type="text" 
                                   id="name" 
                                   name="name" 
                                   required 
                                   maxlength="50"
                                   placeholder="홍길동"
                                   class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition">
                        </div>

                        <!-- 성별 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                성별 <span class="text-red-500">*</span>
                            </label>
                            <div class="flex gap-4">
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="gender" value="MALE" required class="w-4 h-4 text-slate-900 focus:ring-slate-900">
                                    <span class="ml-2 text-slate-700">남성</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="gender" value="FEMALE" required class="w-4 h-4 text-slate-900 focus:ring-slate-900">
                                    <span class="ml-2 text-slate-700">여성</span>
                                </label>
                            </div>
                        </div>

                        <!-- 전화번호 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">
                                전화번호 <span class="text-red-500">*</span>
                            </label>
                            <input type="tel" 
                                   id="phoneNumber" 
                                   name="phoneNumber" 
                                   required
                                   placeholder="010-0000-0000"
                                   pattern="010-\d{4}-\d{4}"
                                   class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition">
                            <p class="mt-1 text-xs text-slate-500">010-0000-0000 형식으로 입력해주세요</p>
                        </div>

                        <!-- 미등록교인 전용 필드 -->
                        <div id="unregisteredFields" class="space-y-6 hidden">
                            <!-- 추가 정보 섹션 -->
                            <div class="pt-4 pb-2 border-b">
                                <h3 class="text-lg font-medium text-slate-900">추가 정보</h3>
                                <p class="text-sm text-slate-500 mt-1">가입 경로는 필수로 입력해주세요</p>
                            </div>

                            <!-- 주소 (선택) -->
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">
                                    주소
                                </label>
                                <div class="flex gap-2 mb-2">
                                    <input type="text"
                                           id="postcode"
                                           readonly
                                           placeholder="우편번호"
                                           class="w-32 px-4 py-3 border border-slate-300 bg-slate-50 outline-none">
                                    <button type="button"
                                            onclick="execDaumPostcode()"
                                            class="px-4 py-3 border-2 border-slate-300 hover:border-slate-900 transition font-medium">
                                        주소 검색
                                    </button>
                                </div>
                                <input type="text"
                                       id="roadAddress"
                                       name="roadAddress"
                                       readonly
                                       placeholder="도로명 주소"
                                       class="w-full px-4 py-3 border border-slate-300 bg-slate-50 outline-none mb-2">
                                <input type="text"
                                       id="detailAddress"
                                       name="detailAddress"
                                       placeholder="상세주소 (선택)"
                                       class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition">
                            </div>

                            <!-- 생년월일 (선택) -->
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">
                                    생년월일
                                </label>
                                <input type="date" 
                                       id="birth" 
                                       name="birth" 
                                       class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition">
                            </div>

                            <!-- 등록 경로 (필수) -->
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">
                                    교회를 알게 된 경로 <span class="text-red-500">*</span>
                                </label>
                                <textarea id="registrationPath" 
                                          name="registrationPath" 
                                          rows="3" 
                                          maxlength="500"
                                          placeholder="예) 지인 소개, 인터넷 검색 등"
                                          class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition resize-none"></textarea>
                            </div>
                        </div>

                        <div class="flex gap-4">
                            <button type="button" onclick="goToStep(2)"
                                    class="flex-1 py-3 border-2 border-slate-300 text-slate-700 hover:border-slate-900 transition font-medium">
                                이전
                            </button>
                            <button type="submit"
                                    id="submitBtn"
                                    class="flex-1 py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium">
                                회원가입 완료
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- 이용약관 전체보기 모달 (기존 register.html과 동일) -->
    <div id="termsModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-6">
        <div class="bg-white rounded-lg max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col">
            <div class="p-6 border-b flex items-center justify-between">
                <h2 class="text-2xl font-light">서비스 이용약관</h2>
                <button type="button" onclick="closeTermsModal()" class="text-slate-400 hover:text-slate-900">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-1 text-sm leading-relaxed">
                <p class="mb-6">본 이용약관은 "그리스도 사랑교회"의 서비스 이용조건과 운영에 관한 제반 사항을 규정합니다.</p>
            </div>
            <div class="p-6 border-t">
                <button type="button" onclick="closeTermsModal()"
                        class="w-full py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium rounded">
                    닫기
                </button>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="extra-scripts">
    <script th:inline="javascript">
        // URL에서 tempToken 파라미터 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const tempToken = urlParams.get('tempToken');

        if (!tempToken) {
            alert('잘못된 접근입니다.');
            window.location.href = '/auth/login';
        }

        let selectedUserType = null;
        let agreedToTerms = false;
        let agreedToPrivacy = false;

        // 단계 전환
        function goToStep(step) {
            document.querySelectorAll('.step-container').forEach(el => el.classList.add('hidden'));
            
            if (step === 2) {
                // Step 2로 이동 전 교인 구분 선택 확인
                if (!selectedUserType) {
                    alert('교인 구분을 선택해주세요.');
                    goToStep(1);
                    return;
                }
            } else if (step === 3) {
                // Step 3로 이동 전 약관 동의 확인
                const checkboxes = document.querySelectorAll('.consent-checkbox[required]');
                const allChecked = Array.from(checkboxes).every(cb => cb.checked);
                
                if (!allChecked) {
                    alert('필수 약관에 모두 동의해주세요.');
                    return;
                }
                
                agreedToTerms = checkboxes[0].checked;
                agreedToPrivacy = checkboxes[1].checked;
                
                // Step 3 UI 조정
                const step3Subtitle = document.getElementById('step3Subtitle');
                const unregisteredFields = document.getElementById('unregisteredFields');
                const registrationPathField = document.getElementById('registrationPath');
                
                if (selectedUserType === 'UNREGISTERED') {
                    step3Subtitle.textContent = '미등록교인 가입 - 추가 정보를 입력해주세요';
                    unregisteredFields.classList.remove('hidden');
                    registrationPathField.required = true;
                } else {
                    step3Subtitle.textContent = '등록교인 가입 - 기본 정보를 입력해주세요';
                    unregisteredFields.classList.add('hidden');
                    registrationPathField.required = false;
                }
            }
            
            document.getElementById('step' + step).classList.remove('hidden');
        }

        // 교인 구분 선택
        function selectUserType(type) {
            selectedUserType = type;
            const step2Subtitle = document.getElementById('step2Subtitle');
            step2Subtitle.textContent = type === 'REGISTERED' ? '등록교인 가입' : '미등록교인 가입';
            goToStep(2);
        }

        // 전체 동의 토글
        function toggleAllConsents() {
            const agreeAll = document.getElementById('agreeAll');
            const checkboxes = document.querySelectorAll('.consent-checkbox');
            checkboxes.forEach(cb => cb.checked = agreeAll.checked);
        }

        // 약관 모달
        function openTermsModal() {
            document.getElementById('termsModal').classList.remove('hidden');
        }

        function closeTermsModal() {
            document.getElementById('termsModal').classList.add('hidden');
        }

        // 전화번호 자동 포맷팅
        document.addEventListener('DOMContentLoaded', function() {
            const phoneInput = document.getElementById('phoneNumber');
            phoneInput.addEventListener('input', function(e) {
                let value = e.target.value.replace(/[^0-9]/g, '');
                if (value.length > 3 && value.length <= 7) {
                    value = value.slice(0, 3) + '-' + value.slice(3);
                } else if (value.length > 7) {
                    value = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
                }
                e.target.value = value;
            });
        });

        // Daum 주소 API
        function execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    document.getElementById('postcode').value = data.zonecode;
                    document.getElementById('roadAddress').value = data.roadAddress;
                    document.getElementById('detailAddress').focus();
                }
            }).open();
        }

        // 폼 제출
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');

            // 필수 입력값 검증
            const name = document.getElementById('name').value.trim();
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            const gender = document.querySelector('[name="gender"]:checked')?.value;

            if (!name || !gender || !phoneNumber) {
                errorDiv.textContent = '모든 필수 항목을 입력해주세요.';
                errorDiv.classList.remove('hidden');
                return;
            }

            // 전화번호 형식 검증
            const phonePattern = /^010-\d{4}-\d{4}$/;
            if (!phonePattern.test(phoneNumber)) {
                errorDiv.textContent = '전화번호는 010-0000-0000 형식으로 입력해주세요.';
                errorDiv.classList.remove('hidden');
                return;
            }

            // 미등록교인인 경우 가입경로 필수 검증
            let registrationPath = null;
            if (selectedUserType === 'UNREGISTERED') {
                registrationPath = document.getElementById('registrationPath').value.trim();
                if (!registrationPath) {
                    errorDiv.textContent = '교회를 알게 된 경로를 입력해주세요.';
                    errorDiv.classList.remove('hidden');
                    return;
                }
            }

            // 주소 조합 (도로명주소 + 상세주소)
            let fullAddress = null;
            if (selectedUserType === 'UNREGISTERED') {
                const roadAddress = document.getElementById('roadAddress').value.trim();
                const detailAddress = document.getElementById('detailAddress').value.trim();

                if (roadAddress) {
                    fullAddress = roadAddress;
                    if (detailAddress) {
                        fullAddress += ', ' + detailAddress;
                    }
                }
            }

            submitBtn.disabled = true;
            submitBtn.textContent = '처리 중...';
            errorDiv.classList.add('hidden');

            const formData = {
                name: name,
                gender: gender,
                phoneNumber: phoneNumber,
                birth: selectedUserType === 'UNREGISTERED' ? (document.getElementById('birth').value || null) : null,
                address: fullAddress,
                registrationPath: registrationPath,
                userType: selectedUserType,
                agreedToTerms: agreedToTerms,
                agreedToPrivacy: agreedToPrivacy
            };

            try {
                const response = await fetch(`/api/social/complete-registration?token=${tempToken}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    alert(data.message);
                    window.location.href = '/social/pending';
                } else {
                    errorDiv.textContent = data.message;
                    errorDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '회원가입 완료';
                }

            } catch (error) {
                console.error('회원가입 처리 실패:', error);
                errorDiv.textContent = '회원가입 처리 중 오류가 발생했습니다.';
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = '회원가입 완료';
            }
        });

        // 초기화
        goToStep(1);
    </script>
</th:block>

</body>
</html>
