<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>승인 대기 - 그리스도 사랑교회</title>
</head>

<body>

<main layout:fragment="content">
    <section class="min-h-screen flex items-center justify-center bg-slate-50 px-6 py-32">
        <div class="max-w-md w-full">
            <div class="bg-white p-8 md:p-10 shadow-sm text-center">
                <div class="mb-6">
                    <svg class="w-16 h-16 mx-auto text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>

                <h1 class="text-2xl font-light text-slate-900 mb-4">소셜 로그인 승인 대기 중</h1>
                
                <div class="text-slate-600 mb-8 space-y-3">
                    <p>회원가입 신청이 접수되었습니다.</p>
                    <p class="text-sm">관리자 승인 후 로그인이 가능합니다.</p>
                    <p class="text-sm text-slate-500">승인 처리는 영업일 기준 1-2일 정도 소요됩니다.</p>
                </div>

                <div class="space-y-3">
                    <a href="/" 
                       class="block w-full py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium rounded">
                        홈으로 이동
                    </a>
                    
                    <a href="/auth/login" 
                       class="block w-full py-3 border-2 border-slate-300 text-slate-700 hover:border-slate-900 transition font-medium rounded">
                        로그인 페이지로
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>

</body>
</html>
