<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">

<head>
    <title>송구영신예배 - 그리스도 사랑교회</title>
</head>

<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-16 bg-slate-900 text-white px-6">
        <div class="max-w-6xl mx-auto">
            <p class="text-xs tracking-[0.3em] text-slate-400 uppercase mb-3">New Year Service</p>
            <h1 class="text-4xl md:text-5xl font-light tracking-tight mb-4"
                th:text="${newYear != null ? newYear.title : '송구영신예배'}">송구영신예배</h1>
            <p class="text-lg text-slate-300 font-light"
               th:text="${newYear != null ? newYear.description : '한 해를 보내고 새 해를 맞이하는 특별 예배'}">
                한 해를 보내고 새 해를 맞이하는 특별 예배
            </p>
        </div>
    </section>

    <!-- 관리자 컨트롤 -->
    <section sec:authorize="hasRole('ADMIN')" class="py-4 bg-slate-50 px-6 border-b border-slate-200">
        <div class="max-w-6xl mx-auto flex justify-end gap-3">
            <button onclick="openTranscriptEditor()"
                    class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition text-sm font-medium">
                녹취본 수정
            </button>
            <button onclick="updateLatestVideo()"
                    class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition text-sm font-medium">
                최신 영상 불러오기
            </button>
        </div>
    </section>

    <!-- YouTube 영상 Section -->
    <section class="py-16 bg-white px-6">
        <div class="max-w-4xl mx-auto">
            <div class="text-center mb-12">
                <h2 class="text-sm tracking-[0.2em] text-slate-400 uppercase mb-4">Worship Video</h2>
                <h3 class="text-3xl font-light text-slate-900 mb-4">예배 영상</h3>
                <p class="text-lg text-slate-600" th:if="${newYear != null && newYear.latestVideoTitle != null}"
                   th:text="${newYear.latestVideoTitle}">영상 제목</p>
            </div>

            <!-- YouTube 플레이어 -->
            <div th:if="${newYear != null && newYear.latestVideoId != null}" class="relative pb-[56.25%] h-0 rounded-lg overflow-hidden shadow-lg">
                <iframe th:src="'https://www.youtube.com/embed/' + ${newYear.latestVideoId}"
                        class="absolute top-0 left-0 w-full h-full"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                </iframe>
            </div>

            <!-- 영상이 없을 때 -->
            <div th:if="${newYear == null || newYear.latestVideoId == null}" class="text-center py-16 bg-slate-50 rounded-lg">
                <svg class="w-16 h-16 mx-auto mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p class="text-slate-500">아직 등록된 영상이 없습니다</p>
                <p sec:authorize="hasRole('ADMIN')" class="text-sm text-slate-400 mt-2">
                    관리자 페이지에서 YouTube 재생목록을 설정하고 영상을 불러오세요
                </p>
            </div>
        </div>
    </section>

    <!-- 송구영신예배 녹취본 -->
    <section class="py-16 bg-slate-50 px-6">
        <div class="max-w-4xl mx-auto">
            <div class="text-center mb-12">
                <h2 class="text-sm tracking-[0.2em] text-slate-400 uppercase mb-4">Transcript</h2>
                <h3 class="text-3xl font-light text-slate-900 mb-8">예배 녹취록</h3>
            </div>

            <div th:if="${newYear != null && newYear.transcript != null && !newYear.transcript.isEmpty()}"
                 class="bg-white p-8 md:p-12 rounded-lg shadow-sm">
                <div class="prose prose-lg max-w-none"
                     th:utext="${newYear.transcript}">
                </div>
            </div>

            <div th:if="${newYear == null || newYear.transcript == null || newYear.transcript.isEmpty()}"
                 class="text-center py-16">
                <svg class="w-16 h-16 mx-auto mb-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                <p class="text-slate-500">아직 등록된 녹취록이 없습니다</p>
                <p sec:authorize="hasRole('ADMIN')" class="text-sm text-slate-400 mt-2">
                    관리자는 [녹취본 수정] 버튼을 눌러 녹취록을 등록할 수 있습니다
                </p>
            </div>
        </div>
    </section>

    <!-- 녹취본 편집 모달 -->
    <div id="transcriptModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] flex flex-col">
            <!-- 모달 헤더 -->
            <div class="flex items-center justify-between p-6 border-b border-slate-200">
                <h3 class="text-xl font-medium text-slate-900">녹취본 편집</h3>
                <button onclick="closeTranscriptEditor()" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- 모달 본문 -->
            <div class="flex-1 overflow-y-auto p-6">
                <div id="transcriptEditor" style="min-height: 400px;"></div>
            </div>

            <!-- 모달 푸터 -->
            <div class="flex gap-3 p-6 border-t border-slate-200">
                <button onclick="saveTranscript()"
                        class="flex-1 px-6 py-3 bg-blue-600 text-white rounded hover:bg-blue-700 transition font-medium">
                    저장
                </button>
                <button onclick="closeTranscriptEditor()"
                        class="flex-1 px-6 py-3 bg-slate-200 text-slate-700 rounded hover:bg-slate-300 transition font-medium">
                    취소
                </button>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="extra-scripts">
    <!-- Quill Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const currentTranscript = /*[[${newYear != null ? newYear.transcript : ''}]]*/ '';
        /*]]>*/

        let quill;

        // Quill 에디터 초기화
        function initQuillEditor() {
            if (!quill) {
                quill = new Quill('#transcriptEditor', {
                    theme: 'snow',
                    placeholder: '녹취본 내용을 입력하세요...',
                    modules: {
                        toolbar: [
                            [{ 'header': [1, 2, 3, false] }],
                            ['bold', 'italic', 'underline'],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            [{ 'align': [] }],
                            ['blockquote'],
                            ['clean']
                        ]
                    }
                });
            }
        }

        // 녹취본 편집 모달 열기
        function openTranscriptEditor() {
            const modal = document.getElementById('transcriptModal');
            modal.classList.remove('hidden');

            // Quill 초기화 및 기존 내용 로드
            initQuillEditor();

            if (currentTranscript) {
                quill.root.innerHTML = currentTranscript;
            } else {
                quill.setText('');
            }
        }

        // 녹취본 편집 모달 닫기
        function closeTranscriptEditor() {
            const modal = document.getElementById('transcriptModal');
            modal.classList.add('hidden');
        }

        // 녹취본 저장
        async function saveTranscript() {
            const content = quill.root.innerHTML;

            if (!content || content === '<p><br></p>') {
                if (!confirm('녹취본 내용이 비어있습니다. 계속하시겠습니까?')) {
                    return;
                }
            }

            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('/api/newyear/transcript', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ transcript: content })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message);
                    location.reload();
                } else {
                    alert(data.message || '녹취본 저장에 실패했습니다.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('녹취본 저장 중 오류가 발생했습니다.');
            }
        }
        // 최신 영상 업데이트 (관리자)
        async function updateLatestVideo() {
            if (!confirm('YouTube에서 최신 영상을 불러오시겠습니까?')) {
                return;
            }

            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch('/api/newyear/update-video', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message);
                    location.reload();
                } else {
                    alert(data.message || '영상 업데이트에 실패했습니다.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('영상 업데이트 중 오류가 발생했습니다.');
            }
        }
    </script>
</th:block>

</body>
</html>
