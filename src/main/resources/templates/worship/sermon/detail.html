<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${sermon.title} + ' - 그리스도 사랑교회'">설교</title>
    <link rel="stylesheet" th:href="@{/css/worship/sermon-list.css}">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common/quill-custom.css}">
</head>
<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-20 bg-slate-900 text-white px-6">
        <div class="max-w-4xl mx-auto">
            <a th:href="@{/worship/sermon}" 
               class="inline-flex items-center text-sm text-slate-400 hover:text-white mb-12 group transition-all duration-300">
                <svg class="w-4 h-4 mr-2 transition-transform duration-300 group-hover:-translate-x-1" 
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span class="font-light tracking-wide">목록으로</span>
            </a>
            
            <div class="mb-8">
                <p class="text-xs tracking-[0.3em] text-slate-400 uppercase mb-4" th:text="${sermon.category}">Sermon</p>
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-light text-white leading-[1.3] tracking-tight mb-8"
                    th:text="${sermon.title}">
                    설교 제목
                </h1>
                <div class="h-px w-16 bg-slate-700 mb-8"></div>
            </div>

            <!-- 메타 정보 -->
            <div class="flex flex-wrap items-center justify-between gap-6">
                <div class="flex flex-wrap items-center gap-6 text-slate-300 font-light">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        <span th:text="${sermon.preacher}">설교자</span>
                    </div>
                    <span class="text-slate-600">•</span>
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <span th:text="${#temporals.format(sermon.sermonDate, 'yyyy. MM. dd')}">2024. 11. 15</span>
                    </div>
                    <span class="text-slate-600">•</span>
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                        <span th:text="${sermon.scripture}">요한복음 3:16</span>
                    </div>
                </div>

                <!-- 관리자 버튼 -->
                <div sec:authorize="hasRole('ADMIN')" class="flex gap-3">
                    <button onclick="openEditModal()"
                            class="px-4 py-2 border-2 border-white text-white hover:bg-white hover:text-slate-900 transition font-medium">
                        수정
                    </button>
                    <button onclick="confirmDelete()"
                            class="px-4 py-2 border-2 border-red-300 text-red-300 hover:bg-red-600 hover:text-white hover:border-red-600 transition font-medium">
                        삭제
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 유튜브 영상 -->
    <section id="youtubeSection" class="py-16 bg-white px-6 hidden">
        <div class="max-w-4xl mx-auto">
            <div class="mb-8">
                <h2 class="text-sm tracking-[0.2em] text-slate-400 uppercase mb-2">Sermon Video</h2>
                <h3 class="text-3xl font-light text-slate-900">설교 영상</h3>
            </div>
            <div id="videoContainer" class="aspect-video bg-slate-900 overflow-hidden shadow-xl">
                <!-- JavaScript로 동적 생성 -->
            </div>
        </div>
    </section>

    <!-- 설교 내용 -->
    <section class="py-24 bg-white px-6">
        <article class="max-w-4xl mx-auto">
            <!-- 내용 -->
            <div class="prose prose-lg prose-slate max-w-none">
                <div th:utext="${sermon.content}"
                     class="text-slate-700 leading-[1.9] font-light text-lg">
                    설교 내용
                </div>
            </div>

            <!-- 첨부파일 -->
            <div th:if="${sermon.attachments != null && !#lists.isEmpty(sermon.attachments)}"
                 class="mt-20 pt-12 border-t border-slate-200">
                <h3 class="text-sm tracking-[0.2em] text-slate-400 uppercase mb-6">Attachments</h3>
                <div class="space-y-3">
                    <div th:each="attachment : ${sermon.attachments}"
                         class="flex items-center gap-4 p-5 bg-slate-50 hover:bg-slate-100 transition-all duration-300 group">
                        <div class="w-12 h-12 flex items-center justify-center bg-white group-hover:bg-slate-900 transition-all duration-300">
                            <svg class="w-6 h-6 text-slate-400 group-hover:text-white transition-colors duration-300"
                                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="font-light text-slate-900 truncate"
                               th:text="${attachment.originalFileName}">
                                파일명.pdf
                            </p>
                            <p class="text-sm text-slate-500 font-light"
                               th:text="${#numbers.formatDecimal(attachment.fileSize / 1024.0, 1, 2)} + ' KB'">
                                1.5 KB
                            </p>
                        </div>
                        <a th:href="@{/api/files/download/{id}(id=${attachment.id})}"
                           class="px-4 py-2 bg-slate-900 text-white hover:bg-slate-800 transition-all duration-300 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            다운로드
                        </a>
                    </div>
                </div>
            </div>
        </article>
    </section>

    <!-- Navigation -->
    <section class="py-12 bg-slate-50 px-6">
        <div class="max-w-4xl mx-auto">
            <a th:href="@{/worship/sermon}"
               class="group inline-flex items-center px-8 py-4 border-2 border-slate-900 text-slate-900 hover:bg-slate-900 hover:text-white transition-all duration-300 font-light tracking-wide">
                <svg class="w-5 h-5 mr-2 transition-transform duration-300 group-hover:-translate-x-1" 
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                목록으로 돌아가기
            </a>
        </div>
    </section>
</main>

<!-- 수정 모달 -->
<th:block layout:fragment="modals">
    <div id="sermonModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
        <div class="relative bg-white w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
            <div class="flex items-center justify-between px-8 py-6 border-b border-slate-100">
                <div>
                    <h2 id="modalTitle" class="text-2xl font-light text-slate-900 tracking-tight">설교 수정</h2>
                    <p class="text-sm text-slate-500 mt-1 font-light">설교 정보를 수정해주세요</p>
                </div>
                <button onclick="closeModal()"
                        class="text-slate-400 hover:text-slate-900 transition-colors p-2 hover:bg-slate-50 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto px-8 py-6">
                <form id="sermonForm" class="space-y-6">
                    <div class="grid sm:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-sm font-medium text-slate-700 tracking-wide">설교 제목 <span class="text-red-500">*</span></label>
                            <input type="text" id="sermonTitle" required
                                   class="w-full px-4 py-3 bg-slate-50 border border-slate-200 focus:bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-all font-light">
                        </div>

                        <div class="space-y-2">
                            <label class="text-sm font-medium text-slate-700 tracking-wide">성경 구절 <span class="text-red-500">*</span></label>
                            <input type="text" id="sermonBibleVerse" required placeholder="예: 요한복음 3:16"
                                   class="w-full px-4 py-3 bg-slate-50 border border-slate-200 focus:bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-all font-light">
                        </div>

                        <div class="space-y-2">
                            <label class="text-sm font-medium text-slate-700 tracking-wide">설교자 <span class="text-red-500">*</span></label>
                            <div class="flex gap-2">
                                <input type="text" id="sermonPreacher" required placeholder="설교자 이름" readonly
                                       style="width: 186.25px;"
                                       class="px-4 py-3 bg-slate-100 border border-slate-200 focus:bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-all font-light">
                                <select id="sermonPreacherSelect"
                                        style="width: 202.25px; background-image: url('data:image/svg+xml;charset=UTF-8,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23475569%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3e%3cpolyline points=%276 9 12 15 18 9%27%3e%3c/polyline%3e%3c/svg%3e'); background-position: right 0.75rem center; background-repeat: no-repeat; background-size: 1.25rem;"
                                        class="px-3 py-3 bg-slate-50 border border-slate-200 focus:bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-all font-light appearance-none pr-10">
                                    <option value="">교역자 선택</option>
                                    <option value="__DIRECT__">직접입력</option>
                                </select>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="text-sm font-medium text-slate-700 tracking-wide">설교 날짜 <span class="text-red-500">*</span></label>
                            <input type="date" id="sermonDate" required
                                   class="w-full px-4 py-3 bg-slate-50 border border-slate-200 focus:bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-all font-light">
                        </div>
                    </div>

                    <div class="grid sm:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-sm font-medium text-slate-700 tracking-wide">카테고리</label>
                            <input type="text" id="sermonCategory" readonly
                                   class="w-full px-4 py-3 bg-slate-100 border border-slate-200 font-light cursor-not-allowed">
                        </div>

                        <div class="space-y-2" th:if="${sermon.category == '주일오전' || sermon.category == '기타예배'}">
                            <label class="text-sm font-medium text-slate-700 tracking-wide">
                                <span th:if="${sermon.category == '주일오전'}">부 구분</span>
                                <span th:if="${sermon.category == '기타예배'}">예배 구분</span>
                            </label>
                            <select id="sermonServiceNumber"
                                    style="background-image: url('data:image/svg+xml;charset=UTF-8,%3csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23475569%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3e%3cpolyline points=%276 9 12 15 18 9%27%3e%3c/polyline%3e%3c/svg%3e'); background-position: right 0.75rem center; background-repeat: no-repeat; background-size: 1.25rem;"
                                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 focus:bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-all font-light appearance-none pr-10">
                                <option value="">선택하세요</option>
                                <option th:if="${sermon.category == '주일오전'}" value="1">1부 예배</option>
                                <option th:if="${sermon.category == '주일오전'}" value="2">2부 예배</option>
                                <option th:if="${sermon.category == '기타예배'}" value="1">수요예배</option>
                                <option th:if="${sermon.category == '기타예배'}" value="2">금요기도회</option>
                            </select>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-700 tracking-wide">유튜브 영상 URL</label>
                        <input type="url" id="sermonVideoUrl" placeholder="https://www.youtube.com/watch?v=..."
                               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 focus:bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-all font-light">
                    </div>

                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-700 tracking-wide">설교 내용 <span class="text-red-500">*</span></label>
                        <div id="sermonContent" style="height: 300px;"
                             class="bg-slate-50 border border-slate-200 focus-within:bg-white focus-within:border-slate-900"></div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-sm font-medium text-slate-700 tracking-wide">파일 첨부</label>
                        <input type="file" id="sermonFiles" multiple accept=".pdf,.hwp,.jpg,.jpeg,.png"
                               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 focus:bg-white focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition-all font-light">
                        <p class="text-xs text-slate-500">PDF, HWP, JPG, PNG 파일만 첨부 가능합니다 (최대 10MB)</p>
                    </div>
                </form>
            </div>

            <div class="flex items-center justify-end gap-3 px-8 py-6 bg-slate-50 border-t border-slate-100">
                <button type="button" onclick="closeModal()"
                        class="px-6 py-2.5 text-slate-700 hover:text-slate-900 font-medium transition-colors">
                    취소
                </button>
                <button type="button" onclick="saveSermon()"
                        class="px-8 py-2.5 bg-slate-900 text-white hover:bg-slate-800 font-medium transition-all shadow-sm hover:shadow">
                    저장
                </button>
            </div>
        </div>
    </div>
</th:block>

<!-- 수정/삭제 관련 JavaScript -->
<th:block layout:fragment="extra-scripts">
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill-image-resize-module@3.0.0/image-resize.min.js"></script>
    <script th:src="@{/js/common/utils.js}"></script>
    <script th:src="@{/js/common/api.js}"></script>
    <script th:src="@{/js/common/quill-editor.js}"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const sermonData = {
            id: /*[[${sermon.id}]]*/ 0,
            title: /*[[${sermon.title}]]*/ '',
            category: /*[[${sermon.category}]]*/ '',
            preacher: /*[[${sermon.preacher}]]*/ '',
            scripture: /*[[${sermon.scripture}]]*/ '',
            sermonDate: /*[[${sermon.sermonDate}]]*/ '',
            videoUrl: /*[[${sermon.videoUrl != null ? sermon.videoUrl : ''}]]*/ '',
            content: /*[[${sermon.content}]]*/ '',
            serviceNumber: /*[[${sermon.serviceNumber}]]*/ null
        };

        let quill = null;
        let staffList = [];
        /*]]>*/

        // YouTube URL에서 videoId 추출
        function extractYouTubeId(url) {
            if (!url) return null;

            // https://www.youtube.com/watch?v=VIDEO_ID
            if (url.includes('youtube.com/watch')) {
                const urlParams = new URLSearchParams(url.split('?')[1]);
                return urlParams.get('v');
            }

            // https://youtu.be/VIDEO_ID
            if (url.includes('youtu.be/')) {
                return url.split('youtu.be/')[1].split('?')[0];
            }

            // https://www.youtube.com/embed/VIDEO_ID
            if (url.includes('youtube.com/embed/')) {
                return url.split('embed/')[1].split('?')[0];
            }

            return null;
        }

        // YouTube 영상 렌더링
        function renderYouTubeVideo() {
            const section = document.getElementById('youtubeSection');
            const container = document.getElementById('videoContainer');

            console.log('=== renderYouTubeVideo 호출 ===');
            console.log('section:', section);
            console.log('container:', container);
            console.log('videoUrl:', sermonData.videoUrl);

            if (!container) {
                console.error('videoContainer를 찾을 수 없습니다');
                return;
            }

            if (!sermonData.videoUrl) {
                console.log('videoUrl이 없습니다');
                if (section) section.classList.add('hidden');
                return;
            }

            const videoId = extractYouTubeId(sermonData.videoUrl);
            console.log('추출된 videoId:', videoId);

            if (!videoId) {
                console.error('유효하지 않은 YouTube URL:', sermonData.videoUrl);
                if (section) section.classList.add('hidden');
                return;
            }

            // 섹션 표시
            if (section) section.classList.remove('hidden');

            container.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${videoId}"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen
                        class="w-full h-full">
                </iframe>
            `;
            console.log('YouTube 영상 렌더링 완료');
        }

        // 교역자 목록 로드
        async function loadStaffList() {
            try {
                const response = await fetch('/api/staff/preachers');
                if (response.ok) {
                    staffList = await response.json();
                    console.log('설교자 목록 로드 완료:', staffList.length, '명');
                }
            } catch (error) {
                console.error('설교자 목록 로드 실패:', error);
            }
        }

        // 설교자 select 박스 채우기
        function populatePreacherSelect() {
            const selectElement = document.getElementById('sermonPreacherSelect');
            if (!selectElement) return;

            // 기존 옵션 제거 (첫 번째 "교역자 선택"과 마지막 "직접입력" 제외)
            while (selectElement.options.length > 2) {
                selectElement.remove(1);
            }

            // 교역자 목록으로 옵션 추가
            const directInputOption = selectElement.lastElementChild;
            staffList.forEach(staff => {
                const option = document.createElement('option');
                const displayText = `${staff.name} ${staff.displayPosition}`;
                option.value = displayText;
                option.textContent = displayText;
                selectElement.insertBefore(option, directInputOption);
            });
        }

        // 설교자 select 이벤트 설정
        function setupPreacherSelect() {
            const selectElement = document.getElementById('sermonPreacherSelect');
            const inputElement = document.getElementById('sermonPreacher');

            if (!selectElement || !inputElement) return;

            selectElement.addEventListener('change', function() {
                if (this.value === '__DIRECT__') {
                    inputElement.value = '';
                    inputElement.readOnly = false;
                    inputElement.classList.remove('bg-slate-100');
                    inputElement.classList.add('bg-slate-50');
                    inputElement.placeholder = '설교자 이름 직접입력';
                    inputElement.focus();
                    this.value = '';
                } else if (this.value) {
                    inputElement.value = this.value;
                    inputElement.readOnly = true;
                    inputElement.classList.remove('bg-slate-50');
                    inputElement.classList.add('bg-slate-100');
                    inputElement.placeholder = '설교자 이름';
                    this.value = '';
                }
            });
        }

        function openEditModal() {
            if (!checkToken()) return;

            // 모달 제목 변경
            document.getElementById('modalTitle').textContent = '설교 수정';

            // Quill 에디터 초기화
            if (!quill) {
                quill = QuillEditor.init('#sermonContent', {
                    placeholder: '설교 내용을 입력하세요...',
                    uploadUrl: '/api/sermons/upload-image',
                    height: 300
                });
            }

            // 설교자 select 박스 채우기
            populatePreacherSelect();

            // 데이터 채우기
            document.getElementById('sermonTitle').value = sermonData.title || '';
            document.getElementById('sermonBibleVerse').value = sermonData.scripture || '';

            const preacherInput = document.getElementById('sermonPreacher');
            preacherInput.value = sermonData.preacher || '';

            // 설교자가 교역자 목록에 있는지 확인
            const isStaffPreacher = staffList.some(staff =>
                `${staff.name} ${staff.displayPosition}` === sermonData.preacher
            );

            if (isStaffPreacher) {
                preacherInput.readOnly = true;
                preacherInput.classList.remove('bg-slate-50');
                preacherInput.classList.add('bg-slate-100');
            } else {
                preacherInput.readOnly = false;
                preacherInput.classList.remove('bg-slate-100');
                preacherInput.classList.add('bg-slate-50');
            }

            document.getElementById('sermonDate').value = sermonData.sermonDate || '';
            document.getElementById('sermonCategory').value = sermonData.category || '';
            document.getElementById('sermonVideoUrl').value = sermonData.videoUrl || '';

            // serviceNumber 설정
            const serviceNumberElement = document.getElementById('sermonServiceNumber');
            if (serviceNumberElement && sermonData.serviceNumber) {
                serviceNumberElement.value = sermonData.serviceNumber;
            }

            // Quill 에디터에 내용 설정
            if (quill && sermonData.content) {
                QuillEditor.setContent(quill, sermonData.content);
            }

            // 모달 열기
            const modal = document.getElementById('sermonModal');
            if (modal) {
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }
        }

        function closeModal() {
            const modal = document.getElementById('sermonModal');
            if (modal) {
                modal.classList.add('hidden');
                document.body.style.overflow = '';

                if (quill) {
                    QuillEditor.clearContent(quill);
                }
            }
        }

        async function saveSermon() {
            if (!checkToken()) return;

            // 폼 데이터 수집
            const title = document.getElementById('sermonTitle').value.trim();
            const bibleVerse = document.getElementById('sermonBibleVerse').value.trim();
            const preacher = document.getElementById('sermonPreacher').value.trim();
            const sermonDate = document.getElementById('sermonDate').value;
            const content = QuillEditor.getContent(quill);
            const category = document.getElementById('sermonCategory').value;
            const videoUrl = document.getElementById('sermonVideoUrl').value.trim();

            // 검증
            if (!title || !bibleVerse || !preacher || !sermonDate || !content || content === '<p><br></p>') {
                alert('모든 필수 필드를 입력해주세요.');
                return;
            }

            // FormData 생성
            const formData = new FormData();
            formData.append('title', title);
            formData.append('scripture', bibleVerse);
            formData.append('preacher', preacher);
            formData.append('sermonDate', sermonDate);
            formData.append('content', content);
            formData.append('category', category);

            // serviceNumber 추가
            const serviceNumberElement = document.getElementById('sermonServiceNumber');
            if (serviceNumberElement && serviceNumberElement.value) {
                formData.append('serviceNumber', serviceNumberElement.value);
            }

            if (videoUrl) {
                formData.append('videoUrl', videoUrl);
            }

            // 파일 첨부
            const fileInput = document.getElementById('sermonFiles');
            if (fileInput && fileInput.files.length > 0) {
                Array.from(fileInput.files).forEach(file => {
                    formData.append('files', file);
                });
            }

            try {
                const headers = getAuthHeaders(false);
                const response = await fetch(`/api/sermons/${sermonData.id}`, {
                    method: 'PUT',
                    headers: headers,
                    body: formData
                });

                if (handleAuthError(response)) return;

                if (response.ok) {
                    alert('설교가 수정되었습니다.');
                    closeModal();
                    location.reload();
                } else {
                    const errorText = await response.text();
                    alert('저장에 실패했습니다.');
                }
            } catch (error) {
                console.error('설교 저장 실패:', error);
                alert('저장에 실패했습니다.');
            }
        }

        function confirmDelete() {
            if (confirm(`"${sermonData.title}" 설교를 삭제하시겠습니까?\n\n이 작업은 되돌릴 수 없습니다.`)) {
                deleteSermon();
            }
        }

        async function deleteSermon() {
            if (!checkToken()) return;

            try {
                const response = await fetch(`/api/sermons/${sermonData.id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                if (handleAuthError(response)) return;

                if (response.ok) {
                    alert('설교가 삭제되었습니다.');
                    window.location.href = '/worship';
                } else {
                    throw new Error('삭제 실패');
                }
            } catch (error) {
                console.error('삭제 실패:', error);
                alert('설교 삭제에 실패했습니다.');
            }
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', async function() {
            // YouTube 영상 렌더링
            renderYouTubeVideo();

            // 교역자 목록 로드
            await loadStaffList();

            // 설교자 select 이벤트 설정
            setupPreacherSelect();

            // Quill 모듈 등록
            QuillEditor.registerCustomFontSizes();
            QuillEditor.registerImageResize();

            // 모달 외부 클릭 시 닫기
            window.addEventListener('click', function(event) {
                const modal = document.getElementById('sermonModal');
                if (event.target === modal) {
                    closeModal();
                }
            });

            // ESC 키로 모달 닫기
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape') {
                    closeModal();
                }
            });
        });
    </script>
</th:block>

</body>
</html>
