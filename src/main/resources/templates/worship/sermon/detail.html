<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${sermon.title} + ' - 그리스도 사랑교회'">설교 상세</title>
</head>
<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-20 bg-slate-50 px-6">
        <div class="max-w-5xl mx-auto">
            <a href="/worship/sermon" 
               class="inline-flex items-center text-sm text-slate-600 hover:text-slate-900 mb-12 group transition-all duration-300">
                <svg class="w-4 h-4 mr-2 transition-transform duration-300 group-hover:-translate-x-1" 
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span class="font-light tracking-wide">목록으로</span>
            </a>
            
            <div class="mb-10">
                <p class="text-xs tracking-[0.3em] text-slate-400 uppercase mb-4">Sermon</p>
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-light text-slate-900 leading-[1.3] tracking-tight mb-8"
                    th:text="${sermon.title}">
                    설교 제목
                </h1>
                <div class="h-px w-16 bg-slate-300 mb-10"></div>
            </div>

            <!-- 메타 정보 -->
            <div class="flex items-center justify-between gap-8 mb-8">
                <div class="grid md:grid-cols-3 gap-8 flex-1">
                    <div class="flex items-start gap-3">
                        <svg class="w-5 h-5 text-slate-400 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        <div>
                            <p class="text-xs tracking-wide text-slate-400 uppercase mb-1">설교자</p>
                            <p class="text-lg font-light text-slate-900" th:text="${sermon.preacher}">목사님</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <svg class="w-5 h-5 text-slate-400 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <div>
                            <p class="text-xs tracking-wide text-slate-400 uppercase mb-1">설교일</p>
                            <p class="text-lg font-light text-slate-900"
                               th:text="${#temporals.format(sermon.sermonDate, 'yyyy. MM. dd')}">2024. 11. 15</p>
                        </div>
                    </div>
                    <div class="flex items-start gap-3">
                        <svg class="w-5 h-5 text-slate-400 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                        <div>
                            <p class="text-xs tracking-wide text-slate-400 uppercase mb-1">본문</p>
                            <p class="text-lg font-light text-slate-900" th:text="${sermon.bibleVerse}">요한복음 3:16</p>
                        </div>
                    </div>
                </div>

                <!-- 관리자 버튼 -->
                <div th:if="${isAdmin}" class="flex gap-3">
                    <button onclick="openEditModal()"
                            class="px-4 py-2 border-2 border-slate-300 hover:border-slate-900 transition font-medium whitespace-nowrap">
                        수정
                    </button>
                    <button onclick="confirmDelete()"
                            class="px-4 py-2 border-2 border-red-300 text-red-600 hover:border-red-600 transition font-medium whitespace-nowrap">
                        삭제
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 설교 요약 -->
    <section th:if="${sermon.summary != null && !sermon.summary.isEmpty()}"
             class="py-16 bg-white px-6 border-b-2 border-slate-100">
        <div class="max-w-5xl mx-auto">
            <div class="max-w-3xl">
                <p class="text-xl md:text-2xl text-slate-700 leading-[1.8] font-light" 
                   th:text="${sermon.summary}">
                    설교 요약 내용이 여기에 표시됩니다.
                </p>
            </div>
        </div>
    </section>

    <!-- 설교 영상 -->
    <section th:if="${sermon.videoUrl != null && !sermon.videoUrl.isEmpty()}"
             class="py-20 bg-slate-50 px-6">
        <div class="max-w-5xl mx-auto">
            <h2 class="text-sm tracking-[0.2em] text-slate-400 uppercase mb-8">Video</h2>
            <div class="video-container bg-slate-900 overflow-hidden">
                <!-- YouTube 임베드 -->
                <iframe th:if="${sermon.videoUrl.contains('youtube') or sermon.videoUrl.contains('youtu.be')}"
                        th:src="${'https://www.youtube.com/embed/' + #strings.substringAfter(#strings.substringAfter(sermon.videoUrl, 'v='), '/')}"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen
                        class="w-full h-full">
                </iframe>
                <!-- 일반 비디오 링크 -->
                <a th:unless="${sermon.videoUrl.contains('youtube') or sermon.videoUrl.contains('youtu.be')}"
                   th:href="${sermon.videoUrl}"
                   target="_blank"
                   class="flex items-center justify-center h-full min-h-[300px] text-white hover:bg-slate-800 transition-colors group">
                    <div class="text-center">
                        <svg class="w-16 h-16 mx-auto mb-4 group-hover:scale-110 transition-transform" 
                             fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <p class="text-lg font-light">설교 영상 보기</p>
                    </div>
                </a>
            </div>
        </div>
    </section>

    <!-- 설교 음성 -->
    <section th:if="${sermon.audioUrl != null && !sermon.audioUrl.isEmpty()}"
             class="py-16 bg-white px-6 border-b-2 border-slate-100">
        <div class="max-w-5xl mx-auto">
            <h2 class="text-sm tracking-[0.2em] text-slate-400 uppercase mb-8">Audio</h2>
            <div class="max-w-3xl">
                <audio controls class="w-full audio-player">
                    <source th:src="${sermon.audioUrl}" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>
    </section>

    <!-- 설교 내용 -->
    <section class="py-24 bg-white px-6">
        <article class="max-w-4xl mx-auto">
            <div class="prose prose-lg prose-slate max-w-none">
                <div th:utext="${sermon.content}"
                     class="text-slate-700 leading-[1.9] font-light text-lg">
                    설교 내용
                </div>
            </div>

            <!-- 첨부파일 -->
            <div th:if="${sermon.attachments != null && !sermon.attachments.empty}"
                 class="mt-20 pt-12 border-t border-slate-200">
                <h3 class="text-sm tracking-[0.2em] text-slate-400 uppercase mb-6">Attachments</h3>
                <div class="space-y-3">
                    <a th:each="attachment : ${sermon.attachments}"
                       th:href="@{/api/attachments/download/{id}(id=${attachment.id})}"
                       class="flex items-center gap-4 p-5 bg-slate-50 hover:bg-slate-100 transition-all duration-300 group">
                        <div class="w-12 h-12 flex items-center justify-center bg-white group-hover:bg-slate-900 transition-all duration-300">
                            <svg class="w-6 h-6 text-slate-400 group-hover:text-white transition-colors duration-300" 
                                 fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                      d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="font-light text-slate-900 truncate"
                               th:text="${attachment.originalFilename}">
                                파일명.pdf
                            </p>
                            <p class="text-sm text-slate-500 font-light"
                               th:text="${#numbers.formatDecimal(attachment.fileSize / 1024.0, 1, 2)} + ' KB'">
                                1.5 KB
                            </p>
                        </div>
                        <svg class="w-5 h-5 text-slate-400 group-hover:text-slate-900 transition-all duration-300 group-hover:translate-x-1" 
                             fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                    </a>
                </div>
            </div>
        </article>
    </section>

    <!-- Navigation -->
    <section class="py-12 bg-slate-50 px-6">
        <div class="max-w-5xl mx-auto flex flex-wrap gap-4">
            <a href="/worship/sermon"
               class="group inline-flex items-center px-8 py-4 border-2 border-slate-900 text-slate-900 hover:bg-slate-900 hover:text-white transition-all duration-300 font-light tracking-wide">
                <svg class="w-5 h-5 mr-2 transition-transform duration-300 group-hover:-translate-x-1" 
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                목록으로 돌아가기
            </a>
            <a href="/worship/sermon/latest"
               class="group inline-flex items-center px-8 py-4 bg-slate-900 text-white hover:bg-slate-800 transition-all duration-300 font-light tracking-wide">
                최신 설교
                <svg class="w-5 h-5 ml-2 transition-transform duration-300 group-hover:translate-x-1" 
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </a>
        </div>
    </section>
</main>

<style>
    /* 비디오 반응형 */
    .video-container {
        position: relative;
        padding-bottom: 56.25%; /* 16:9 비율 */
        height: 0;
        overflow: hidden;
    }

    .video-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }

    /* 오디오 플레이어 커스텀 */
    .audio-player {
        border-radius: 0;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
    }
    
    .audio-player::-webkit-media-controls-panel {
        background-color: #f8fafc;
    }

    /* 본문 컨텐츠 스타일링 */
    .prose h1, .prose h2, .prose h3, .prose h4 {
        @apply font-light text-slate-900 tracking-tight;
    }
    
    .prose h1 {
        @apply text-3xl md:text-4xl mt-12 mb-6;
    }
    
    .prose h2 {
        @apply text-2xl md:text-3xl mt-10 mb-5;
    }
    
    .prose h3 {
        @apply text-xl md:text-2xl mt-8 mb-4;
    }
    
    .prose p {
        @apply mb-6 leading-[1.9];
    }
    
    .prose a {
        @apply text-slate-900 underline underline-offset-4 hover:text-slate-600 transition-colors;
    }
    
    .prose ul, .prose ol {
        @apply my-6 space-y-2;
    }
    
    .prose li {
        @apply leading-[1.9];
    }
    
    .prose blockquote {
        @apply border-l-2 border-slate-900 pl-6 italic my-8 text-slate-600;
    }
    
    .prose img {
        @apply my-8 rounded-sm;
    }
    
    .prose strong {
        @apply font-medium text-slate-900;
    }
    
    .prose code {
        @apply bg-slate-100 px-2 py-1 rounded text-sm font-mono;
    }
    
    .prose pre {
        @apply bg-slate-900 text-slate-100 p-6 rounded-sm my-8 overflow-x-auto;
    }
    
    .prose pre code {
        @apply bg-transparent p-0;
    }
    
    .prose hr {
        @apply my-12 border-slate-200;
    }
    
    .prose table {
        @apply w-full my-8 border-collapse;
    }
    
    .prose th {
        @apply bg-slate-50 border border-slate-200 px-4 py-3 text-left font-medium;
    }
    
    .prose td {
        @apply border border-slate-200 px-4 py-3;
    }
</style>

<!-- 수정 모달 및 삭제 확인 모달 -->
<div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-6" style="overflow-y: auto;">
    <div class="bg-white rounded-lg max-w-3xl w-full my-8">
        <div class="p-6 border-b">
            <h2 class="text-2xl font-light">설교 수정</h2>
        </div>

        <form id="editForm" class="p-6 space-y-6">
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">설교 제목</label>
                    <input type="text" id="editTitle" required th:value="${sermon.title}"
                           class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">성경 구절</label>
                    <input type="text" id="editBibleVerse" required th:value="${sermon.bibleVerse}"
                           class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">설교자</label>
                    <input type="text" id="editPreacher" required th:value="${sermon.preacher}"
                           class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">설교 날짜</label>
                    <input type="date" id="editDate" required th:value="${sermon.sermonDate}"
                           class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">요약 (선택)</label>
                <textarea id="editSummary" rows="3" th:text="${sermon.summary}"
                          class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none resize-none"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">설교 내용</label>
                <textarea id="editContent" required rows="12" th:text="${sermon.content}"
                          class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none resize-none"></textarea>
            </div>

            <div id="editErrorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded"></div>
        </form>

        <div class="p-6 border-t flex gap-3">
            <button type="button" onclick="saveEdit()"
                    class="flex-1 py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium rounded">
                저장
            </button>
            <button type="button" onclick="closeEditModal()"
                    class="px-6 py-3 border-2 border-slate-300 hover:border-slate-900 transition font-medium rounded">
                취소
            </button>
        </div>
    </div>
</div>

<div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-6">
    <div class="bg-white rounded-lg max-w-md w-full">
        <div class="p-6 border-b">
            <h2 class="text-2xl font-light text-red-600">설교 삭제</h2>
        </div>

        <div class="p-6">
            <p class="text-slate-700 mb-2">이 설교를 삭제하시겠습니까?</p>
            <p class="font-medium text-slate-900" th:text="${sermon.title}"></p>
        </div>

        <div class="p-6 border-t flex gap-3">
            <button type="button" onclick="deleteSermon()"
                    class="flex-1 py-3 bg-red-600 text-white hover:bg-red-700 transition font-medium rounded">
                삭제
            </button>
            <button type="button" onclick="closeDeleteModal()"
                    class="px-6 py-3 border-2 border-slate-300 hover:border-slate-900 transition font-medium rounded">
                취소
            </button>
        </div>
    </div>
</div>

<th:block layout:fragment="extra-scripts">
    <script th:inline="javascript">
        const sermonId = /*[[${sermon.id}]]*/ null;

        function openEditModal() {
            document.getElementById('editErrorMessage').classList.add('hidden');
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveEdit() {
            const title = document.getElementById('editTitle').value;
            const bibleVerse = document.getElementById('editBibleVerse').value;
            const preacher = document.getElementById('editPreacher').value;
            const sermonDate = document.getElementById('editDate').value;
            const summary = document.getElementById('editSummary').value;
            const content = document.getElementById('editContent').value;
            const errorDiv = document.getElementById('editErrorMessage');

            if (!title.trim() || !bibleVerse.trim() || !preacher.trim() || !sermonDate || !content.trim()) {
                errorDiv.textContent = '필수 항목을 모두 입력해주세요.';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/api/sermons/${sermonId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        title,
                        bibleVerse,
                        preacher,
                        sermonDate,
                        summary: summary || null,
                        content
                    })
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    const error = await response.json();
                    errorDiv.textContent = error.message || '저장 중 오류가 발생했습니다.';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Save error:', error);
                errorDiv.textContent = '저장 중 오류가 발생했습니다.';
                errorDiv.classList.remove('hidden');
            }
        }

        function confirmDelete() {
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        async function deleteSermon() {
            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/api/sermons/${sermonId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    window.location.href = '/worship/sermon';
                } else {
                    alert('삭제 중 오류가 발생했습니다.');
                }
            } catch (error) {
                console.error('Delete error:', error);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeEditModal();
                closeDeleteModal();
            }
        });
    </script>
</th:block>

</body>
</html>
