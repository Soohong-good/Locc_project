<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title>마이페이지 - 그리스도 사랑교회</title>
</head>

<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-16 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white px-6">
        <div class="max-w-6xl mx-auto">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-3xl md:text-4xl font-light tracking-tight" th:text="'안녕하세요, ' + ${user.name} + '님'">안녕하세요, 홍길동님</h1>
                    <p class="text-slate-300 mt-2">회원님의 정보를 관리할 수 있습니다</p>
                </div>
            </div>

            <!-- 승인 상태 배지 -->
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full"
                 th:classappend="${user.approvalStatus == '승인 완료'} ? 'bg-green-500/20 text-green-300' : 
                                 (${user.approvalStatus == '승인 대기'} ? 'bg-yellow-500/20 text-yellow-300' : 'bg-red-500/20 text-red-300')">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                          d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                          clip-rule="evenodd"></path>
                </svg>
                <span class="text-sm font-medium" th:text="${user.approvalStatus}">승인 완료</span>
            </div>
        </div>
    </section>

    <!-- 탭 네비게이션 -->
    <section class="bg-white border-b border-slate-200 px-6 sticky top-[100px] z-40">
        <div class="max-w-6xl mx-auto">
            <nav class="flex gap-1">
                <button onclick="switchTab('info')"
                        class="tab-btn px-6 py-4 font-medium transition-colors border-b-2"
                        id="tab-info">
                    내 정보
                </button>
                <button onclick="switchTab('edit')"
                        class="tab-btn px-6 py-4 font-medium transition-colors border-b-2"
                        id="tab-edit">
                    정보 수정
                </button>
                <button onclick="switchTab('password')"
                        class="tab-btn px-6 py-4 font-medium transition-colors border-b-2"
                        id="tab-password"
                        th:if="${!user.isOAuthUser}">
                    비밀번호 변경
                </button>
            </nav>
        </div>
    </section>

    <!-- 탭 컨텐츠 -->
    <section class="py-16 bg-slate-50 px-6 min-h-screen">
        <div class="max-w-4xl mx-auto">

            <!-- 내 정보 탭 -->
            <div id="content-info" class="tab-content">
                <div class="bg-white rounded-lg shadow-sm p-8">
                    <h2 class="text-2xl font-medium text-slate-900 mb-6">내 정보</h2>

                    <div class="space-y-4">
                        <div class="grid grid-cols-3 gap-4 py-4 border-b border-slate-100">
                            <dt class="text-sm font-medium text-slate-500">이메일</dt>
                            <dd class="col-span-2 text-sm text-slate-900" th:text="${user.email}">user@example.com</dd>
                        </div>

                        <div class="grid grid-cols-3 gap-4 py-4 border-b border-slate-100">
                            <dt class="text-sm font-medium text-slate-500">이름</dt>
                            <dd class="col-span-2 text-sm text-slate-900" th:text="${user.name}">홍길동</dd>
                        </div>

                        <div class="grid grid-cols-3 gap-4 py-4 border-b border-slate-100">
                            <dt class="text-sm font-medium text-slate-500">성별</dt>
                            <dd class="col-span-2 text-sm text-slate-900" th:text="${user.gender != null ? user.gender : '미입력'}">남</dd>
                        </div>

                        <div class="grid grid-cols-3 gap-4 py-4 border-b border-slate-100">
                            <dt class="text-sm font-medium text-slate-500">전화번호</dt>
                            <dd class="col-span-2 text-sm text-slate-900" th:text="${user.phoneNumber != null ? user.phoneNumber : '미입력'}">010-1234-5678</dd>
                        </div>

                        <div class="grid grid-cols-3 gap-4 py-4 border-b border-slate-100">
                            <dt class="text-sm font-medium text-slate-500">생년월일</dt>
                            <dd class="col-span-2 text-sm text-slate-900" th:text="${user.birth != null ? user.birth : '미입력'}">1990-01-01</dd>
                        </div>

                        <div class="grid grid-cols-3 gap-4 py-4 border-b border-slate-100">
                            <dt class="text-sm font-medium text-slate-500">주소</dt>
                            <dd class="col-span-2 text-sm text-slate-900" th:text="${user.address != null ? user.address : '미입력'}">서울시 강남구</dd>
                        </div>

                        <div class="grid grid-cols-3 gap-4 py-4 border-b border-slate-100">
                            <dt class="text-sm font-medium text-slate-500">교인 구분</dt>
                            <dd class="col-span-2 text-sm text-slate-900" th:text="${user.userType}">등록교인</dd>
                        </div>

                        <div class="grid grid-cols-3 gap-4 py-4 border-b border-slate-100">
                            <dt class="text-sm font-medium text-slate-500">가입일</dt>
                            <dd class="col-span-2 text-sm text-slate-900" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</dd>
                        </div>

                        <div class="grid grid-cols-3 gap-4 py-4" th:if="${user.registrationPath != null}">
                            <dt class="text-sm font-medium text-slate-500">가입 경로</dt>
                            <dd class="col-span-2 text-sm text-slate-900" th:text="${user.registrationPath}">친구 소개</dd>
                        </div>
                    </div>

                    <div class="mt-8 pt-6 border-t border-slate-200">
                        <button onclick="switchTab('edit')"
                                class="px-6 py-3 bg-slate-900 text-white rounded-lg hover:bg-slate-800 transition font-medium">
                            정보 수정하기
                        </button>
                    </div>
                </div>
            </div>

            <!-- 정보 수정 탭 -->
            <div id="content-edit" class="tab-content hidden">
                <div class="bg-white rounded-lg shadow-sm p-8">
                    <h2 class="text-2xl font-medium text-slate-900 mb-6">정보 수정</h2>

                    <form id="profileForm" class="space-y-6">
                        <!-- 이메일 (변경 불가) -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">이메일 (변경 불가)</label>
                            <input type="email" th:value="${user.email}" disabled
                                   class="w-full px-4 py-3 border border-slate-300 rounded-lg bg-slate-50 text-slate-500">
                        </div>

                        <!-- 이름 -->
                        <div>
                            <label for="name" class="block text-sm font-medium text-slate-700 mb-2">이름 *</label>
                            <input type="text" id="name" name="name" th:value="${user.name}" required
                                   class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <p id="name-feedback" class="mt-1 text-xs text-red-600 hidden"></p>
                        </div>

                        <!-- 성별 -->
                        <div>
                            <label for="gender" class="block text-sm font-medium text-slate-700 mb-2">성별</label>
                            <select id="gender" name="gender"
                                    class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">선택하세요</option>
                                <option value="남" th:selected="${user.gender == '남'}">남</option>
                                <option value="여" th:selected="${user.gender == '여'}">여</option>
                            </select>
                        </div>

                        <!-- 전화번호 -->
                        <div>
                            <label for="phoneNumber" class="block text-sm font-medium text-slate-700 mb-2">전화번호</label>
                            <input type="tel" id="phoneNumber" name="phoneNumber" th:value="${user.phoneNumber}"
                                   placeholder="010-1234-5678"
                                   class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>

                        <!-- 생년월일 -->
                        <div>
                            <label for="birth" class="block text-sm font-medium text-slate-700 mb-2">생년월일</label>
                            <input type="date" id="birth" name="birth" th:value="${user.birth}"
                                   class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>

                        <!-- 주소 -->
                        <div>
                            <label for="address" class="block text-sm font-medium text-slate-700 mb-2">주소</label>
                            <input type="text" id="address" name="address" th:value="${user.address}"
                                   placeholder="주소를 입력하세요"
                                   class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>

                        <!-- 버튼 -->
                        <div class="flex gap-3 pt-6">
                            <button type="submit"
                                    class="flex-1 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">
                                저장하기
                            </button>
                            <button type="button" onclick="switchTab('info')"
                                    class="px-6 py-3 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition font-medium">
                                취소
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 비밀번호 변경 탭 -->
            <div id="content-password" class="tab-content hidden" th:if="${!user.isOAuthUser}">
                <div class="bg-white rounded-lg shadow-sm p-8">
                    <h2 class="text-2xl font-medium text-slate-900 mb-6">비밀번호 변경</h2>

                    <form id="passwordForm" class="space-y-6">
                        <!-- 현재 비밀번호 -->
                        <div>
                            <label for="currentPassword" class="block text-sm font-medium text-slate-700 mb-2">현재 비밀번호 *</label>
                            <input type="password" id="currentPassword" name="currentPassword" required
                                   class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <p id="currentPassword-feedback" class="mt-1 text-xs text-red-600 hidden"></p>
                        </div>

                        <!-- 새 비밀번호 -->
                        <div>
                            <label for="newPassword" class="block text-sm font-medium text-slate-700 mb-2">새 비밀번호 *</label>
                            <input type="password" id="newPassword" name="newPassword" required
                                   class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <p class="mt-1 text-xs text-slate-500">8자 이상의 영문, 숫자, 특수문자를 포함해야 합니다</p>
                            <p id="newPassword-feedback" class="mt-1 text-xs text-red-600 hidden"></p>
                        </div>

                        <!-- 새 비밀번호 확인 -->
                        <div>
                            <label for="newPasswordConfirm" class="block text-sm font-medium text-slate-700 mb-2">새 비밀번호 확인 *</label>
                            <input type="password" id="newPasswordConfirm" name="newPasswordConfirm" required
                                   class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <p id="newPasswordConfirm-feedback" class="mt-1 text-xs text-red-600 hidden"></p>
                        </div>

                        <!-- 버튼 -->
                        <div class="flex gap-3 pt-6">
                            <button type="submit"
                                    class="flex-1 px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">
                                비밀번호 변경
                            </button>
                            <button type="button" onclick="switchTab('info')"
                                    class="px-6 py-3 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition font-medium">
                                취소
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </section>
</main>

<th:block layout:fragment="extra-scripts">
    <script th:src="@{/js/mypage/mypage.js}"></script>
</th:block>

</body>
</html>
