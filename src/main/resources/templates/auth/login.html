<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>로그인 - 그리스도 사랑교회</title>
</head>
<body>

<main layout:fragment="content">
    <section class="min-h-screen flex items-center justify-center bg-slate-50 px-6 py-32">
        <div class="max-w-md w-full">
            <div class="text-center mb-10">
                <h1 class="text-4xl md:text-5xl font-light text-slate-900 mb-4">로그인</h1>
                <p class="text-slate-600 font-light">그리스도 사랑교회에 오신 것을 환영합니다</p>
            </div>

            <div class="bg-white p-8 md:p-10 shadow-sm">
                <form id="loginForm" class="space-y-6">
                    <!-- 에러 메시지 -->
                    <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded">
                    </div>

                    <!-- 이메일 -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 mb-2">
                            이메일
                        </label>
                        <input type="email" id="email" name="email" required
                               class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition">
                    </div>

                    <!-- 비밀번호 -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-700 mb-2">
                            비밀번호
                        </label>
                        <input type="password" id="password" name="password" required
                               class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition">
                    </div>

                    <!-- 로그인 버튼 -->
                    <button type="submit"
                            class="w-full py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium">
                        로그인
                    </button>
                </form>

                <!-- 추가 링크 -->
                <div class="mt-6 text-center space-y-3">
                    <p class="text-sm text-slate-600">
                        <a href="/auth/forgot-password" class="text-slate-900 font-medium hover:underline">비밀번호를 잊으셨나요?</a>
                    </p>
                    <p class="text-sm text-slate-600">
                        계정이 없으신가요?
                        <a href="/auth/register" class="text-slate-900 font-medium hover:underline">회원가입</a>
                    </p>
                </div>

                <!-- 구분선 -->
                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-slate-500">또는</span>
                    </div>
                </div>

                <!-- 소셜 로그인 버튼 -->
                <div class="space-y-3">
                    <!-- 카카오 로그인 -->
                    <a href="/oauth2/authorization/kakao"
                       class="flex items-center justify-center w-full py-3 px-4 border border-slate-300 hover:border-slate-400 transition font-medium"
                       style="background-color: #FEE500; color: #000000;">
                        <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 3C6.48 3 2 6.58 2 11c0 2.78 1.83 5.23 4.58 6.81-.2.73-.75 2.81-.86 3.26-.14.57.21.56.44.41.18-.13 2.96-2.02 3.43-2.34.47.07.95.11 1.44.11 5.52 0 10-3.58 10-8S17.52 3 12 3z"/>
                        </svg>
                        카카오 로그인 / 회원가입
                    </a>

                    <!-- 네이버 로그인 -->
                    <a href="/oauth2/authorization/naver"
                       class="flex items-center justify-center w-full py-3 px-4 border border-slate-300 hover:border-slate-400 transition font-medium"
                       style="background-color: #03C75A; color: #FFFFFF;">
                        <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16.273 12.845L7.376 0H0v24h7.726V11.156L16.624 24H24V0h-7.727v12.845z"/>
                        </svg>
                        네이버 로그인 / 회원가입
                    </a>
                </div>
            </div>

            <div class="text-center mt-8">
                <a href="/" class="text-sm text-slate-600 hover:text-slate-900">
                    ← 홈으로 돌아가기
                </a>
            </div>
        </div>
    </section>
</main>

<th:block layout:fragment="extra-scripts">
    <script th:inline="javascript">
        // URL 파라미터에서 메시지 확인
        const urlParams = new URLSearchParams(window.location.search);
        const authError = urlParams.get('error');
        const message = urlParams.get('message');
        const returnUrl = urlParams.get('returnUrl');

        // 인증 필요 메시지가 있으면 alert 표시
        if (authError === 'auth_required' && message) {
            alert(decodeURIComponent(message));
            // URL에서 파라미터 제거
            window.history.replaceState({}, document.title, '/auth/login');
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();

                    // JWT 토큰 저장 (localStorage + 쿠키)
                    localStorage.setItem('accessToken', data.accessToken);
                    localStorage.setItem('refreshToken', data.refreshToken);

                    // 쿠키에도 저장 (관리자 페이지 접근용)
                    document.cookie = `accessToken=${data.accessToken}; path=/; max-age=86400; SameSite=Lax`;
                    document.cookie = `refreshToken=${data.refreshToken}; path=/; max-age=604800; SameSite=Lax`;

                    // returnUrl이 있으면 해당 페이지로, 없으면 홈으로 리다이렉트
                    const redirectUrl = /*[[${param.returnUrl}]]*/ null;
                    window.location.href = redirectUrl ? decodeURIComponent(redirectUrl) : '/';
                } else {
                    const error = await response.json();
                    let errorMessage = '';
                    let messageType = 'error'; // 'error', 'info'

                    // 에러 타입에 따라 상세한 메시지 표시
                    switch(error.error) {
                        case 'ACCOUNT_NOT_APPROVED':
                            messageType = 'info'; // 승인 대기는 파란색 정보 메시지
                            if (error.approvalStatus === 'PENDING') {
                                errorMessage = error.message + '\n\n관리자 승인 처리는 영업일 기준 1-2일 정도 소요됩니다.';
                            } else if (error.approvalStatus === 'REJECTED') {
                                errorMessage = error.message + '\n\n문의사항은 교회로 연락해주세요.';
                                messageType = 'error'; // 반려는 빨간색
                            } else {
                                errorMessage = error.message;
                            }
                            break;
                        case 'ACCOUNT_DELETED':
                            errorMessage = error.message;
                            break;
                        case 'INVALID_CREDENTIALS':
                            errorMessage = error.message + '\n\n이메일과 비밀번호를 다시 확인해주세요.';
                            break;
                        case 'USER_NOT_FOUND':
                            errorMessage = error.message;
                            break;
                        case 'ACCOUNT_DISABLED':
                            errorMessage = error.message;
                            break;
                        default:
                            errorMessage = error.message || '로그인에 실패했습니다.';
                    }

                    errorDiv.innerHTML = errorMessage.replace(/\n/g, '<br>');

                    // 메시지 타입에 따라 스타일 변경
                    if (messageType === 'info') {
                        errorDiv.className = 'bg-blue-50 border border-blue-200 text-blue-700 px-4 py-3 rounded';
                    } else {
                        errorDiv.className = 'bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded';
                    }

                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = '로그인 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</th:block>

</body>
</html>
