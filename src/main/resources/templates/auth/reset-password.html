<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>비밀번호 재설정 - 그리스도 사랑교회</title>
</head>

<body>

<main layout:fragment="content">
    <section class="min-h-screen flex items-center justify-center bg-slate-50 px-6 py-32">
        <div class="max-w-md w-full">
            <div class="text-center mb-10">
                <h1 class="text-4xl md:text-5xl font-light text-slate-900 mb-4">비밀번호 재설정</h1>
                <p class="text-slate-600 font-light">새로운 비밀번호를 입력해주세요</p>
            </div>

            <div class="bg-white p-8 md:p-10 shadow-sm">
                <form id="resetPasswordForm" class="space-y-6">
                    <input type="hidden" id="token" th:value="${token}">
                    
                    <!-- 에러 메시지 -->
                    <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded text-sm"></div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">
                            새 비밀번호 <span class="text-red-500">*</span>
                        </label>
                        <input type="password" 
                               id="newPassword" 
                               name="newPassword" 
                               required 
                               minlength="8"
                               placeholder="8자 이상 영문, 숫자, 특수문자 사용"
                               class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition">
                        <p class="mt-1 text-xs text-slate-500">
                            8자 이상의 영문, 숫자, 특수문자를 사용해 주세요.
                        </p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">
                            비밀번호 확인 <span class="text-red-500">*</span>
                        </label>
                        <input type="password"
                               id="confirmPassword"
                               name="confirmPassword"
                               required
                               minlength="8"
                               placeholder="비밀번호를 다시 입력해주세요"
                               class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition">
                    </div>

                    <button type="submit"
                            id="submitBtn"
                            class="w-full py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium">
                        비밀번호 변경
                    </button>
                </form>
            </div>
        </div>
    </section>
</main>

<th:block layout:fragment="extra-scripts">
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('resetPasswordForm');
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            const token = document.getElementById('token').value;

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                // 비밀번호 일치 확인
                if (newPassword !== confirmPassword) {
                    showError('비밀번호가 일치하지 않습니다.');
                    return;
                }

                // 비밀번호 강도 검사
                const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
                if (!passwordRegex.test(newPassword)) {
                    showError('8자 이상의 영문, 숫자, 특수문자를 포함해야 합니다.');
                    return;
                }

                // 버튼 비활성화
                submitBtn.disabled = true;
                submitBtn.textContent = '변경 중...';

                try {
                    const response = await fetch('/api/auth/password/reset', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            token: token,
                            newPassword: newPassword
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        // 성공 - 로그인 페이지로 리다이렉트
                        alert('비밀번호가 성공적으로 변경되었습니다. 새 비밀번호로 로그인해주세요.');
                        window.location.href = '/auth/login';
                    } else {
                        showError(data.message);
                        submitBtn.disabled = false;
                        submitBtn.textContent = '비밀번호 변경';
                    }

                } catch (error) {
                    console.error('비밀번호 재설정 실패:', error);
                    showError('요청 처리 중 오류가 발생했습니다.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '비밀번호 변경';
                }
            });

            function showError(message) {
                errorDiv.textContent = message;
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</th:block>

</body>
</html>
