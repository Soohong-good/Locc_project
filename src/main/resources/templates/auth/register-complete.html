<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>회원가입 완료 - 그리스도 사랑교회</title>
</head>
<body>

<main layout:fragment="content">
    <section class="min-h-screen flex items-center justify-center bg-slate-50 px-6 py-32">
        <div class="max-w-2xl w-full">
            <div class="bg-white p-10 md:p-16 shadow-sm text-center">
                <!-- 성공 아이콘 -->
                <div class="mb-8">
                    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto">
                        <svg class="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                </div>

                <!-- 제목 -->
                <h1 class="text-3xl md:text-4xl font-light text-slate-900 mb-6">
                    회원가입 신청이<br>완료되었습니다
                </h1>

                <!-- 설명 -->
                <div class="space-y-6 mb-10 text-slate-600 leading-relaxed">
                    <p class="text-lg">
                        회원가입 신청이 정상적으로 접수되었습니다.
                    </p>
                    
                    <div class="bg-blue-50 border-l-4 border-blue-500 p-6 text-left">
                        <h3 class="font-medium text-blue-900 mb-3 flex items-center gap-2">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                            </svg>
                            안내사항
                        </h3>
                        <ul class="space-y-2 text-sm text-blue-900">
                            <li class="flex items-start gap-2">
                                <svg class="w-5 h-5 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                                </svg>
                                <span>관리자가 회원정보를 검토한 후 승인합니다.</span>
                            </li>
                            <li class="flex items-start gap-2">
                                <svg class="w-5 h-5 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                                </svg>
                                <span>승인 완료 후 로그인이 가능합니다.</span>
                            </li>
                            <li class="flex items-start gap-2">
                                <svg class="w-5 h-5 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                                </svg>
                                <span>승인 처리는 영업일 기준 1-2일 정도 소요됩니다.</span>
                            </li>
                            <li class="flex items-start gap-2">
                                <svg class="w-5 h-5 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                                </svg>
                                <span>문의사항은 교회 연락처로 문의해주세요.</span>
                            </li>
                        </ul>
                    </div>

                    <p class="text-sm text-slate-500">
                        신청하신 이메일: <strong th:text="${email}" class="text-slate-900">example@email.com</strong>
                    </p>
                </div>

                <!-- 버튼 -->
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <a href="/" 
                       class="inline-flex items-center justify-center px-8 py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium">
                        홈으로
                    </a>
                    <a href="/church/contact" 
                       class="inline-flex items-center justify-center px-8 py-3 border-2 border-slate-300 text-slate-700 hover:border-slate-900 transition font-medium">
                        교회 연락처
                    </a>
                </div>
            </div>

            <div class="text-center mt-8">
                <p class="text-sm text-slate-500">
                    이미 계정이 있으신가요? 
                    <a href="/auth/login" class="text-slate-900 hover:underline font-medium">로그인</a>
                </p>
            </div>
        </div>
    </section>
</main>

</body>
</html>
