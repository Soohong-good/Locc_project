<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>링크 오류 - 그리스도 사랑교회</title>
</head>

<body>

<main layout:fragment="content">
    <section class="min-h-screen flex items-center justify-center bg-slate-50 px-6 py-32">
        <div class="max-w-md w-full">
            <div class="bg-white p-8 md:p-10 shadow-sm text-center">
                <div class="mb-6">
                    <svg class="w-16 h-16 mx-auto text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                </div>

                <h1 class="text-2xl font-light text-slate-900 mb-4">링크가 만료되었습니다</h1>
                
                <p class="text-slate-600 mb-8" th:text="${error}">
                    유효하지 않거나 만료된 링크입니다.
                </p>

                <div class="space-y-3">
                    <a href="/auth/forgot-password" 
                       class="block w-full py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium rounded">
                        비밀번호 찾기 다시 시도
                    </a>
                    
                    <a href="/auth/login" 
                       class="block w-full py-3 border-2 border-slate-300 text-slate-700 hover:border-slate-900 transition font-medium rounded">
                        로그인으로 돌아가기
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>

</body>
</html>
