<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>비밀번호 찾기 - 그리스도 사랑교회</title>
</head>

<body>

<main layout:fragment="content">
    <section class="min-h-screen flex items-center justify-center bg-slate-50 px-6 py-32">
        <div class="max-w-md w-full">
            <div class="text-center mb-10">
                <h1 class="text-4xl md:text-5xl font-light text-slate-900 mb-4">비밀번호 찾기</h1>
                <p class="text-slate-600 font-light">가입하신 이메일 주소를 입력해주세요</p>
            </div>

            <div class="bg-white p-8 md:p-10 shadow-sm">
                <form id="forgotPasswordForm" class="space-y-6">
                    <!-- 에러 메시지 -->
                    <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded text-sm"></div>
                    
                    <!-- 성공 메시지 -->
                    <div id="successMessage" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded text-sm"></div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">
                            이메일 <span class="text-red-500">*</span>
                        </label>
                        <input type="email" 
                               id="email" 
                               name="email" 
                               required 
                               placeholder="example@email.com"
                               class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition">
                        <p class="mt-2 text-xs text-slate-500">
                            가입 시 사용하신 이메일 주소를 입력하시면<br>
                            비밀번호 재설정 링크를 보내드립니다.
                        </p>
                    </div>

                    <button type="submit" 
                            id="submitBtn"
                            class="w-full py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium">
                        재설정 링크 발송
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <a href="/auth/login" class="text-sm text-slate-600 hover:text-slate-900">
                        ← 로그인으로 돌아가기
                    </a>
                </div>
            </div>
        </div>
    </section>
</main>

<th:block layout:fragment="extra-scripts">
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('forgotPasswordForm');
            const submitBtn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();

                if (!email) {
                    showError('이메일을 입력해주세요.');
                    return;
                }

                // 버튼 비활성화
                submitBtn.disabled = true;
                submitBtn.textContent = '발송 중...';

                try {
                    const response = await fetch('/api/auth/password/reset-request', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email })
                    });

                    const data = await response.json();

                    if (data.success) {
                        showSuccess(data.message);
                        form.reset();
                    } else {
                        showError(data.message);
                    }

                } catch (error) {
                    console.error('비밀번호 재설정 요청 실패:', error);
                    showError('요청 처리 중 오류가 발생했습니다.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '재설정 링크 발송';
                }
            });

            function showError(message) {
                errorDiv.textContent = message;
                errorDiv.classList.remove('hidden');
                successDiv.classList.add('hidden');
            }

            function showSuccess(message) {
                successDiv.textContent = message;
                successDiv.classList.remove('hidden');
                errorDiv.classList.add('hidden');
            }
        });
    </script>
</th:block>

</body>
</html>
