<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>도움요청 관리 - LOCC</title>
</head>

<body>

<main layout:fragment="content">
    <section class="py-32 px-6">
        <div class="max-w-7xl mx-auto">
            <!-- 헤더 -->
            <div class="mb-10">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h1 class="text-4xl md:text-5xl font-light text-slate-900 mb-2">도움요청 관리</h1>
                        <p class="text-slate-600 font-light">복음말씀 페이지에서 접수된 도움요청을 관리합니다</p>
                    </div>
                    <a href="/admin" class="px-6 py-3 border-2 border-slate-300 text-slate-700 rounded hover:border-slate-900 transition font-medium">
                        대시보드로
                    </a>
                </div>

                <!-- 통계 카드 -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white border border-slate-200 rounded-lg p-6">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-slate-600 text-sm font-medium">전체</span>
                            <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                        </div>
                        <div class="text-3xl font-bold text-slate-900" th:text="${totalCount}">0</div>
                    </div>

                    <div class="bg-red-50 border border-red-200 rounded-lg p-6">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-red-700 text-sm font-medium">미처리</span>
                            <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <div class="text-3xl font-bold text-red-700" th:text="${pendingCount}">0</div>
                    </div>

                    <div class="bg-blue-50 border border-blue-200 rounded-lg p-6">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-blue-700 text-sm font-medium">처리중</span>
                            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <div class="text-3xl font-bold text-blue-700" th:text="${inProgressCount}">0</div>
                    </div>
                </div>
            </div>

            <!-- 필터 -->
            <div class="mb-6 flex gap-4">
                <button onclick="filterByStatus(null)" 
                        id="filter-all"
                        class="filter-btn px-4 py-2 rounded transition bg-slate-900 text-white">
                    전체
                </button>
                <button onclick="filterByStatus('PENDING')" 
                        id="filter-pending"
                        class="filter-btn px-4 py-2 rounded transition bg-slate-100 text-slate-700 hover:bg-slate-200">
                    미처리
                </button>
                <button onclick="filterByStatus('IN_PROGRESS')" 
                        id="filter-in-progress"
                        class="filter-btn px-4 py-2 rounded transition bg-slate-100 text-slate-700 hover:bg-slate-200">
                    처리중
                </button>
                <button onclick="filterByStatus('COMPLETED')" 
                        id="filter-completed"
                        class="filter-btn px-4 py-2 rounded transition bg-slate-100 text-slate-700 hover:bg-slate-200">
                    완료
                </button>
            </div>

            <!-- 도움요청 목록 -->
            <div class="bg-white shadow-sm rounded-lg overflow-hidden">
                <div id="requestList" class="divide-y">
                    <!-- 초기 로딩 -->
                    <div class="p-8 text-center text-slate-500">
                        로딩 중...
                    </div>
                </div>

                <!-- 페이징 -->
                <div class="p-4 border-t flex justify-center gap-2">
                    <button id="prevBtn" onclick="loadPage(currentPage - 1)"
                            class="px-4 py-2 border rounded hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed"
                            disabled>
                        이전
                    </button>
                    <span id="pageInfo" class="px-4 py-2 text-sm text-slate-600">1 / 1</span>
                    <button id="nextBtn" onclick="loadPage(currentPage + 1)"
                            class="px-4 py-2 border rounded hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed"
                            disabled>
                        다음
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 상세 모달 -->
    <div id="detailModal" class="hidden fixed inset-0 z-50 overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="fixed inset-0 bg-black bg-opacity-50 transition-opacity" onclick="closeDetailModal()"></div>
            
            <div class="bg-white rounded-lg max-w-2xl w-full p-6 relative z-10">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-2xl font-light text-slate-900">도움요청 상세</h2>
                    <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>

                <div id="modalContent" class="space-y-4">
                    <!-- JavaScript로 채워짐 -->
                </div>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="extra-scripts">
    <script src="/js/admin/help-request-list.js"></script>
</th:block>

</body>
</html>
