<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>승인 대기 회원 - 관리자</title>
</head>

<body>

<main layout:fragment="content">
    <section class="py-32 px-6">
        <div class="max-w-7xl mx-auto">
            <!-- 헤더 -->
            <div class="mb-10">
                <h1 class="text-4xl md:text-5xl font-light text-slate-900 mb-4">승인 대기 회원</h1>
                <p class="text-slate-600 font-light">가입 신청한 회원을 검토하고 승인/반려 처리합니다</p>
            </div>

            <!-- 메시지 -->
            <div th:if="${message}" 
                 th:classappend="${messageType == 'success'} ? 'bg-green-50 border-green-200 text-green-700' : 'bg-red-50 border-red-200 text-red-700'"
                 class="mb-6 px-4 py-3 rounded border">
                <p th:text="${message}"></p>
            </div>

            <!-- 회원 목록 -->
            <div class="bg-white shadow-sm overflow-hidden">
                <div th:if="${users.isEmpty()}" class="p-12 text-center text-slate-500">
                    승인 대기 중인 회원이 없습니다.
                </div>

                <div th:unless="${users.isEmpty()}">
                    <table class="w-full">
                        <thead class="bg-slate-50 border-b">
                            <tr>
                                <th class="px-6 py-4 text-left text-sm font-medium text-slate-900">이름</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-slate-900">이메일</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-slate-900">교인 구분</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-slate-900">신청일</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-slate-900">관리</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y">
                            <tr th:each="user : ${users}" class="hover:bg-slate-50">
                                <td class="px-6 py-4 text-sm text-slate-900" th:text="${user.name}"></td>
                                <td class="px-6 py-4 text-sm text-slate-600" th:text="${user.email}"></td>
                                <td class="px-6 py-4 text-sm">
                                    <span th:if="${user.userType.name() == 'REGISTERED'}" 
                                          class="px-2 py-1 bg-blue-100 text-blue-800 rounded text-xs">등록교인</span>
                                    <span th:if="${user.userType.name() == 'UNREGISTERED'}" 
                                          class="px-2 py-1 bg-green-100 text-green-800 rounded text-xs">미등록교인</span>
                                </td>
                                <td class="px-6 py-4 text-sm text-slate-600" 
                                    th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                <td class="px-6 py-4 text-sm">
                                    <button type="button" 
                                            onclick="showUserDetail(this)"
                                            th:attr="data-user-id=${user.id},
                                                     data-user-name=${user.name},
                                                     data-user-email=${user.email},
                                                     data-user-type=${user.userType.name()},
                                                     data-user-gender=${user.gender},
                                                     data-user-phone=${user.phoneNumber},
                                                     data-user-address=${user.address},
                                                     data-user-birth=${user.birth},
                                                     data-user-path=${user.registrationPath}"
                                            class="text-blue-600 hover:text-blue-800 font-medium mr-3">
                                        상세보기
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- 페이징 -->
                    <div th:if="${users.totalPages > 1}" class="px-6 py-4 border-t">
                        <div class="flex items-center justify-center gap-2">
                            <a th:if="${users.hasPrevious()}" 
                               th:href="@{/admin/users/pending(page=${users.number - 1})}"
                               class="px-4 py-2 border hover:bg-slate-50">이전</a>
                            
                            <span class="px-4 py-2 text-sm text-slate-600">
                                <span th:text="${users.number + 1}"></span> / <span th:text="${users.totalPages}"></span>
                            </span>
                            
                            <a th:if="${users.hasNext()}" 
                               th:href="@{/admin/users/pending(page=${users.number + 1})}"
                               class="px-4 py-2 border hover:bg-slate-50">다음</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 상세보기 모달 -->
    <div id="detailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-6">
        <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b">
                <h2 class="text-2xl font-light">회원 상세 정보</h2>
            </div>
            
            <div class="p-6 space-y-4" id="modalContent">
                <!-- 내용이 JavaScript로 채워집니다 -->
            </div>
            
            <div class="p-6 border-t flex gap-3">
                <button type="button" onclick="approveUser()"
                        class="flex-1 py-3 bg-blue-600 text-white hover:bg-blue-700 transition font-medium rounded">
                    승인
                </button>
                
                <button type="button" onclick="showRejectModal()" 
                        class="flex-1 py-3 bg-red-600 text-white hover:bg-red-700 transition font-medium rounded">
                    반려
                </button>
                
                <button type="button" onclick="closeModal()" 
                        class="px-6 py-3 border-2 border-slate-300 hover:border-slate-900 transition font-medium rounded">
                    닫기
                </button>
            </div>
        </div>
    </div>

    <!-- 반려 모달 -->
    <div id="rejectModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-6">
        <div class="bg-white rounded-lg max-w-md w-full">
            <div class="p-6 border-b">
                <h2 class="text-2xl font-light">반려 사유 입력</h2>
            </div>
            
            <div class="p-6">
                <textarea id="rejectReason" required rows="4"
                          placeholder="반려 사유를 입력해주세요"
                          class="w-full px-4 py-3 border border-slate-300 focus:border-slate-900 focus:ring-1 focus:ring-slate-900 outline-none transition resize-none"></textarea>

                <div class="flex gap-3 mt-4">
                    <button type="button" onclick="rejectUser()"
                            class="flex-1 py-3 bg-red-600 text-white hover:bg-red-700 transition font-medium rounded">
                        반려 확인
                    </button>
                    <button type="button" onclick="closeRejectModal()"
                            class="px-6 py-3 border-2 border-slate-300 hover:border-slate-900 transition font-medium rounded">
                        취소
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="extra-scripts">
    <script>
        let currentUserId = null;

        function showUserDetail(button) {
            currentUserId = button.getAttribute('data-user-id');
            const name = button.getAttribute('data-user-name');
            const email = button.getAttribute('data-user-email');
            const type = button.getAttribute('data-user-type');
            const gender = button.getAttribute('data-user-gender');
            const phone = button.getAttribute('data-user-phone');
            const address = button.getAttribute('data-user-address') || '-';
            const birth = button.getAttribute('data-user-birth') || '-';
            const path = button.getAttribute('data-user-path') || '-';

            const typeText = type === 'REGISTERED' ? '등록교인' : '미등록교인';
            const genderText = gender === 'MALE' ? '남성' : '여성';

            const content = `
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-sm text-slate-500 mb-1">이름</p>
                        <p class="text-slate-900 font-medium">${name}</p>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 mb-1">이메일</p>
                        <p class="text-slate-900">${email}</p>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 mb-1">교인 구분</p>
                        <p class="text-slate-900">${typeText}</p>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 mb-1">성별</p>
                        <p class="text-slate-900">${genderText}</p>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 mb-1">전화번호</p>
                        <p class="text-slate-900">${phone}</p>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 mb-1">생년월일</p>
                        <p class="text-slate-900">${birth}</p>
                    </div>
                    <div class="col-span-2">
                        <p class="text-sm text-slate-500 mb-1">주소</p>
                        <p class="text-slate-900">${address}</p>
                    </div>
                    ${type === 'UNREGISTERED' ? `
                    <div class="col-span-2">
                        <p class="text-sm text-slate-500 mb-1">가입 경로</p>
                        <p class="text-slate-900 whitespace-pre-wrap">${path}</p>
                    </div>
                    ` : ''}
                </div>
            `;

            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
            currentUserId = null;
        }

        async function approveUser() {
            if (!currentUserId) return;

            if (!confirm('회원가입을 승인하시겠습니까?')) {
                return;
            }

            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/admin/users/${currentUserId}/approve`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('승인 처리 중 오류가 발생했습니다.');
                }
            } catch (error) {
                console.error('Approve error:', error);
                alert('승인 처리 중 오류가 발생했습니다.');
            }
        }

        function showRejectModal() {
            document.getElementById('rejectModal').classList.remove('hidden');
        }

        function closeRejectModal() {
            document.getElementById('rejectModal').classList.add('hidden');
            document.getElementById('rejectReason').value = '';
        }

        async function rejectUser() {
            if (!currentUserId) return;

            const reason = document.getElementById('rejectReason').value.trim();
            if (!reason) {
                alert('반려 사유를 입력해주세요.');
                return;
            }

            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/admin/users/${currentUserId}/reject?reason=${encodeURIComponent(reason)}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('반려 처리 중 오류가 발생했습니다.');
                }
            } catch (error) {
                console.error('Reject error:', error);
                alert('반려 처리 중 오류가 발생했습니다.');
            }
        }

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeRejectModal();
            }
        });
    </script>
</th:block>

</body>
</html>
