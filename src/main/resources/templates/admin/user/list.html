<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>전체 회원 관리 - 관리자</title>
</head>

<body>

<main layout:fragment="content">
    <section class="py-32 px-6">
        <div class="max-w-7xl mx-auto">
            <!-- 헤더 -->
            <div class="mb-10">
                <h1 class="text-4xl md:text-5xl font-light text-slate-900 mb-4">전체 회원 관리</h1>
                <p class="text-slate-600 font-light">등록된 모든 회원을 조회하고 관리합니다</p>
            </div>

            <!-- 메시지 -->
            <div th:if="${message}" 
                 th:classappend="${messageType == 'success'} ? 'bg-green-50 border-green-200 text-green-700' : 'bg-red-50 border-red-200 text-red-700'"
                 class="mb-6 px-4 py-3 rounded border">
                <p th:text="${message}"></p>
            </div>

            <!-- 통계 요약 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-white p-6 shadow-sm border-l-4 border-blue-500">
                    <p class="text-sm text-slate-600 mb-1">전체 회원</p>
                    <p class="text-3xl font-light text-slate-900" th:text="${users.totalElements}"></p>
                </div>
                <div class="bg-white p-6 shadow-sm border-l-4 border-green-500">
                    <p class="text-sm text-slate-600 mb-1">승인 완료</p>
                    <p class="text-3xl font-light text-slate-900" 
                       th:text="${#lists.size(#lists.toList(users.content.?[approvalStatus.name() == 'APPROVED']))}"></p>
                </div>
                <div class="bg-white p-6 shadow-sm border-l-4 border-yellow-500">
                    <p class="text-sm text-slate-600 mb-1">승인 대기</p>
                    <p class="text-3xl font-light text-slate-900" 
                       th:text="${#lists.size(#lists.toList(users.content.?[approvalStatus.name() == 'PENDING']))}"></p>
                </div>
                <div class="bg-white p-6 shadow-sm border-l-4 border-red-500">
                    <p class="text-sm text-slate-600 mb-1">반려</p>
                    <p class="text-3xl font-light text-slate-900" 
                       th:text="${#lists.size(#lists.toList(users.content.?[approvalStatus.name() == 'REJECTED']))}"></p>
                </div>
            </div>

            <!-- 회원 목록 -->
            <div class="bg-white shadow-sm overflow-hidden">
                <div th:if="${users.isEmpty()}" class="p-12 text-center text-slate-500">
                    등록된 회원이 없습니다.
                </div>

                <div th:unless="${users.isEmpty()}">
                    <table class="w-full">
                        <thead class="bg-slate-50 border-b">
                            <tr>
                                <th class="px-6 py-4 text-left text-sm font-medium text-slate-900">이름</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-slate-900">이메일</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-slate-900">교인 구분</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-slate-900">권한</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-slate-900">승인 상태</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-slate-900">가입일</th>
                                <th class="px-6 py-4 text-left text-sm font-medium text-slate-900">관리</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y">
                            <tr th:each="user : ${users}" 
                                class="hover:bg-slate-50"
                                th:classappend="${user.deleted} ? 'opacity-50' : ''">
                                <td class="px-6 py-4 text-sm text-slate-900">
                                    <span th:text="${user.name}"></span>
                                    <span th:if="${user.deleted}" class="ml-2 text-xs text-red-600">(삭제됨)</span>
                                </td>
                                <td class="px-6 py-4 text-sm text-slate-600" th:text="${user.email}"></td>
                                <td class="px-6 py-4 text-sm">
                                    <span th:if="${user.userType.name() == 'REGISTERED'}" 
                                          class="px-2 py-1 bg-blue-100 text-blue-800 rounded text-xs">등록교인</span>
                                    <span th:if="${user.userType.name() == 'UNREGISTERED'}" 
                                          class="px-2 py-1 bg-green-100 text-green-800 rounded text-xs">미등록교인</span>
                                </td>
                                <td class="px-6 py-4 text-sm">
                                    <span th:if="${user.role.name() == 'ADMIN'}" 
                                          class="px-2 py-1 bg-purple-100 text-purple-800 rounded text-xs font-medium">관리자</span>
                                    <span th:if="${user.role.name() == 'USER'}" 
                                          class="px-2 py-1 bg-slate-100 text-slate-700 rounded text-xs">일반</span>
                                </td>
                                <td class="px-6 py-4 text-sm">
                                    <span th:if="${user.approvalStatus.name() == 'APPROVED'}" 
                                          class="px-2 py-1 bg-green-100 text-green-800 rounded text-xs">승인</span>
                                    <span th:if="${user.approvalStatus.name() == 'PENDING'}" 
                                          class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded text-xs">대기</span>
                                    <span th:if="${user.approvalStatus.name() == 'REJECTED'}" 
                                          class="px-2 py-1 bg-red-100 text-red-800 rounded text-xs">반려</span>
                                </td>
                                <td class="px-6 py-4 text-sm text-slate-600" 
                                    th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                <td class="px-6 py-4 text-sm">
                                    <button type="button" 
                                            onclick="showUserDetail(this)"
                                            th:attr="data-user-id=${user.id},
                                                     data-user-name=${user.name},
                                                     data-user-email=${user.email},
                                                     data-user-type=${user.userType.name()},
                                                     data-user-role=${user.role.name()},
                                                     data-user-status=${user.approvalStatus.name()},
                                                     data-user-gender=${user.gender},
                                                     data-user-phone=${user.phoneNumber},
                                                     data-user-address=${user.address},
                                                     data-user-birth=${user.birth},
                                                     data-user-path=${user.registrationPath},
                                                     data-user-rejection=${user.rejectionReason},
                                                     data-user-deleted=${user.deleted}"
                                            class="text-blue-600 hover:text-blue-800 font-medium mr-3">
                                        상세
                                    </button>
                                    <button type="button" 
                                            th:if="${!user.deleted}"
                                            onclick="confirmDelete(this)"
                                            th:attr="data-user-id=${user.id},
                                                     data-user-name=${user.name}"
                                            class="text-red-600 hover:text-red-800 font-medium">
                                        삭제
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- 페이징 -->
                    <div th:if="${users.totalPages > 1}" class="px-6 py-4 border-t">
                        <div class="flex items-center justify-center gap-2">
                            <a th:if="${users.hasPrevious()}" 
                               th:href="@{/admin/users(page=${users.number - 1})}"
                               class="px-4 py-2 border hover:bg-slate-50 rounded">이전</a>
                            
                            <span class="px-4 py-2 text-sm text-slate-600">
                                <span th:text="${users.number + 1}"></span> / <span th:text="${users.totalPages}"></span>
                            </span>
                            
                            <a th:if="${users.hasNext()}" 
                               th:href="@{/admin/users(page=${users.number + 1})}"
                               class="px-4 py-2 border hover:bg-slate-50 rounded">다음</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 상세보기 모달 -->
    <div id="detailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-6">
        <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b">
                <h2 class="text-2xl font-light">회원 상세 정보</h2>
            </div>
            
            <div class="p-6 space-y-4" id="modalContent">
                <!-- 내용이 JavaScript로 채워집니다 -->
            </div>
            
            <div class="p-6 border-t flex gap-3">
                <button type="button" onclick="closeModal()" 
                        class="w-full px-6 py-3 border-2 border-slate-300 hover:border-slate-900 transition font-medium rounded">
                    닫기
                </button>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div id="deleteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-6">
        <div class="bg-white rounded-lg max-w-md w-full">
            <div class="p-6 border-b">
                <h2 class="text-2xl font-light text-red-600">회원 삭제 확인</h2>
            </div>
            
            <div class="p-6">
                <p class="text-slate-700 mb-4">
                    <span class="font-medium" id="deleteUserName"></span> 회원을 삭제하시겠습니까?
                </p>
                <p class="text-sm text-slate-600">
                    이 작업은 논리적 삭제이며, 회원의 데이터는 보존됩니다.
                </p>
            </div>
            
            <div class="p-6 border-t flex gap-3">
                <button type="button" onclick="confirmDeleteAction()"
                        class="flex-1 py-3 bg-red-600 text-white hover:bg-red-700 transition font-medium rounded">
                    삭제 확인
                </button>
                <button type="button" onclick="closeDeleteModal()" 
                        class="px-6 py-3 border-2 border-slate-300 hover:border-slate-900 transition font-medium rounded">
                    취소
                </button>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="extra-scripts">
    <script>
        function showUserDetail(button) {
            const name = button.getAttribute('data-user-name');
            const email = button.getAttribute('data-user-email');
            const type = button.getAttribute('data-user-type');
            const role = button.getAttribute('data-user-role');
            const status = button.getAttribute('data-user-status');
            const gender = button.getAttribute('data-user-gender');
            const phone = button.getAttribute('data-user-phone');
            const address = button.getAttribute('data-user-address') || '-';
            const birth = button.getAttribute('data-user-birth') || '-';
            const path = button.getAttribute('data-user-path') || '-';
            const rejection = button.getAttribute('data-user-rejection') || '';
            const deleted = button.getAttribute('data-user-deleted') === 'true';

            const typeText = type === 'REGISTERED' ? '등록교인' : '미등록교인';
            const roleText = role === 'ADMIN' ? '관리자' : '일반 회원';
            const statusText = status === 'APPROVED' ? '승인' : status === 'PENDING' ? '승인 대기' : '반려';
            const statusClass = status === 'APPROVED' ? 'text-green-600' : status === 'PENDING' ? 'text-yellow-600' : 'text-red-600';

            let content = `
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-sm text-slate-500 mb-1">이름</p>
                        <p class="text-slate-900 font-medium">${name}</p>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 mb-1">이메일</p>
                        <p class="text-slate-900">${email}</p>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 mb-1">교인 구분</p>
                        <p class="text-slate-900">${typeText}</p>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 mb-1">권한</p>
                        <p class="text-slate-900">${roleText}</p>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 mb-1">승인 상태</p>
                        <p class="${statusClass} font-medium">${statusText}</p>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 mb-1">성별</p>
                        <p class="text-slate-900">${gender}</p>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 mb-1">전화번호</p>
                        <p class="text-slate-900">${phone}</p>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500 mb-1">생년월일</p>
                        <p class="text-slate-900">${birth}</p>
                    </div>
                    <div class="col-span-2">
                        <p class="text-sm text-slate-500 mb-1">주소</p>
                        <p class="text-slate-900">${address}</p>
                    </div>
            `;

            if (type === 'UNREGISTERED') {
                content += `
                    <div class="col-span-2">
                        <p class="text-sm text-slate-500 mb-1">가입 경로</p>
                        <p class="text-slate-900 whitespace-pre-wrap">${path}</p>
                    </div>
                `;
            }

            if (status === 'REJECTED' && rejection) {
                content += `
                    <div class="col-span-2">
                        <p class="text-sm text-slate-500 mb-1">반려 사유</p>
                        <p class="text-red-600 whitespace-pre-wrap">${rejection}</p>
                    </div>
                `;
            }

            if (deleted) {
                content += `
                    <div class="col-span-2">
                        <p class="text-sm text-slate-500 mb-1">상태</p>
                        <p class="text-red-600 font-medium">삭제된 계정</p>
                    </div>
                `;
            }

            content += '</div>';

            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        let currentDeleteUserId = null;

        function confirmDelete(button) {
            const userId = button.getAttribute('data-user-id');
            const userName = button.getAttribute('data-user-name');

            currentDeleteUserId = userId;
            document.getElementById('deleteUserName').textContent = userName;
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        async function confirmDeleteAction() {
            if (!currentDeleteUserId) return;

            try {
                const token = localStorage.getItem('accessToken');
                const response = await fetch(`/admin/users/${currentDeleteUserId}/delete`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    window.location.reload();
                } else {
                    alert('삭제 중 오류가 발생했습니다.');
                }
            } catch (error) {
                console.error('Delete error:', error);
                alert('삭제 중 오류가 발생했습니다.');
            }
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            currentDeleteUserId = null;
        }

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
                closeDeleteModal();
            }
        });
    </script>
</th:block>

</body>
</html>
