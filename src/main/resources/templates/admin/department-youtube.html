<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>부서 YouTube 관리</title>
</head>

<body>

<main layout:fragment="content">
    <section class="pt-32 pb-16 bg-white px-6">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-3xl font-light text-slate-900 mb-8">부서 YouTube 영상 관리</h1>

            <!-- 전체 업데이트 버튼 -->
            <div class="mb-8 p-6 bg-slate-50 border border-slate-200">
                <h2 class="text-xl font-light text-slate-900 mb-4">전체 부서 일괄 업데이트</h2>
                <p class="text-slate-600 mb-4">모든 부서의 최신 YouTube 영상을 한 번에 갱신합니다.</p>
                <button onclick="updateAllDepartments()"
                        class="px-6 py-3 bg-slate-900 text-white hover:bg-slate-700 transition">
                    전체 업데이트
                </button>
            </div>

            <!-- 부서별 업데이트 -->
            <div class="space-y-4">
                <h2 class="text-xl font-light text-slate-900 mb-4">부서별 개별 업데이트</h2>

                <div class="bg-white border border-slate-200 p-4 flex items-center justify-between">
                    <div>
                        <h3 class="font-medium text-slate-900">태영아부</h3>
                        <p class="text-sm text-slate-600">Nursery Ministry</p>
                    </div>
                    <button onclick="updateDepartment('nursery')"
                            class="px-4 py-2 bg-slate-900 text-white text-sm hover:bg-slate-700 transition">
                        업데이트
                    </button>
                </div>

                <div class="bg-white border border-slate-200 p-4 flex items-center justify-between">
                    <div>
                        <h3 class="font-medium text-slate-900">유아유치부</h3>
                        <p class="text-sm text-slate-600">Preschool Ministry</p>
                    </div>
                    <button onclick="updateDepartment('preschool')"
                            class="px-4 py-2 bg-slate-900 text-white text-sm hover:bg-slate-700 transition">
                        업데이트
                    </button>
                </div>

                <div class="bg-white border border-slate-200 p-4 flex items-center justify-between">
                    <div>
                        <h3 class="font-medium text-slate-900">초등부</h3>
                        <p class="text-sm text-slate-600">Children Ministry</p>
                    </div>
                    <button onclick="updateDepartment('children')"
                            class="px-4 py-2 bg-slate-900 text-white text-sm hover:bg-slate-700 transition">
                        업데이트
                    </button>
                </div>

                <div class="bg-white border border-slate-200 p-4 flex items-center justify-between">
                    <div>
                        <h3 class="font-medium text-slate-900">중고등부</h3>
                        <p class="text-sm text-slate-600">Youth Ministry</p>
                    </div>
                    <button onclick="updateDepartment('youth')"
                            class="px-4 py-2 bg-slate-900 text-white text-sm hover:bg-slate-700 transition">
                        업데이트
                    </button>
                </div>

                <div class="bg-white border border-slate-200 p-4 flex items-center justify-between">
                    <div>
                        <h3 class="font-medium text-slate-900">대학청년부</h3>
                        <p class="text-sm text-slate-600">Young Adults Ministry</p>
                    </div>
                    <button onclick="updateDepartment('young-adults')"
                            class="px-4 py-2 bg-slate-900 text-white text-sm hover:bg-slate-700 transition">
                        업데이트
                    </button>
                </div>

                <div class="bg-white border border-slate-200 p-4 flex items-center justify-between">
                    <div>
                        <h3 class="font-medium text-slate-900">새가족부</h3>
                        <p class="text-sm text-slate-600">Newcomers Ministry</p>
                    </div>
                    <button onclick="updateDepartment('newcomers')"
                            class="px-4 py-2 bg-slate-900 text-white text-sm hover:bg-slate-700 transition">
                        업데이트
                    </button>
                </div>

                <div class="bg-white border border-slate-200 p-4 flex items-center justify-between">
                    <div>
                        <h3 class="font-medium text-slate-900">다민족부</h3>
                        <p class="text-sm text-slate-600">Multiethnic Ministry</p>
                    </div>
                    <button onclick="updateDepartment('multiethnic')"
                            class="px-4 py-2 bg-slate-900 text-white text-sm hover:bg-slate-700 transition">
                        업데이트
                    </button>
                </div>
            </div>

            <!-- 결과 메시지 -->
            <div id="result-message" class="mt-8 p-4 hidden"></div>
        </div>
    </section>
</main>

<th:block layout:fragment="extra-scripts">
    <script>
        // 특정 부서 업데이트
        async function updateDepartment(departmentCode) {
            const button = event.target;
            button.disabled = true;
            button.textContent = '업데이트 중...';

            try {
                const response = await fetch(`/api/department/${departmentCode}/youtube/update`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    showMessage(`${departmentCode} 영상이 갱신되었습니다!`, 'success');
                } else {
                    showMessage(`${departmentCode} 업데이트 실패`, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('업데이트 중 오류가 발생했습니다.', 'error');
            } finally {
                button.disabled = false;
                button.textContent = '업데이트';
            }
        }

        // 전체 부서 업데이트
        async function updateAllDepartments() {
            const button = event.target;
            button.disabled = true;
            button.textContent = '업데이트 중...';

            try {
                const response = await fetch('/api/department/youtube/update-all', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    showMessage('모든 부서 영상이 갱신되었습니다!', 'success');
                } else {
                    showMessage('전체 업데이트 실패', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('업데이트 중 오류가 발생했습니다.', 'error');
            } finally {
                button.disabled = false;
                button.textContent = '전체 업데이트';
            }
        }

        // 메시지 표시
        function showMessage(message, type) {
            const messageDiv = document.getElementById('result-message');
            messageDiv.className = 'mt-8 p-4 ' + (type === 'success' ? 'bg-green-50 border border-green-200 text-green-800' : 'bg-red-50 border border-red-200 text-red-800');
            messageDiv.textContent = message;
            messageDiv.classList.remove('hidden');

            setTimeout(() => {
                messageDiv.classList.add('hidden');
            }, 3000);
        }
    </script>
</th:block>

</body>
</html>
