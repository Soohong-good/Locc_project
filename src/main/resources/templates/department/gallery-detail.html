<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${image.title} + ' - 갤러리'">갤러리</title>
</head>
<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-20 bg-slate-50 px-6">
        <div class="max-w-4xl mx-auto">
            <a th:href="@{/department/{code}(code=${departmentCode})}" 
               class="inline-flex items-center text-sm text-slate-600 hover:text-slate-900 mb-12 group transition-all duration-300">
                <svg class="w-4 h-4 mr-2 transition-transform duration-300 group-hover:-translate-x-1" 
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span class="font-light tracking-wide">목록으로</span>
            </a>
            
            <div class="mb-8">
                <p class="text-xs tracking-[0.3em] text-slate-400 uppercase mb-4">Gallery</p>
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-light text-slate-900 leading-[1.3] tracking-tight mb-8"
                    th:text="${image.title}">
                    이미지 제목
                </h1>
                <div class="h-px w-16 bg-slate-300 mb-8"></div>
            </div>

            <!-- 메타 정보 -->
            <div class="flex flex-wrap items-center justify-between gap-6">
                <div class="flex flex-wrap items-center gap-6 text-slate-500 font-light">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        <span th:text="${image.uploaderName}">작성자</span>
                    </div>
                    <span class="text-slate-300">•</span>
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <span th:text="${#temporals.format(image.createdAt, 'yyyy. MM. dd')}">2024. 11. 15</span>
                    </div>
                    <span class="text-slate-300">•</span>
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                        <span th:text="${image.viewCount}">0</span>
                    </div>
                </div>

                <!-- 관리자 버튼 -->
                <div sec:authorize="hasRole('ADMIN')" class="flex gap-3">
                    <button onclick="confirmDelete()"
                            class="px-4 py-2 border-2 border-red-300 text-red-600 hover:border-red-600 transition font-medium">
                        삭제
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 이미지 섹션 -->
    <section class="py-24 bg-white px-6">
        <article class="max-w-5xl mx-auto">
            <!-- 이미지 그리드 (여러 이미지) -->
            <div th:if="${groupImages != null && groupImages.size() > 1}" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
                <div th:each="img : ${groupImages}" class="relative group">
                    <img th:src="@{'/uploads/gallery/' + ${img.storedFilename}}"
                         th:alt="${img.title}"
                         class="w-full h-auto border border-slate-200 shadow-lg hover:shadow-xl transition-shadow"
                         onerror="this.src='/images/no-image.png'">
                </div>
            </div>

            <!-- 단일 이미지 -->
            <div th:if="${groupImages == null || groupImages.size() == 1}" class="mb-12">
                <img th:src="@{'/uploads/gallery/' + ${image.storedFilename}}" 
                     th:alt="${image.title}"
                     class="w-full h-auto border border-slate-200 shadow-lg"
                     onerror="this.src='/images/no-image.png'">
            </div>

            <!-- 설명 -->
            <div th:if="${image.description != null && !image.description.isEmpty()}"
                 class="prose prose-lg prose-slate max-w-none">
                <p class="text-slate-700 leading-[1.9] font-light text-lg whitespace-pre-wrap"
                   th:text="${image.description}">
                    이미지 설명
                </p>
            </div>

            <!-- 파일 정보 -->
            <div class="mt-12 pt-8 border-t border-slate-200">
                <h3 class="text-sm tracking-[0.2em] text-slate-400 uppercase mb-6">File Info</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                        </svg>
                        <div>
                            <p class="text-xs text-slate-500">파일명</p>
                            <p class="text-sm font-light text-slate-900" th:text="${image.originalFilename}">image.jpg</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"></path>
                        </svg>
                        <div>
                            <p class="text-xs text-slate-500">파일 크기</p>
                            <p class="text-sm font-light text-slate-900" 
                               th:text="${#numbers.formatDecimal(image.fileSize / 1024.0, 1, 2)} + ' KB'">
                                0 KB
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </article>
    </section>

    <!-- Navigation -->
    <section class="py-12 bg-slate-50 px-6">
        <div class="max-w-4xl mx-auto">
            <a th:href="@{/department/{code}(code=${departmentCode})}"
               class="group inline-flex items-center px-8 py-4 border-2 border-slate-900 text-slate-900 hover:bg-slate-900 hover:text-white transition-all duration-300 font-light tracking-wide">
                <svg class="w-5 h-5 mr-2 transition-transform duration-300 group-hover:-translate-x-1" 
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                목록으로 돌아가기
            </a>
        </div>
    </section>
</main>

<!-- 삭제 확인 모달 -->
<th:block layout:fragment="modals">
<div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
    <!-- 배경 오버레이 -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>

    <!-- 모달 컨텐츠 -->
    <div class="relative bg-white w-full max-w-md overflow-hidden shadow-2xl">
        <!-- 헤더 -->
        <div class="px-8 py-6 border-b border-slate-100">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-red-50 flex items-center justify-center flex-shrink-0">
                    <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="text-xl font-medium text-slate-900">이미지 삭제</h2>
                    <p class="text-sm text-slate-500 mt-0.5 font-light">이 작업은 되돌릴 수 없습니다</p>
                </div>
            </div>
        </div>

        <!-- 내용 -->
        <div class="px-8 py-6">
            <p class="text-slate-600 mb-3 font-light">이 이미지를 삭제하시겠습니까?</p>
            <p class="font-medium text-slate-900 bg-slate-50 px-4 py-3 rounded" th:text="${image.title}"></p>
        </div>

        <!-- 푸터 -->
        <div class="flex items-center justify-end gap-3 px-8 py-6 bg-slate-50 border-t border-slate-100">
            <button type="button" onclick="closeDeleteModal()"
                    class="px-6 py-2.5 text-slate-700 hover:text-slate-900 font-medium transition-colors">
                취소
            </button>
            <button type="button" onclick="deleteImage()"
                    class="px-8 py-2.5 bg-red-600 text-white hover:bg-red-700 font-medium transition-all shadow-sm hover:shadow">
                삭제하기
            </button>
        </div>
    </div>
</div>
</th:block>

<th:block layout:fragment="extra-scripts">
    <script th:inline="javascript">
        /*<![CDATA[*/
        const imageId = /*[[${image.id}]]*/ null;
        const departmentCode = /*[[${departmentCode}]]*/ '';
        /*]]>*/
    </script>
    <script>
        // 삭제 확인 모달 열기
        function confirmDelete() {
            document.getElementById('deleteModal').classList.remove('hidden');
        }

        // 삭제 모달 닫기
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
        }

        // 이미지 삭제
        async function deleteImage() {
            try {
                const token = localStorage.getItem('accessToken');
                
                const response = await fetch(`/api/departments/${departmentCode}/gallery/${imageId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('삭제 실패');
                }

                alert('이미지가 삭제되었습니다.');
                window.location.href = `/department/${departmentCode}`;
                
            } catch (error) {
                console.error('삭제 오류:', error);
                alert('이미지 삭제 중 오류가 발생했습니다.');
            }
        }

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeDeleteModal();
            }
        });

        // 배경 클릭 시 모달 닫기
        document.getElementById('deleteModal')?.addEventListener('click', (e) => {
            if (e.target.id === 'deleteModal') {
                closeDeleteModal();
            }
        });
    </script>
</th:block>

</body>
</html>
