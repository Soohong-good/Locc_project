<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>신청자 명단</title>
</head>

<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-12 bg-slate-50 px-6">
        <div class="max-w-6xl mx-auto">
            <!-- 뒤로가기 -->
            <a th:href="@{/training/{id}(id=${training.id})}" 
               class="inline-flex items-center gap-2 text-slate-600 hover:text-slate-900 mb-6 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                <span>훈련 상세로</span>
            </a>

            <div class="flex items-start justify-between">
                <div>
                    <h1 class="text-3xl font-medium text-slate-900 mb-2" th:text="${training.title}">훈련명</h1>
                    <p class="text-slate-600">신청자 명단</p>
                </div>
                
                <!-- 엑셀 다운로드 버튼 -->
                <button onclick="downloadExcel()"
                        class="px-6 py-3 bg-green-600 text-white hover:bg-green-700 transition flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    <span>엑셀 다운로드</span>
                </button>
            </div>
        </div>
    </section>

    <!-- 신청자 목록 -->
    <section class="py-12 bg-white px-6">
        <div class="max-w-6xl mx-auto">
            <!-- 통계 -->
            <div class="mb-8 p-6 bg-slate-50 border border-slate-200">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <p class="text-sm text-slate-600 mb-1">총 신청자</p>
                        <p class="text-2xl font-medium text-slate-900" th:text="${totalCount}">0</p>
                    </div>
                </div>
            </div>

            <!-- 목록이 없을 때 -->
            <div th:if="${applications.empty}" class="text-center py-20">
                <p class="text-slate-500">신청자가 없습니다.</p>
            </div>

            <!-- 테이블 -->
            <div th:unless="${applications.empty}">
                <!-- 헤더 -->
                <div class="hidden md:grid grid-cols-12 gap-6 py-4 px-6 border-b border-slate-300 text-sm font-medium text-slate-700">
                    <div class="col-span-2">이름</div>
                    <div class="col-span-3">연락처</div>
                    <div class="col-span-3">신청일</div>
                    <div class="col-span-2"></div>
                    <div class="col-span-2">납부방법</div>
                </div>

                <!-- 목록 -->
                <div th:each="app : ${applications.content}"
                     class="grid grid-cols-1 md:grid-cols-12 gap-4 md:gap-6 py-5 px-6 border-b border-slate-100 hover:bg-slate-50 transition">
                    
                    <!-- 이름 -->
                    <div class="col-span-2">
                        <span class="text-slate-900" th:text="${app.userName}">홍길동</span>
                    </div>

                    <!-- 연락처 -->
                    <div class="col-span-3 text-sm text-slate-600">
                        <span th:text="${app.phone}">010-1234-5678</span>
                    </div>

                    <!-- 신청일 -->
                    <div class="col-span-3 text-sm text-slate-600">
                        <span th:text="${#temporals.format(app.appliedAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </div>

                    <!-- 납부 방법 -->
                    <div class="col-span-2">
                        <span></span>
                    </div>
                    <!-- 납부 방법 -->
                    <div class="col-span-2">
                        <span th:switch="${app.paymentMethod}">
                            <span th:case="CASH">현금납부</span>
                            <span th:case="BANK">계좌이체</span>
                        </span>
                    </div>

                </div>
            </div>

            <!-- 페이징 -->
            <div th:if="${applications.totalPages > 1}" class="mt-8 flex justify-center">
                <nav class="flex gap-2">
                    <a th:if="${applications.hasPrevious()}"
                       th:href="@{/training/application/manage/{trainingId}(trainingId=${training.id}, page=${applications.number - 1})}"
                       class="px-4 py-2 border border-slate-300 hover:bg-slate-50 transition text-sm">
                        이전
                    </a>

                    <span th:each="i : ${#numbers.sequence(0, applications.totalPages - 1)}"
                          th:if="${i >= applications.number - 2 and i <= applications.number + 2}">
                        <a th:href="@{/training/application/manage/{trainingId}(trainingId=${training.id}, page=${i})}"
                           th:text="${i + 1}"
                           th:classappend="${i == applications.number} ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 hover:bg-slate-50'"
                           class="px-4 py-2 border border-slate-300 transition text-sm">
                            1
                        </a>
                    </span>

                    <a th:if="${applications.hasNext()}"
                       th:href="@{/training/application/manage/{trainingId}(trainingId=${training.id}, page=${applications.number + 1})}"
                       class="px-4 py-2 border border-slate-300 hover:bg-slate-50 transition text-sm">
                        다음
                    </a>
                </nav>
            </div>
        </div>
    </section>
</main>

<th:block layout:fragment="extra-scripts">
<script th:inline="javascript">
    const trainingId = /*[[${training.id}]]*/ 0;
    
    // 엑셀 다운로드
    async function downloadExcel() {
        try {
            const token = localStorage.getItem('accessToken');
            const headers = {};

            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const response = await fetch(`/api/applications/training/${trainingId}/excel`, {
                method: 'GET',
                headers
            });

            if (!response.ok) {
                alert('엑셀 다운로드에 실패했습니다.');
                return;
            }

            // ✅ 백단에서 내려준 파일명 읽기
            const disposition = response.headers.get('Content-Disposition') || '';
            let fileName = '신청자명단.xlsx'; // ⛑ fallback (헤더 못 읽을 때만 사용)

            // filename*=UTF-8''... 우선 처리
            const matchStar = disposition.match(/filename\*\s*=\s*UTF-8''([^;]+)/i);
            if (matchStar && matchStar[1]) {
                fileName = decodeURIComponent(matchStar[1]);
            } else {
                // filename="..."
                const match = disposition.match(/filename\s*=\s*"([^"]+)"/i);
                if (match && match[1]) {
                    fileName = match[1];
                }
            }

            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = fileName; // ✅ 정상 시: 백단 파일명 그대로
            document.body.appendChild(a);
            a.click();

            a.remove();
            window.URL.revokeObjectURL(url);

        } catch (error) {
            console.error('Error:', error);
            alert('오류가 발생했습니다.');
        }
    }


    // 신청 삭제
    async function deleteApplication(appId) {
        if (!confirm('정말 삭제하시겠습니까?')) return;

        try {
            const token = localStorage.getItem('accessToken');
            const headers = {};
            
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const response = await fetch(`/api/applications/${appId}`, {
                method: 'DELETE',
                headers: headers
            });

            if (response.ok) {
                alert('삭제되었습니다.');
                location.reload();
            } else {
                alert('삭제에 실패했습니다.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('오류가 발생했습니다.');
        }
    }
</script>
</th:block>

</body>
</html>
