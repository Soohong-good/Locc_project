<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">
<head>
    <title>훈련신청</title>
</head>

<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-16 bg-slate-50 px-6">
        <div class="max-w-6xl mx-auto">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-medium text-slate-900 mb-2">훈련신청</h1>
                    <p class="text-slate-600">교회 훈련 프로그램 신청</p>
                </div>
                <div class="flex items-center gap-3">
                    <!-- 내 신청내역 버튼 (로그인한 사용자) -->
                    <a sec:authorize="isAuthenticated()"
                       th:href="@{/training/application/my}"
                       class="px-5 py-2 border border-slate-900 text-slate-900 hover:bg-slate-900 hover:text-white transition">
                        내 신청내역
                    </a>
                    <!-- 관리자 버튼 -->
                    <div sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/training/admin/create}"
                           class="px-5 py-2 bg-slate-900 text-white hover:bg-slate-800 transition">
                            + 새 훈련 등록
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 훈련 목록 (게시판 형태) -->
    <section class="py-12 bg-white px-6">
        <div class="max-w-6xl mx-auto">
            <!-- 목록이 없을 때 -->
            <div th:if="${trainings.empty}" class="text-center py-20">
                <p class="text-slate-500">등록된 훈련이 없습니다.</p>
            </div>

            <!-- 테이블 -->
            <div th:unless="${trainings.empty}">
                <!-- 헤더 -->
                <div class="hidden md:grid grid-cols-12 gap-6 py-4 px-6 border-b border-slate-300 text-slate-600 text-sm">
                    <div class="col-span-1">상태</div>
                    <div class="col-span-7">훈련명</div>
                    <div class="col-span-2 text-center">기간</div>
                    <div class="col-span-2 text-center">신청마감</div>
                </div>

                <!-- 목록 -->
                <a th:each="training : ${trainings.content}"
                   th:href="@{/training/{id}(id=${training.id})}"
                   class="grid grid-cols-1 md:grid-cols-12 gap-4 md:gap-6 py-5 px-6 border-b border-slate-100 hover:bg-slate-50 transition items-center cursor-pointer no-underline">

                    <!-- 상태 -->
                    <div class="col-span-1">
                        <span th:if="${training.status.name() == 'OPEN'}" class="font-semibold text-green-600 text-sm">
                            신청가능
                        </span>
                        <span th:if="${training.status.name() == 'CLOSED'}" class="font-semibold text-gray-500 text-sm">
                            마감
                        </span>
                    </div>


                    <!-- 훈련명 -->
                    <div class="col-span-7">
                        <span class="text-slate-900" th:text="${training.title}">제자훈련 2025년 1기</span>
                    </div>

                    <!-- 기간 -->
                    <div class="col-span-2 text-center text-slate-600 text-sm">
                        <span th:text="${#temporals.format(training.startDate, 'MM.dd')}"></span> ~
                        <span th:text="${#temporals.format(training.endDate, 'MM.dd')}"></span>
                    </div>

                    <!-- 신청마감 -->
                    <div class="col-span-2 text-center text-slate-600 text-sm">
                        <span th:text="${#temporals.format(training.applicationDeadline, 'MM.dd HH:mm')}"></span>
                    </div>
                </a>
            </div>

            <!-- 페이징 -->
            <div th:if="${trainings.totalPages > 1}" class="mt-8 flex justify-center">
                <nav class="flex gap-2">
                    <a th:if="${trainings.hasPrevious()}"
                       th:href="@{/training(page=${trainings.number - 1})}"
                       class="px-4 py-2 border border-slate-300 hover:bg-slate-50 transition text-sm">
                        이전
                    </a>

                    <span th:each="i : ${#numbers.sequence(0, trainings.totalPages - 1)}"
                          th:if="${i >= trainings.number - 2 and i <= trainings.number + 2}">
                        <a th:href="@{/training(page=${i})}"
                           th:text="${i + 1}"
                           th:classappend="${i == trainings.number} ? 'bg-slate-900 text-white' : 'bg-white text-slate-700 hover:bg-slate-50'"
                           class="px-4 py-2 border border-slate-300 transition text-sm">
                            1
                        </a>
                    </span>

                    <a th:if="${trainings.hasNext()}"
                       th:href="@{/training(page=${trainings.number + 1})}"
                       class="px-4 py-2 border border-slate-300 hover:bg-slate-50 transition text-sm">
                        다음
                    </a>
                </nav>
            </div>
        </div>
    </section>
</main>

</body>
</html>
