<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>훈련 등록</title>
</head>

<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-12 bg-slate-50 px-6">
        <div class="max-w-4xl mx-auto">
            <a th:href="@{/training}" 
               class="inline-flex items-center gap-2 text-slate-600 hover:text-slate-900 mb-6 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                <span>훈련 목록으로</span>
            </a>

            <h1 class="text-3xl md:text-4xl font-medium text-slate-900 mb-2">새 훈련 등록</h1>
            <p class="text-lg text-slate-600">새로운 훈련 프로그램을 등록하세요</p>
        </div>
    </section>

    <!-- 등록 폼 -->
    <section class="py-12 bg-white px-6">
        <div class="max-w-4xl mx-auto">
            <form id="createForm" class="space-y-6">
                <!-- 훈련명 -->
                <div>
                    <label for="title" class="block text-sm font-medium text-slate-700 mb-2">
                        훈련명 <span class="text-red-500">*</span>
                    </label>
                    <input type="text" 
                           id="title"
                           name="title"
                           required
                           maxlength="200"
                           placeholder="예: 제자훈련 2025년 1기"
                           class="w-full px-4 py-3 border border-slate-300 focus:border-blue-500 focus:outline-none transition">
                </div>

                <!-- 훈련 설명 -->
                <div>
                    <label for="description" class="block text-sm font-medium text-slate-700 mb-2">
                        훈련 설명
                    </label>
                    <textarea id="description"
                              name="description"
                              rows="8"
                              placeholder="훈련에 대한 상세한 설명을 입력하세요"
                              class="w-full px-4 py-3 border border-slate-300 focus:border-blue-500 focus:outline-none transition"></textarea>
                </div>

                <!-- 기간 -->
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label for="startDate" class="block text-sm font-medium text-slate-700 mb-2">
                            시작일 <span class="text-red-500">*</span>
                        </label>
                        <input type="date" 
                               id="startDate"
                               name="startDate"
                               required
                               class="w-full px-4 py-3 border border-slate-300 focus:border-blue-500 focus:outline-none transition">
                    </div>

                    <div>
                        <label for="endDate" class="block text-sm font-medium text-slate-700 mb-2">
                            종료일 <span class="text-red-500">*</span>
                        </label>
                        <input type="date" 
                               id="endDate"
                               name="endDate"
                               required
                               class="w-full px-4 py-3 border border-slate-300 focus:border-blue-500 focus:outline-none transition">
                    </div>
                </div>

                <!-- 신청 마감일 -->
                <div>
                    <label for="applicationDeadline" class="block text-sm font-medium text-slate-700 mb-2">
                        신청 마감일시 <span class="text-red-500">*</span>
                    </label>
                    <input type="datetime-local" 
                           id="applicationDeadline"
                           name="applicationDeadline"
                           required
                           class="w-full px-4 py-3 border border-slate-300 focus:border-blue-500 focus:outline-none transition">
                </div>

                <!-- 훈련비 -->
                <div>
                    <label for="trainingFee" class="block text-sm font-medium text-slate-700 mb-2">
                        훈련비 (원) <span class="text-red-500">*</span>
                    </label>
                    <input type="number"
                           id="trainingFee"
                           name="trainingFee"
                           required
                           min="0"
                           value="0"
                           placeholder="0"
                           class="w-full px-4 py-3 border border-slate-300 focus:border-blue-500 focus:outline-none transition">
                    <p class="mt-1 text-xs text-slate-500">무료인 경우 0을 입력하세요</p>
                </div>

                <!-- 버튼 -->
                <div class="flex gap-3 pt-6">
                    <button type="button" 
                            onclick="history.back()"
                            class="flex-1 px-6 py-3 border border-slate-300 hover:border-slate-900 transition text-slate-700 hover:text-slate-900">
                        취소
                    </button>
                    <button type="submit"
                            class="flex-1 px-6 py-3 bg-slate-900 text-white hover:bg-slate-800 transition font-medium">
                        등록하기
                    </button>
                </div>
            </form>
        </div>
    </section>
</main>

<th:block layout:fragment="extra-scripts">
<script>
    document.getElementById('createForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        console.log('Form submit prevented');

        const data = {
            title: document.getElementById('title').value,
            description: document.getElementById('description').value,
            startDate: document.getElementById('startDate').value,
            endDate: document.getElementById('endDate').value,
            applicationDeadline: document.getElementById('applicationDeadline').value,
            trainingFee: parseInt(document.getElementById('trainingFee').value),
            maxParticipants: 999
        };

        console.log('Data:', data);

        try {
            const token = localStorage.getItem('accessToken');
            const headers = {
                'Content-Type': 'application/json'
            };

            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            console.log('Sending request...');

            const response = await fetch('/api/trainings', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(data)
            });

            console.log('Response status:', response.status);

            if (response.ok) {
                const result = await response.json();
                alert('훈련이 등록되었습니다.');
                window.location.href = `/training/${result.id}`;
            } else {
                const error = await response.json();
                console.error('Error response:', error);
                alert(error.message || '등록에 실패했습니다.');
            }
        } catch (error) {
            console.error('Fetch error:', error);
            alert('오류가 발생했습니다: ' + error.message);
        }
    });

    // 종료일은 시작일 이후로만 선택 가능
    document.getElementById('startDate').addEventListener('change', function() {
        document.getElementById('endDate').min = this.value;
    });

    // 신청 마감일은 시작일 이전으로만 선택 가능
    document.getElementById('startDate').addEventListener('change', function() {
        const startDate = new Date(this.value);
        const maxDeadline = new Date(startDate);
        maxDeadline.setDate(maxDeadline.getDate() - 1);
        document.getElementById('applicationDeadline').max = maxDeadline.toISOString().slice(0, 16);
    });
</script>
</th:block>

</body>
</html>
