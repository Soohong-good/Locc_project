<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>내 신청내역</title>
</head>

<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-16 bg-slate-50 px-6">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-3xl font-medium text-slate-900 mb-2">내 신청내역</h1>
            <p class="text-slate-600">훈련 신청 현황</p>
        </div>
    </section>

    <!-- 신청 내역 -->
    <section class="py-12 bg-white px-6">
        <div class="max-w-6xl mx-auto">
            <!-- 목록이 없을 때 -->
            <div th:if="${#lists.isEmpty(applications)}" class="text-center py-20">
                <p class="text-slate-500 mb-6">신청한 훈련이 없습니다.</p>
                <a th:href="@{/training}" class="inline-block px-6 py-3 bg-slate-900 text-white hover:bg-slate-800 transition">
                    훈련 목록 보기
                </a>
            </div>

            <!-- 목록 -->
            <div th:unless="${#lists.isEmpty(applications)}" class="space-y-6">
                <div th:each="app : ${applications}" 
                     class="border border-slate-200 p-6 hover:border-slate-300 transition">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-lg font-medium text-slate-900 mb-2" th:text="${app.trainingTitle}">훈련명</h3>
                            <p class="text-sm text-slate-600">
                                신청일: <span th:text="${#temporals.format(app.appliedAt, 'yyyy-MM-dd HH:mm')}"></span>
                            </p>
                        </div>
                        <button onclick="cancelApplication([[${app.id}]])"
                                class="px-4 py-2 border border-red-600 text-red-600 hover:bg-red-600 hover:text-white transition text-sm">
                            신청 취소
                        </button>
                    </div>
                    
                    <div class="pt-4 border-t border-slate-100">
                        <p class="text-sm text-slate-600">연락처: <span th:text="${app.phone}"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<th:block layout:fragment="extra-scripts">
<script>
    async function cancelApplication(appId) {
        if (!confirm('정말 신청을 취소하시겠습니까?')) return;

        try {
            const token = localStorage.getItem('accessToken');
            const headers = {};
            
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const response = await fetch(`/api/applications/${appId}`, {
                method: 'DELETE',
                headers: headers
            });

            if (response.ok) {
                alert('신청이 취소되었습니다.');
                location.reload();
            } else {
                const error = await response.json();
                alert(error.message || '취소에 실패했습니다.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('오류가 발생했습니다.');
        }
    }
</script>
</th:block>

</body>
</html>
