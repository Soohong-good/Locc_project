<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">
<head>
    <title>훈련 신청</title>
    <style>
        /* select 기본 화살표 제거 및 커스텀 화살표 추가 */
        select.custom-select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1.25rem;
            padding-right: 3rem;
        }
    </style>
</head>

<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-12 bg-slate-50 px-6">
        <div class="max-w-3xl mx-auto">
            <a th:href="@{/training/{id}(id=${training.id})}"
               class="inline-flex items-center gap-2 text-slate-600 hover:text-slate-900 mb-6 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                <span>뒤로가기</span>
            </a>

            <h1 class="text-3xl md:text-4xl font-medium text-slate-900 mb-2">훈련 신청</h1>
            <p class="text-lg text-slate-600" th:text="${training.title}">제자훈련 2025년 1기</p>
        </div>
    </section>

    <!-- 신청 폼 -->
    <section class="py-12 bg-white px-6">
        <div class="max-w-3xl mx-auto">
            <!-- 훈련 정보 요약 -->
            <div class="bg-blue-50 border border-blue-200 p-6 mb-8">
                <h2 class="text-lg font-medium text-slate-900 mb-3">신청하실 훈련</h2>
                <div class="space-y-2 text-sm text-slate-700">
                    <p><strong>훈련명:</strong> <span th:text="${training.title}"></span></p>
                    <p><strong>기간:</strong>
                        <span th:text="${#temporals.format(training.startDate, 'yyyy.MM.dd')}"></span> ~
                        <span th:text="${#temporals.format(training.endDate, 'yyyy.MM.dd')}"></span>
                    </p>
                    <p><strong>훈련비:</strong>
                        <span th:if="${training.trainingFee > 0}"
                              th:text="${#numbers.formatInteger(training.trainingFee, 0, 'COMMA')} + '원'"></span>
                        <span th:if="${training.trainingFee == 0}" class="text-green-600 font-medium">무료</span>
                    </p>
                </div>
            </div>

            <!-- 신청서 폼 -->
            <form id="applyForm" class="space-y-6">
                <!-- 이름 (자동입력) -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        이름 <span class="text-red-500">*</span>
                    </label>
                    <!-- ✅ id는 그대로 userName 사용 가능 (단, JS에서 폼 범위로만 선택) -->
                    <input type="text"
                           id="userName"
                           readonly
                           class="w-full px-4 py-3 border border-slate-300 bg-slate-50 text-slate-700">
                </div>

                <!-- 연락처 -->
                <div>
                    <label for="phone" class="block text-sm font-medium text-slate-700 mb-2">
                        연락처 <span class="text-red-500">*</span>
                    </label>
                    <input type="tel"
                           id="phone"
                           name="phone"
                           placeholder="010-1234-5678"
                           pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}"
                           required
                           class="w-full px-4 py-3 border border-slate-300 focus:border-blue-500 focus:outline-none transition">
                    <p class="mt-1 text-xs text-slate-500">'-'를 포함하여 입력해주세요. (예: 010-1234-5678)</p>
                </div>

                <!-- 입금 방법 (유료 훈련만 표시) -->
                <div th:if="${training.trainingFee > 0}">
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        입금 방법 <span class="text-red-500">*</span>
                    </label>
                    <select id="paymentMethod"
                            name="paymentMethod"
                            required
                            class="custom-select w-full px-4 py-3 border border-slate-300 focus:border-blue-500 focus:outline-none transition bg-white">
                        <option value="">선택하세요</option>
                        <option value="BANK">계좌이체</option>
                        <option value="CASH">현금납부</option>
                    </select>
                </div>
                <!-- 주의사항 -->
                <div class="bg-amber-50 border border-amber-200 p-6">
                    <h3 class="font-medium text-slate-900 mb-3 flex items-center gap-2">
                        <svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                        신청 전 반드시 확인하세요
                    </h3>
                    <ul class="space-y-2 text-sm text-slate-700">
                        <li class="flex items-start gap-2">
                            <span class="text-amber-600 mt-0.5">•</span>
                            <span>현금 제출은 사무실로 해주시기 바랍니다.</span>
                        </li>
                    </ul>
                </div>
                <!-- 동의 체크박스 -->
                <div class="flex items-start gap-3">
                    <input type="checkbox"
                           id="agree"
                           required
                           class="mt-1 w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500">
                    <label for="agree" class="text-sm text-slate-700">
                        위 내용을 모두 확인했으며, 훈련 규정을 준수할 것을 동의합니다. <span class="text-red-500">*</span>
                    </label>
                </div>

                <!-- 버튼 -->
                <div class="flex gap-3 pt-6">
                    <button type="button"
                            onclick="history.back()"
                            class="flex-1 px-6 py-3 border border-slate-300 hover:border-slate-900 transition text-slate-700 hover:text-slate-900">
                        취소
                    </button>
                    <button type="submit"
                            class="flex-1 px-6 py-3 bg-blue-600 text-white hover:bg-blue-700 transition font-medium">
                        신청하기
                    </button>
                </div>
            </form>
        </div>
    </section>
</main>

<th:block layout:fragment="extra-scripts">
    <script th:inline="javascript">
        const trainingId = /*[[${training.id}]]*/ 0;

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('applyForm');
            const phoneInput = document.getElementById('phone');
            const agreeCheckbox = document.getElementById('agree');
            const paymentMethod = document.getElementById('paymentMethod');

            // ✅ 핵심: "폼 내부 userName input"만 선택 -> header #userName(span)과 충돌 방지
            const userNameInput = document.querySelector('#applyForm #userName');

            loadUserName(userNameInput);

            phoneInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/[^0-9]/g, '');

                if (value.length > 3 && value.length <= 7) {
                    value = value.slice(0, 3) + '-' + value.slice(3);
                } else if (value.length > 7) {
                    value = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7, 11);
                }

                e.target.value = value;
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const phone = phoneInput.value;
                const agree = agreeCheckbox.checked;
                const payment = paymentMethod.value;

                if (!agree) {
                    alert('약관에 동의해주세요.');
                    return;
                }

                if (!phone.match(/^[0-9]{3}-[0-9]{4}-[0-9]{4}$/)) {
                    alert('올바른 연락처 형식이 아닙니다. (예: 010-1234-5678)');
                    return;
                }

                try {
                    const token = localStorage.getItem('accessToken');
                    const headers = { 'Content-Type': 'application/json' };

                    if (token) {
                        headers['Authorization'] = `Bearer ${token}`;
                    }

                    const response = await fetch('/api/applications', {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({
                            trainingId: trainingId,
                            phone: phone,
                            paymentMethod: payment
                        })
                    });

                    if (response.ok) {
                        alert('신청이 완료되었습니다!');
                        window.location.href = '/training/application/my';
                        return;
                    }

                    const error = await response.json().catch(() => ({}));
                    alert(error.message || '신청에 실패했습니다.');
                } catch (error) {
                    console.error('Error:', error);
                    alert('오류가 발생했습니다.');
                }
            });
        });

        async function loadUserName(userNameInput) {
            try {
                if (!userNameInput) {
                    console.error('폼 내부 userName input을 찾을 수 없습니다. (#applyForm #userName)');
                    return;
                }

                const token = localStorage.getItem('accessToken');
                const headers = {};

                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const response = await fetch('/api/mypage/info', {
                    method: 'GET',
                    headers
                });

                if (!response.ok) {
                    console.error('API 호출 실패:', response.status);
                    return;
                }

                const userInfo = await response.json();
                userNameInput.value = userInfo.name ?? '';
            } catch (error) {
                console.error('Error loading user info:', error);
            }
        }
    </script>
</th:block>

</body>
</html>
