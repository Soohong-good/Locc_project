<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${training.title}">훈련 상세</title>
</head>

<body>

<main layout:fragment="content">
    <!-- Hero Section -->
    <section class="pt-32 pb-12 bg-slate-50 px-6">
        <div class="max-w-4xl mx-auto">
            <!-- 뒤로가기 -->
            <a th:href="@{/training}" class="inline-flex items-center gap-2 text-slate-600 hover:text-slate-900 mb-6 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                <span>목록으로</span>
            </a>

            <!-- 상태 배지 -->
            <div class="flex items-center gap-3 mb-4">
                <span th:if="${training.status.name() == 'OPEN'}"
                      class="px-4 py-1.5 bg-green-100 text-green-700 text-sm font-medium">신청가능</span>
                <span th:if="${training.status.name() == 'CLOSED'}"
                      class="px-4 py-1.5 bg-gray-100 text-gray-700 text-sm font-medium">마감</span>
                
                <span th:if="${training.trainingFee == 0}"
                      class="px-4 py-1.5 bg-blue-100 text-blue-700 text-sm font-medium">무료</span>
            </div>

            <h1 class="text-3xl md:text-4xl font-medium text-slate-900 mb-6" th:text="${training.title}">제자훈련 2025년 1기</h1>
        </div>
    </section>

    <!-- 본문 -->
    <section class="py-12 bg-white px-6">
        <div class="max-w-4xl mx-auto">
            <!-- 훈련 정보 -->
            <div class="bg-slate-50 border border-slate-200 p-6 mb-8">
                <h2 class="text-lg font-medium text-slate-900 mb-4">훈련 정보</h2>
                <div class="grid md:grid-cols-2 gap-4 text-sm">
                    <div class="flex items-start gap-3">
                        <svg class="w-5 h-5 text-slate-400 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <div>
                            <p class="text-slate-600 mb-1">훈련 기간</p>
                            <p class="text-slate-900 font-medium">
                                <span th:text="${#temporals.format(training.startDate, 'yyyy년 MM월 dd일')}"></span> ~ 
                                <span th:text="${#temporals.format(training.endDate, 'yyyy년 MM월 dd일')}"></span>
                            </p>
                        </div>
                    </div>

                    <div class="flex items-start gap-3">
                        <svg class="w-5 h-5 text-slate-400 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <div>
                            <p class="text-slate-600 mb-1">신청 마감</p>
                            <p class="text-slate-900 font-medium" 
                               th:text="${#temporals.format(training.applicationDeadline, 'yyyy년 MM월 dd일 HH:mm')}"></p>
                        </div>
                    </div>

                    <div class="flex items-start gap-3">
                        <svg class="w-5 h-5 text-slate-400 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                  d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <div>
                            <p class="text-slate-600 mb-1">훈련비</p>
                            <p th:if="${training.trainingFee > 0}" 
                               class="text-slate-900 font-medium">
                                <span th:text="${#numbers.formatInteger(training.trainingFee, 0, 'COMMA')}"></span>원
                            </p>
                            <p th:if="${training.trainingFee == 0}" 
                               class="text-green-600 font-medium">무료</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 훈련 설명 -->
            <div class="prose prose-slate max-w-none mb-8">
                <h2 class="text-lg font-medium text-slate-900 mb-4">훈련 소개</h2>
                <div class="text-slate-700 leading-relaxed whitespace-pre-wrap" 
                     th:utext="${training.description}">
                    훈련 설명이 들어갑니다.
                </div>
            </div>

            <!-- 신청 버튼 -->
            <div th:if="${training.canApply}" class="flex gap-3 justify-center py-8 border-t border-slate-200">
                <a sec:authorize="isAuthenticated()"
                   th:href="@{/training/application/apply/{trainingId}(trainingId=${training.id})}"
                   class="px-8 py-3 bg-blue-600 text-white hover:bg-blue-700 transition font-medium text-lg">
                    신청하기
                </a>
                <a sec:authorize="isAnonymous()"
                   th:href="@{/auth/login}"
                   class="px-8 py-3 bg-blue-600 text-white hover:bg-blue-700 transition font-medium text-lg">
                    로그인 후 신청
                </a>
            </div>

            <!-- 마감/완료 메시지 -->
            <div th:if="${!training.canApply}" class="text-center py-8 border-t border-slate-200">
                <p th:if="${training.status.name() == 'CLOSED'}" 
                   class="text-slate-600">신청이 마감되었습니다.</p>
                <p th:if="${training.status.name() == 'COMPLETED'}" 
                   class="text-slate-600">완료된 훈련입니다.</p>
            </div>

            <!-- 관리자 버튼 -->
            <div sec:authorize="hasRole('ADMIN')" class="flex gap-3 justify-center pt-6 border-t border-slate-200">
                <a th:href="@{/training/application/manage/{trainingId}(trainingId=${training.id})}"
                   class="px-6 py-2 bg-slate-900 text-white hover:bg-slate-800 transition">
                    신청자 명단
                </a>
                <a th:href="@{/training/admin/edit/{id}(id=${training.id})}"
                   class="px-6 py-2 border border-slate-300 hover:border-slate-900 transition text-slate-700 hover:text-slate-900">
                    수정
                </a>
                <button onclick="if(confirm('정말 삭제하시겠습니까?')) deleteTraining()"
                        class="px-6 py-2 border border-red-300 hover:border-red-500 transition text-red-600 hover:text-red-700">
                    삭제
                </button>
            </div>
        </div>
    </section>
</main>

<th:block layout:fragment="extra-scripts">
<script th:inline="javascript">
    const trainingId = /*[[${training.id}]]*/ 0;

    async function deleteTraining() {
        try {
            const token = localStorage.getItem('accessToken');
            const headers = {
                'Content-Type': 'application/json'
            };

            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const response = await fetch(`/api/trainings/${trainingId}`, {
                method: 'DELETE',
                headers: headers
            });

            if (response.ok) {
                alert('훈련이 삭제되었습니다.');
                window.location.href = '/training';
            } else {
                alert('삭제에 실패했습니다.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('오류가 발생했습니다.');
        }
    }
</script>
</th:block>

</body>
</html>
