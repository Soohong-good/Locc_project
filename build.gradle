plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'locc'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    
    // OAuth2 Client (소셜 로그인)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    implementation 'me.paulschwarz:spring-dotenv:3.0.0'

    // YouTube Data API
    implementation 'com.google.apis:google-api-services-youtube:v3-rev20240514-2.0.0'
    implementation 'com.google.api-client:google-api-client:2.2.0'
    implementation 'com.google.http-client:google-http-client-jackson2:1.43.3'
    implementation 'com.google.oauth-client:google-oauth-client-jetty:1.34.1'

    // 이미지 썸네일 생성
    implementation 'net.coobird:thumbnailator:0.4.20'
    
    // PDF 처리 및 첫 페이지 이미지 추출
    implementation 'org.apache.pdfbox:pdfbox:2.0.31'

    // TOTP 2차 인증 (Google Authenticator 호환)
    implementation 'dev.samstevens.totp:totp:1.7.1'

    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    // ✅ 여기까지 추가



    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport   // 테스트 후 커버리지 리포트 자동 생성
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true        // CI 배지 생성용
        html.required = true       // 사람이 보는 리포트
        csv.required = true        // jacoco-badge-generator 입력용
    }
    // entity/dto/config 등 로직이 없는 계층을 커버리지 분모에서 제외해 "로직 커버리지"로 측정
    afterEvaluate {
        classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: [
                    '**/entity/**',
                    '**/dto/**',
                    '**/config/**',
                    '**/exception/**',
                    '**/controller/**',
                    '**/security/**',
                    '**/common/**',
                    '**/*Application.class', // 메인 클래스(LoccApplication) 등 "Application"으로 끝나는 것만 — *Application*(양쪽 와일드카드)로 쓰면 ApplicationExcelService처럼 이름에 포함만 된 실제 서비스까지 잘못 제외됨
                ])
            })
        )
    }
}

// plain JAR 생성 비활성화 (Docker 빌드 시 *.jar 중복 방지)
jar {
    enabled = false
}