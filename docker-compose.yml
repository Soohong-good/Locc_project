version: '3.8'

services:

  # ── MariaDB ──────────────────────────────────────────────────────
  db:
    image: mariadb:11.2
    container_name: locc-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - locc-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Rate Limit + 토큰 저장) ───────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: locc-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --protected-mode yes
    ports:
      - "127.0.0.1:6379:6379"   # 외부 노출 차단 — 호스트 루프백에서만 접근
    volumes:
      - redis_data:/data
    networks:
      - locc-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot 백엔드 ────────────────────────────────────────────
  # 포트를 외부에 노출하지 않음 — Nginx(locc-nginx)를 통해서만 접근
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: locc-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # 데이터베이스 (Spring relaxed binding: SPRING_DATASOURCE_* → spring.datasource.*)
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # 이메일 (회원가입 인증 등)
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      # OAuth2 소셜 로그인
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_REDIRECT_URI: ${APP_DOMAIN}/login/oauth2/code/kakao
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      NAVER_REDIRECT_URI: ${APP_DOMAIN}/login/oauth2/code/naver
      APP_OAUTH2_REDIRECT_URL: ${APP_DOMAIN}/oauth2/callback

      # 외부 API 키
      KAKAO_MAP_API_KEY: ${KAKAO_MAP_API_KEY}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}

      # CORS — Nginx 단일 도메인 구조이므로 실제 도메인 1개
      APP_CORS_ORIGIN_1: ${APP_DOMAIN}

      # 파일 업로드
      FILE_UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-20MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-100MB}

      # 로그 파일
      LOG_FILE_NAME: /app/logs/application.log

    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - locc-network

  # ── Nginx + React 프론트엔드 ──────────────────────────────────────
  # React를 빌드하고 Nginx로 서빙 + /api/** 를 Spring Boot로 프록시
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_APP_NAME=${VITE_APP_NAME:-그리스도사랑교회}
        - VITE_KAKAO_MAP_KEY=${KAKAO_MAP_API_KEY}
    container_name: locc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - app
    networks:
      - locc-network

# ── 데이터 영속성 볼륨 ─────────────────────────────────────────────
volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:        # 업로드 파일 (재배포 시에도 유지)
    driver: local
  logs_data:           # Spring Boot 로그 (재배포 시에도 유지)
    driver: local

# ── 컨테이너 간 통신 네트워크 ─────────────────────────────────────
networks:
  locc-network:
    driver: bridge
