server {
    listen 80;
    server_name _;

    # 파일 업로드 크기 — Spring Boot max-request-size(100MB)와 일치
    client_max_body_size 100m;

    # Gzip 압축
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        text/xml
        application/xml
        image/svg+xml;
    gzip_min_length 1024;

    # 정적 파일 루트
    root /usr/share/nginx/html;
    index index.html;

    # ── 공통 프록시 설정 ──────────────────────────────────────────
    # Spring Boot로 전달할 때 원래 Host/IP/Proto 정보 유지
    # Spring Boot SecurityConfig의 forward-headers-strategy: FRAMEWORK 와 연동

    # ── /api/** → Spring Boot ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 파일 업로드 타임아웃 (대용량 파일 업로드 대비)
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout  30s;

        # 클라이언트 업로드를 버퍼링 없이 바로 전달 (메모리 절약)
        proxy_request_buffering off;
    }

    # ── /uploads/** → Spring Boot (갤러리 등 정적 파일 서빙) ──────
    location /uploads/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 이미지 캐싱 (프록시 응답)
        proxy_cache_valid 200 1d;
    }

    # ── /oauth2/** → Spring Boot (소셜 로그인 시작) ──────────────
    location /oauth2/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── /login/oauth2/** → Spring Boot (OAuth2 콜백) ─────────────
    # 주의: /login 단독 경로는 React 라우트이므로 여기서 처리하지 않음
    location /login/oauth2/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 정적 자산 캐싱 (Vite 빌드 해시 파일) ────────────────────
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── React SPA ─────────────────────────────────────────────────
    # 위 location 블록에서 매칭되지 않은 모든 경로 → index.html fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
