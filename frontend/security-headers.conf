# 보안 응답 헤더 — nginx.conf에서 include
# nginx는 location에 add_header가 하나라도 있으면 상위(server) 블록의 add_header를 상속하지 않으므로,
# 정적 파일을 직접 응답하는 location마다 이 파일을 include 한다.
# (Spring Boot로 프록시하는 location은 Spring Security가 X-Frame-Options 등을 직접 붙이므로 제외 — 중복 방지)

# HTTPS 강제 (1년) — 브라우저가 이후 http 접속을 자동으로 https로 전환
add_header Strict-Transport-Security "max-age=31536000" always;
# 다른 사이트가 iframe으로 이 사이트를 감싸는 것(클릭재킹) 차단
add_header X-Frame-Options "SAMEORIGIN" always;
# MIME 스니핑 방지
add_header X-Content-Type-Options "nosniff" always;
# 외부 사이트로 이동 시 전체 URL 대신 도메인만 전달
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
